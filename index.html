<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - Professional v3.6</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --whatsapp: #25D366;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
            --danger: #ef4444;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        .search-panel {
            background: var(--card-bg); padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1001;
            border-bottom: 1px solid #e5e7eb;
        }

        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label {
            display: block; font-size: 10px; font-weight: 800;
            margin-bottom: 4px; color: var(--gray-text);
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        input {
            width: 100%; padding: 12px 115px 12px 14px;
            border: 1.5px solid #e5e7eb; border-radius: 12px;
            box-sizing: border-box; font-size: 15px; outline: none;
            background: #f9fafb; transition: all 0.2s ease;
            text-overflow: ellipsis;
        }

        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1); }

        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 2px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; border-radius: 8px; font-size: 16px; }
        .icon-btn:hover { background: #f3f4f6; }
        .icon-btn.reset { color: var(--danger); font-weight: bold; font-size: 18px; }

        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; z-index: 2000; max-height: 250px;
            overflow-y: auto; display: none; border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); margin-top: 2px;
        }

        .autocomplete-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
        .loc-name { font-weight: 600; font-size: 14px; display: block; color: #111; }
        .loc-addr { font-size: 11px; color: var(--gray-text); }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .swap-btn {
            position: absolute; right: 24px; top: 76px; z-index: 1005;
            background: white; border: 1px solid #e5e7eb; border-radius: 50%;
            width: 36px; height: 36px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; color: var(--primary);
        }

        .results-card {
            position: fixed; bottom: 24px; left: 16px; right: 16px;
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1002;
            display: none; animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        #fare { font-size: 34px; font-weight: 800; color: var(--primary); margin: 0; }
        .mode-badge { background:#ecfdf5; color:var(--primary); padding:6px 12px; border-radius:30px; font-size:11px; font-weight:700; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .btn { 
            padding: 14px; border-radius: 12px; text-align: center; 
            text-decoration: none; font-weight: 700; font-size: 15px; color: white; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-wa { background: var(--whatsapp); }
        .btn-nav { background: #3b82f6; }
        
        .loader {
            width: 20px; height: 20px; border: 3px solid #ecfdf5;
            border-bottom-color: var(--primary); border-radius: 50%;
            display: inline-block; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="search-panel">
        <div class="input-group">
            <label>Pickup Location</label>
            <input type="text" id="pickup" placeholder="Search for pickup..." autocomplete="off">
            <div class="btn-container">
                <button class="icon-btn reset" onclick="clearInput('pickup')" title="Clear Pickup">✕</button>
                <button class="icon-btn" id="gps-trigger" title="Use GPS">📍</button>
            </div>
            <div id="pickup-results" class="autocomplete-list"></div>
        </div>

        <button class="swap-btn" id="swap-btn">⇅</button>

        <div class="input-group">
            <label>Destination</label>
            <input type="text" id="dropoff" placeholder="Search for destination..." autocomplete="off">
            <div class="btn-container">
                <button class="icon-btn reset" onclick="clearInput('dropoff')" title="Clear Destination">✕</button>
            </div>
            <div id="dropoff-results" class="autocomplete-list"></div>
        </div>

        <div class="input-group" style="margin-bottom: 0;">
            <label>Travel Schedule</label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="datetime-local" id="departure-time">
                <button class="icon-btn" id="reset-all" title="Reset All" style="color: var(--danger); border: 1px solid #eee; border-radius: 8px;">🔄</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div id="results" class="results-card">
        <div id="loading-state" style="text-align: center; padding: 10px;">
            <span class="loader"></span><br>Calculating Route...
        </div>
        <div id="fare-content" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2 id="fare">RM 0</h2>
                <span id="mode-badge" class="mode-badge">Standard</span>
            </div>
            <div style="display:flex; gap:20px; font-size:14px; color: #4b5563; background: #f9fafb; padding: 10px; border-radius: 10px;">
                <span>📏 <b id="distance">0 km</b></span>
                <span>⏱️ <b id="eta">0 min</b></span>
            </div>
            <div class="btn-group">
                <a id="wa-btn" class="btn btn-wa" target="_blank">WhatsApp Book</a>
                <a id="nav-btn" class="btn btn-nav" target="_blank">Navigation</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const CONFIG = {
            WHATSAPP: "60108988182",
            GEOAPIFY_KEY: "2b559c27fae04fbb819d32bda10c0d05",
            CENTER: [3.139, 101.686],
            BBOX: "99.5,1.2,103.6,6.8",
            MIN_FARE: 10.00 
        };

        const $ = id => document.getElementById(id);
        let pickupCoord, dropoffCoord, routeLayer, pickupMarker, dropoffMarker, searchTimer;

        const map = L.map("map", { zoomControl: false, attributionControl: false }).setView(CONFIG.CENTER, 13);
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

        function setDefaultTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            $("departure-time").value = now.toISOString().slice(0,16);
        }
        setDefaultTime();

        async function searchPlaces(query, resultId, type) {
            clearTimeout(searchTimer);
            if (query.length < 3) { $(resultId).style.display = 'none'; return; }

            searchTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://api.geoapify.com/v1/geocode/autocomplete?text=${encodeURIComponent(query)}&filter=rect:${CONFIG.BBOX}&apiKey=${CONFIG.GEOAPIFY_KEY}`);
                    const data = await res.json();
                    renderResults(data.features, resultId, type);
                } catch (e) { console.error("Search error:", e); }
            }, 400);
        }

        function renderResults(features, resultId, type) {
            const list = $(resultId);
            list.innerHTML = features.map(f => {
                const p = f.properties;
                return `<div class="autocomplete-item" onclick="selectLoc('${type}', [${p.lat}, ${p.lon}], '${p.formatted.replace(/'/g, "\\'")}')">
                    <span class="loc-name">${p.name || p.street || 'Point of Interest'}</span>
                    <span class="loc-addr">${p.city || p.state || ''}</span>
                </div>`;
            }).join('');
            list.style.display = features.length ? 'block' : 'none';
        }

        function selectLoc(type, coord, label) {
            $(type).value = label;
            $(`${type}-results`).style.display = 'none';
            
            if (type === 'pickup') {
                if (pickupMarker) map.removeLayer(pickupMarker);
                pickupCoord = coord;
                pickupMarker = L.circleMarker(coord, {color: '#3b82f6', fillOpacity: 1, radius: 8}).addTo(map);
                localStorage.setItem('lastPickup', JSON.stringify({label, coord}));
            } else {
                if (dropoffMarker) map.removeLayer(dropoffMarker);
                dropoffCoord = coord;
                dropoffMarker = L.circleMarker(coord, {color: '#ef4444', fillOpacity: 1, radius: 8}).addTo(map);
            }
            
            if (pickupCoord && dropoffCoord) calculate();
            else map.setView(coord, 15);
        }

        async function calculate() {
            $("results").style.display = 'block';
            $("fare-content").style.display = 'none';
            $("loading-state").style.display = 'block';

            try {
                const wp = `${pickupCoord[1]},${pickupCoord[0]}|${dropoffCoord[1]},${dropoffCoord[0]}`;
                const url = `https://api.geoapify.com/v1/routing?waypoints=${wp}&mode=drive&apiKey=${CONFIG.GEOAPIFY_KEY}`;
                
                const res = await fetch(url);
                const data = await res.json();

                if (!data.features?.length) throw new Error("No route found");
                
                const props = data.features[0].properties;
                const km = props.distance / 1000;
                const mins = props.time / 60;

                const baseFare = 4.00;
                let distCost = (km <= 80) ? (km * 1.30) : (80 * 1.30) + ((km - 80) * 1.95);
                const hr = new Date($("departure-time").value).getHours();
                let multiplier = 1.0, mode = km > 80 ? "Long Trip" : "Standard";

                if (hr >= 0 && hr < 6) { multiplier = 1.5; mode += " (Midnight)"; }
                else if ((hr >= 7 && hr < 10) || (hr >= 17 && hr < 20)) { distCost += (mins * 0.40); mode += " (Peak)"; }

                let calculatedFare = (baseFare + distCost) * multiplier;
                if (calculatedFare < CONFIG.MIN_FARE) {
                    calculatedFare = CONFIG.MIN_FARE;
                    mode += " (Min Fare)";
                }

                const finalFare = Math.ceil(calculatedFare);

                $("fare").innerText = `RM ${finalFare}`;
                $("distance").innerText = `${km.toFixed(1)} km`;
                $("eta").innerText = `${Math.round(mins)} min`;
                $("mode-badge").innerText = mode;

                const navUrl = `https://www.google.com/maps/dir/?api=1&origin=${pickupCoord[0]},${pickupCoord[1]}&destination=${dropoffCoord[0]},${dropoffCoord[1]}&travelmode=driving`;
                $("nav-btn").href = navUrl;

                const msg = encodeURIComponent(`*Booking Request*\n---\n*From:* ${$("pickup").value}\n*To:* ${$("dropoff").value}\n---\n*Est. Fare:* RM ${finalFare}\n*Dist:* ${km.toFixed(1)}km`);
                $("wa-btn").href = `https://wa.me/${CONFIG.WHATSAPP}?text=${msg}`;

                if (routeLayer) map.removeLayer(routeLayer);
                const polyCoords = data.features[0].geometry.coordinates[0].map(c => [c[1], c[0]]);
                routeLayer = L.polyline(polyCoords, { color: '#059669', weight: 6 }).addTo(map);
                map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

                $("loading-state").style.display = 'none';
                $("fare-content").style.display = 'block';
            } catch (e) {
                $("loading-state").innerHTML = '<span style="color:#ef4444">Error fetching route. Please try again.</span>';
            }
        }

        function clearInput(type) {
            $(type).value = "";
            $(`${type}-results`).style.display = 'none';
            if (type === 'pickup') {
                if (pickupMarker) map.removeLayer(pickupMarker);
                pickupCoord = null;
            } else {
                if (dropoffMarker) map.removeLayer(dropoffMarker);
                dropoffCoord = null;
            }
            if (routeLayer) map.removeLayer(routeLayer);
            $("results").style.display = 'none';
        }

        $("reset-all").onclick = () => {
            clearInput('pickup');
            clearInput('dropoff');
            map.setView(CONFIG.CENTER, 13);
            setDefaultTime();
        };

        $("gps-trigger").onclick = () => {
            if (!navigator.geolocation) return alert("GPS not supported");
            $("pickup").value = "Locating...";
            navigator.geolocation.getCurrentPosition(async (p) => {
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                try {
                    const res = await fetch(`https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=${CONFIG.GEOAPIFY_KEY}`);
                    const data = await res.json();
                    const addr = (data.features && data.features.length > 0) ? data.features[0].properties.formatted : "Current Location";
                    selectLoc('pickup', [lat, lon], addr);
                } catch (e) {
                    selectLoc('pickup', [lat, lon], "Current Location");
                }
            }, () => {
                $("pickup").value = "";
                alert("GPS Permission Denied");
            });
        };

        window.onload = () => {
            const last = localStorage.getItem('lastPickup');
            if(last) {
                const data = JSON.parse(last);
                selectLoc('pickup', data.coord, data.label);
            }
        };

        $("pickup").oninput = e => searchPlaces(e.target.value, "pickup-results", "pickup");
        $("dropoff").oninput = e => searchPlaces(e.target.value, "dropoff-results", "dropoff");
        
        $("swap-btn").onclick = () => {
            const v1 = $("pickup").value, v2 = $("dropoff").value;
            const c1 = pickupCoord, c2 = dropoffCoord;
            $("pickup").value = v2; $("dropoff").value = v1;
            pickupCoord = c2; dropoffCoord = c1;
            if (pickupMarker) map.removeLayer(pickupMarker);
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            if (pickupCoord) pickupMarker = L.circleMarker(pickupCoord, {color: '#3b82f6', fillOpacity: 1, radius: 8}).addTo(map);
            if (dropoffCoord) dropoffMarker = L.circleMarker(dropoffCoord, {color: '#ef4444', fillOpacity: 1, radius: 8}).addTo(map);
            if (pickupCoord && dropoffCoord) calculate();
        };

        document.addEventListener('click', e => {
            if (!e.target.closest('.input-group')) document.querySelectorAll('.autocomplete-list').forEach(l => l.style.display = 'none');
        });
    </script>
</body>
</html>
