<script>
const CONFIG = {
    WHATSAPP: "60108988182",
    ORS_KEY: "YOUR_API_KEY_HERE",
    CENTER: [3.139, 101.686],
    BBOX: "99.6,1.15,104.4,6.95",
    TRAFFIC_MULTIPLIER: 1.25
};

const FARE_CONFIG = {
    BASE: 5.00,
    MINUTE: 0.30,
    MIN_FARE: 8,
    MIN_DISTANCE_KM: 2,
    TIERS: [
        { upTo: 10, rate: 0.70 },
        { upTo: 25, rate: 0.90 },
        { upTo: 50, rate: 1.25 },
        { upTo: 75, rate: 1.55 },
        { upTo: 120, rate: 1.85 },
        { upTo: Infinity, rate: 2.00 }
    ]
};

const BOUNDS = [[1.15, 99.6], [6.95, 104.4]];
const $ = id => document.getElementById(id);

let pickupCoord, dropoffCoord, pickupMarker, dropoffMarker, route;
let cache = {};
let timer;
let activeField = "pickup";

const map = L.map("map", { zoomControl: false, maxBounds: BOUNDS })
    .setView(CONFIG.CENTER, 13);

L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: "© OpenStreetMap contributors © CARTO"
}).addTo(map);

const fetchJSON = url => fetch(url).then(r => r.json());

/* ---------------- FORMATTERS ---------------- */

function formatETA(mins) {
    const h = Math.floor(mins / 60);
    const m = Math.round(mins % 60);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function formatRM(value) {
    return `RM ${Math.round(value)}`;
}

/* ---------------- POLYLINE ---------------- */

function decodePolyline(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

/* ---------------- ADDRESS LOGIC ---------------- */

// Prioritize POI names + clean short address
function buildAddress(p) {
    if (!p) return "Unknown Location";

    const poi = p.name;
    const street = [p.housenumber, p.street].filter(Boolean).join(" ");
    const area = p.district;
    const city = p.city || p.town || p.village;
    const state = p.state;

    // Priority: POI → Street → Area → City
    let parts = [];

    if (poi) parts.push(poi);
    if (street && street !== poi) parts.push(street);
    if (area && area !== street) parts.push(area);
    if (city) parts.push(city);
    if (state) parts.push(state);

    // Remove duplicates + limit to max 3 parts (trim long addresses)
    const clean = [...new Set(parts)].slice(0, 3);

    return clean.join(", ");
}

/* ---------------- GEO ---------------- */

async function reverseGeocode(lat, lng) {
    try {
        const res = await fetchJSON(`https://photon.komoot.io/reverse?lon=${lng}&lat=${lat}`);
        if (res.features?.length) {
            return buildAddress(res.features[0].properties);
        }
    } catch {}
    return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}

/* ---------------- MAP POINT ---------------- */

function setPoint(type, coord, name) {
    const isPickup = type === "pickup";

    if (isPickup) pickupCoord = coord;
    else dropoffCoord = coord;

    $(type).value = name;

    let marker = isPickup ? pickupMarker : dropoffMarker;
    if (marker) map.removeLayer(marker);

    marker = L.circleMarker(coord, {
        radius: 7,
        color: isPickup ? "#059669" : "#ef4444",
        fillOpacity: 1
    }).addTo(map);

    if (isPickup) pickupMarker = marker;
    else dropoffMarker = marker;

    if (pickupCoord && dropoffCoord) routeTrip();
}

/* ---------------- ROUTING ---------------- */

async function routeTrip() {
    const key = `${pickupCoord.join(",")}-${dropoffCoord.join(",")}`;
    if (cache[key]) return draw(cache[key]);

    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: {
                Authorization: CONFIG.ORS_KEY,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                coordinates: [
                    [pickupCoord[1], pickupCoord[0]],
                    [dropoffCoord[1], dropoffCoord[0]]
                ]
            })
        });

        const data = await res.json();
        if (!data.routes?.length) return alert("No route found");

        cache[key] = data.routes[0];
        draw(data.routes[0]);

    } catch {
        alert("Routing service unavailable.");
    }
}

function draw(r) {
    if (route) map.removeLayer(route);

    const coords = decodePolyline(r.geometry);
    route = L.polyline(coords, { color: "#059669", weight: 4 }).addTo(map);

    map.fitBounds(route.getBounds(), { padding: [40, 40] });

    const km = r.summary.distance / 1000;
    const mins = (r.summary.duration / 60) * CONFIG.TRAFFIC_MULTIPLIER;

    calcFare(km, mins);
}

/* ---------------- FARE ---------------- */

function calcFare(km, mins) {
    let distanceCost = 0;
    let remaining = km;
    let prev = 0;

    for (const tier of FARE_CONFIG.TIERS) {
        if (remaining <= 0) break;

        const tierDist = Math.min(remaining, tier.upTo - prev);
        distanceCost += tierDist * tier.rate;

        remaining -= tierDist;
        prev = tier.upTo;
    }

    const timeCost = mins * FARE_CONFIG.MINUTE;
    let total = FARE_CONFIG.BASE + distanceCost + timeCost;

    // Minimum fare rule
    if (km < FARE_CONFIG.MIN_DISTANCE_KM) {
        total = Math.max(total, FARE_CONFIG.MIN_FARE);
    }

    total = Math.round(total);

    $("results").style.display = "block";
    $("fare").innerText = formatRM(total);
    $("distance").innerText = `${km.toFixed(1)} km`;
    $("eta").innerText = formatETA(mins);

    const msg = `Ride Booking

From: ${$("pickup").value}
To: ${$("dropoff").value}

Distance: ${km.toFixed(1)} km
ETA: ${formatETA(mins)}
Fare: RM ${total}`;

    $("wa").href = `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`;
}

/* ---------------- SEARCH ---------------- */

function renderResults(list, id, type) {
    const el = $(id);
    el.innerHTML = "";

    list.forEach(i => {
        const p = i.properties;
        const name = p.name || p.street || "Location";
        const addr = buildAddress(p);

        const div = document.createElement("div");
        div.className = "autocomplete-item";
        div.innerHTML = `
            <div class="place-name">${name}</div>
            <div class="place-address">${addr}</div>
        `;

        div.onclick = () => {
            setPoint(type,
                [i.geometry.coordinates[1], i.geometry.coordinates[0]],
                name
            );
            el.style.display = "none";
        };

        el.appendChild(div);
    });

    el.style.display = "block";
}

function search(val, id, type) {
    clearTimeout(timer);
    if (val.length < 3) return;

    timer = setTimeout(async () => {
        try {
            const res = await fetchJSON(
                `https://photon.komoot.io/api/?q=${val}&limit=6&bbox=${CONFIG.BBOX}&lang=en`
            );
            renderResults(res.features || [], id, type);
        } catch {}
    }, 300);
}

/* ---------------- EVENTS ---------------- */

$("pickup").onfocus = () => activeField = "pickup";
$("dropoff").onfocus = () => activeField = "dropoff";

$("pickup").oninput = e => search(e.target.value, "pickup-results", "pickup");
$("dropoff").oninput = e => search(e.target.value, "dropoff-results", "dropoff");

map.on("click", async e => {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    $(activeField).value = "Locating...";

    const address = await reverseGeocode(lat, lng);
    setPoint(activeField, [lat, lng], address);
});

/* ---------------- GPS ---------------- */

function getLocation() {
    if (!navigator.geolocation) {
        alert("Geolocation not supported.");
        return;
    }

    activeField = "pickup";
    $("pickup").value = "Locating...";

    navigator.geolocation.getCurrentPosition(async p => {
        const lat = p.coords.latitude;
        const lng = p.coords.longitude;

        const address = await reverseGeocode(lat, lng);
        setPoint("pickup", [lat, lng], address);

        map.setView([lat, lng], 15);

    }, () => {
        $("pickup").value = "";
        alert("GPS access denied.");
    });
}
</script>
