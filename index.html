<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v7.0.0 PRO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --gray-text: #6b7280; }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .search-panel { background: var(--card-bg); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1005; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gray-text); text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #f9fafb; }
        
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 10000; max-height: 300px; overflow-y: auto; border-radius: 0 0 16px 16px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); display: none; border: 1px solid #eee; }
        .autocomplete-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9fafb; }
        .venue-hotspot { background: #f0fdf4; border-left: 4px solid var(--primary); }
        
        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 4px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: #9ca3af; font-size: 18px; }
        
        .results-card { position: fixed; bottom: 20px; left: 16px; right: 16px; background: white; padding: 20px; border-radius: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 1002; transition: 0.4s; transform: translateY(150%); opacity: 0; }
        .results-card.visible { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="input-group">
        <label>Pickup (Tap map or use GPS)</label>
        <input type="text" id="pickup" placeholder="Set pickup..." autocomplete="off">
        <div class="btn-container">
            <button id="gps-btn" class="icon-btn" title="Use GPS">📍</button>
        </div>
        <div id="p-results" class="autocomplete-list"></div>
    </div>
    <div class="input-group" style="margin-bottom:0;">
        <label>Destination (SCM Entrances available)</label>
        <input type="text" id="dropoff" placeholder="Where to?" autocomplete="off">
        <div id="d-results" class="autocomplete-list"></div>
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <h2 id="fare" style="margin:0; color:var(--primary); font-size:32px;">RM 0</h2>
    <p id="summary" style="font-size:12px; color:#4b5563; margin: 8px 0;"></p>
    <button onclick="location.reload()" style="width:100%; padding:10px; border-radius:10px; border:none; background:#f1f5f9; font-weight:bold; cursor:pointer;">Reset App</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    HOTSPOTS: [
        { name: "SCM - Main Entrance (Lobby A)", lat: 3.1095, lon: 101.4602, keywords: ["scm", "setia city", "mall"] },
        { name: "SCM - Park Entrance (Lobby B)", lat: 3.1085, lon: 101.4590, keywords: ["scm", "setia city", "mall"] },
        { name: "SCM - North Entrance (Lobby C)", lat: 3.1110, lon: 101.4585, keywords: ["scm", "setia city", "mall"] }
    ]
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer, pMarker, dMarker;

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([3.1478, 101.6953], 12);

L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3']
}).addTo(map);

// REFRESH / SELECT LOGIC
function selectLoc(type, coord, label) {
    if (type === 'pickup') {
        pickupCoord = coord;
        $("pickup").value = label;
        $("p-results").style.display = 'none';
        if (pMarker) map.removeLayer(pMarker);
        pMarker = L.circleMarker(coord, { radius: 8, color: '#059669', fillOpacity: 1 }).addTo(map);
    } else {
        dropoffCoord = coord;
        $("dropoff").value = label;
        $("d-results").style.display = 'none';
        if (dMarker) map.removeLayer(dMarker);
        dMarker = L.circleMarker(coord, { radius: 8, color: '#ef4444', fillOpacity: 1 }).addTo(map);
        
        // AUTO-ZOOM FIX
        setTimeout(() => {
            map.flyTo(coord, 18, { animate: true, duration: 1.5 });
        }, 100);
    }
    if (pickupCoord && dropoffCoord) calculate();
}

// GPS BUTTON FIX
$("gps-btn").onclick = () => {
    if (!navigator.geolocation) return alert("Geolocation not supported");
    
    $("gps-btn").innerText = "⌛"; // Visual feedback
    navigator.geolocation.getCurrentPosition(
        pos => {
            const coord = [pos.coords.latitude, pos.coords.longitude];
            selectLoc('pickup', coord, "Current Location");
            map.setView(coord, 15);
            $("gps-btn").innerText = "📍";
        },
        err => {
            alert("Please enable location permissions");
            $("gps-btn").innerText = "📍";
        },
        { enableHighAccuracy: true }
    );
};

// SEARCH LOGIC
async function search(query, resultsId, type) {
    if (query.length < 3) { $(resultsId).style.display = 'none'; return; }
    
    const q = query.toLowerCase();
    const hotspots = CONFIG.HOTSPOTS.filter(h => h.keywords.some(k => q.includes(k)));
    
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=my&limit=5`);
        const data = await res.json();
        
        let html = '';
        hotspots.forEach(h => {
            html += `<div class="autocomplete-item venue-hotspot" onclick="selectLoc('${type}', [${h.lat}, ${h.lon}], '${h.name}')">
                <div style="font-size:20px">🏢</div>
                <div><b>${h.name}</b><br><small>Verified Entry Point</small></div>
            </div>`;
        });
        
        data.forEach(r => {
            html += `<div class="autocomplete-item" onclick="selectLoc('${type}', [${r.lat}, ${r.lon}], '${r.display_name.split(',')[0]}')">
                <div style="font-size:20px">📍</div>
                <div><b>${r.display_name.split(',')[0]}</b><br><small>${r.display_name.split(',').slice(1,3).join(',')}</small></div>
            </div>`;
        });
        
        $(resultsId).innerHTML = html;
        $(resultsId).style.display = 'block';
    } catch (e) { console.error(e); }
}

// ROUTE & FARE
async function calculate() {
    const url = `https://api.openrouteservice.org/v2/directions/driving-car?api_key=${CONFIG.ORS_KEY}&start=${pickupCoord[1]},${pickupCoord[0]}&end=${dropoffCoord[1]},${dropoffCoord[0]}`;
    const res = await fetch(url);
    const data = await res.json();
    const route = data.features[0];
    const km = route.properties.summary.distance / 1000;
    
    $("fare").innerText = `RM ${Math.round(5 + (km * 1.25))}`;
    $("summary").innerText = `${km.toFixed(1)} km distance`;
    $("results").classList.add('visible');
    
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.geoJSON(route, { style: { color: '#059669', weight: 5 } }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
}

// INPUT LISTENERS
$("pickup").oninput = e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => search(e.target.value, "p-results", "pickup"), 500); };
$("dropoff").oninput = e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => search(e.target.value, "d-results", "dropoff"), 500); };

// MAP CLICK FIX
map.on('click', e => {
    const coord = [e.latlng.lat, e.latlng.lng];
    if (!pickupCoord) selectLoc('pickup', coord, "Pinned Pickup");
    else selectLoc('dropoff', coord, "Pinned Destination");
});
</script>
</body>
</html>
