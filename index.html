<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rideshare MY Pro - Actual Toll System & Fare Estimator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f8f9fa;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    color:#212529;
}

#container{
    display:flex;
    flex-direction:column;
    height:100%;
    position:relative;
}

#map{
    height:33vh;
    width:100%;
    z-index:1;
}

#search-panel{
    flex:1;
    background:#fff;
    padding:16px 16px 32px;
    box-shadow:0 -4px 20px rgba(0,0,0,.08);
    z-index:10;
    border-top-left-radius:16px;
    border-top-right-radius:16px;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

.routing-wrapper{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:8px;
    margin-top:8px;
}

.input-container{
    position:relative;
    display:flex;
    align-items:center;
}

input{
    width:100%;
    padding:12px 64px 12px 12px;
    border:1px solid #e0e0e0;
    border-radius:8px;
    font-size:14px;
    background:#f9f9f9;
    transition:.2s;
}

#pickup{padding-right:88px}

input:focus{
    outline:none;
    border-color:#8e24aa;
    background:#fff;
    box-shadow:0 0 0 2px rgba(142,36,170,.1);
}

.action-group{
    position:absolute;
    right:8px;
    display:flex;
    align-items:center;
    gap:6px;
    z-index:5;
}

.icon-btn{
    border:none;
    background:none;
    color:#757575;
    font-size:14px;
    cursor:pointer;
    padding:6px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s;
}

.icon-btn:hover{
    background:#f0f0f0;
    color:#8e24aa;
}

.clear-btn{
    display:none;
    font-size:18px;
    color:#aaa;
}

.swap-container{
    position:absolute;
    right:48px;
    top:50%;
    transform:translateY(-50%);
    z-index:15;
}

.swap-btn{
    background:#fff;
    border:1px solid #e0e0e0;
    color:#8e24aa;
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    font-size:14px;
}

.suggestions{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:#fff;
    border:1px solid #e0e0e0;
    border-radius:8px;
    max-height:180px;
    overflow-y:auto;
    z-index:1000;
    box-shadow:0 6px 16px rgba(0,0,0,.1);
    display:none;
}

.suggestion-item{
    padding:12px;
    cursor:pointer;
    font-size:13px;
    border-bottom:1px solid #f5f5f5;
}

.suggestion-item:hover{
    background:#f5f5f5;
}

#result-card{
    background:#1c1c1e;
    color:#fff;
    padding:16px;
    border-radius:12px;
    margin-top:8px;
    margin-bottom:16px;
    display:none;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
}

.fare-header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.fare-header{
    font-size:42px;
    font-weight:900;
    color:#39ff14;
    line-height:1;
    text-shadow:0 0 10px rgba(57,255,20,.3);
}

.meta-distance,
.meta-duration{
    font-weight:700;
}

.meta-distance{
    font-size:16px;
    color:#fff;
}

.meta-duration{
    font-size:14px;
    color:#aeaeb2;
}

#invoice-details{
    margin-top:12px;
    border-top:1px dashed #3a3a3c;
    padding-top:12px;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    color:#aeaeb2;
    margin-bottom:8px;
}

.detail-row.total-bold{
    color:#fff;
    font-weight:600;
    border-top:1px solid #2c2c2e;
    padding-top:10px;
    font-size:16px;
}

#toll-breakdown{
    font-size:12px;
    color:#b0b0b5;
    margin-top:6px;
    padding-left:4px;
    border-left:2px solid #8e24aa;
}

#error-msg{
    color:#ff3b30;
    font-size:13px;
    margin-top:8px;
    display:none;
    font-weight:500;
}

@media(min-width:768px){
    #container{
        flex-direction:row-reverse;
    }

    #map{
        height:100%;
        flex:1;
    }

    #search-panel{
        width:420px;
        height:100%;
        border-radius:0;
        padding:24px 20px;
    }

    .fare-header{
        font-size:48px;
    }
}
</style>
</head>

<body>

<div id="container">

    <div id="map"></div>

    <div id="search-panel">

        <div class="routing-wrapper">

            <div class="input-container">
                <input type="text" id="pickup" placeholder="Pickup location..." autocomplete="off">

                <div class="action-group">
                    <button class="icon-btn" id="current-loc-btn">🎯</button>
                    <button class="icon-btn clear-btn" id="clear-pickup">&times;</button>
                </div>

                <div id="pickup-suggestions" class="suggestions"></div>
            </div>

            <div class="swap-container">
                <button class="swap-btn" id="swap-locations-btn">⇅</button>
            </div>

            <div class="input-container">
                <input type="text" id="dropoff" placeholder="Drop-off location..." autocomplete="off">

                <div class="action-group">
                    <button class="icon-btn clear-btn" id="clear-dropoff">&times;</button>
                </div>

                <div id="dropoff-suggestions" class="suggestions"></div>
            </div>

        </div>

        <div id="error-msg"></div>

        <div id="result-card">

            <div class="fare-header-row">

                <div class="fare-left-col">
                    <div id="total-fare" class="fare-header">RM --</div>
                </div>

                <div class="fare-right-col">
                    <span id="fare-distance" class="meta-distance">0 km</span>
                    <span id="fare-duration" class="meta-duration">0 mins</span>
                </div>

            </div>

            <div id="invoice-details">

                <div class="detail-row">
                    <span>Base Fare</span>
                    <span id="calc-base-fare">RM 5.00</span>
                </div>

                <div class="detail-row">
                    <span>Distance Fare</span>
                    <span id="calc-ride-distance-rate">RM 0.00</span>
                </div>

                <div class="detail-row" id="tolls-row">
                    <span>🚧 Toll Charges</span>
                    <span id="calc-tolls">RM 0.00</span>
                </div>

                <div id="toll-breakdown" style="display:none;"></div>

                <div class="detail-row">
                    <span>Traffic & Incentive</span>
                    <span id="calc-incentive">RM 0.00</span>
                </div>

                <div class="detail-row">
                    <span>Out-of-Zone Surcharge</span>
                    <span id="calc-deadhead-km">RM 0.00</span>
                </div>

                <div class="detail-row total-bold">
                    <span>Rounded Final Total</span>
                    <span id="calc-grand" style="color:#39ff14;">RM 0.00</span>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ==========================================================
// MAP INIT
// ==========================================================

const map = L.map('map').setView([3.1390,101.6869],11);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution:'© OpenStreetMap' }
).addTo(map);

const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=";

// ==========================================================
// GLOBALS
// ==========================================================

let pickupMarker = null;
let dropoffMarker = null;
let routeLine = null;

let pickupCoords = null;
let dropoffCoords = null;

let currentRouteTimeout = null;

// ==========================================================
// MALAYSIA TOLL DATABASE
// ==========================================================

const TOLL_DB = {

    operators: {
        PLUS:{ name:"PLUS Malaysia Berhad", system:"Hybrid" },
        LITRAK:{ name:"Lingkaran Trans Kota", system:"Open" },
        PROLINTAS:{ name:"Prolintas", system:"Open" },
        KESAS:{ name:"KESAS", system:"Open" },
        IJM:{ name:"IJM Expressway", system:"Open" },
        ANIH:{ name:"ANIH Berhad", system:"Hybrid" },
        LEKAS:{ name:"LEKAS", system:"Closed" },
        WCE:{ name:"West Coast Expressway", system:"Closed" },
        SMART:{ name:"SMART Tunnel", system:"Hybrid" },
        GRAND_SEPADU:{ name:"Grand Sepadu", system:"Open" },
        MEX:{ name:"Maju Expressway", system:"Open" },
        SKVE_OP:{ name:"SKVE Holdings", system:"Closed" },
        LATAR_OP:{ name:"LATAR", system:"Open" }
    },

    highways: {
        NSE:{ operator:"PLUS", name:"North South Expressway", system:"Closed", ratePerKm:0.114 },
        ELITE:{ operator:"PLUS", name:"ELITE", system:"Closed", ratePerKm:0.105 },
        LEKAS:{ operator:"LEKAS", name:"LEKAS Highway", system:"Closed", ratePerKm:0.13 },
        SKVE:{ operator:"SKVE_OP", name:"SKVE", system:"Closed", ratePerKm:0.134 },
        WCE:{ operator:"WCE", name:"West Coast Expressway", system:"Closed", ratePerKm:0.16 },
        LPT1:{ operator:"ANIH", name:"LPT1", system:"Closed", ratePerKm:0.13 },

        LDP:{ operator:"LITRAK", name:"LDP", system:"Open", fixedClass1:2.10 },
        SPRINT:{ operator:"PROLINTAS", name:"SPRINT", system:"Open", fixedClass1:2.50 },
        AKLEH:{ operator:"PROLINTAS", name:"AKLEH", system:"Open", fixedClass1:2.50 },
        DUKE:{ operator:"PROLINTAS", name:"DUKE", system:"Open", fixedClass1:2.50 },
        DASH:{ operator:"PROLINTAS", name:"DASH", system:"Open", fixedClass1:1.90 },
        SUKE:{ operator:"PROLINTAS", name:"SUKE", system:"Open", fixedClass1:2.30 },
        GCE:{ operator:"PROLINTAS", name:"Guthrie Corridor (GCE)", system:"Open", fixedClass1:1.90 },
        SILK:{ operator:"PROLINTAS", name:"SILK", system:"Open", fixedClass1:1.80 },
        
        KESAS:{ operator:"KESAS", name:"KESAS", system:"Open", fixedClass1:2.30 },
        NPE:{ operator:"IJM", name:"NPE", system:"Open", fixedClass1:2.00 },
        BESRAYA:{ operator:"IJM", name:"BESRAYA", system:"Open", fixedClass1:2.20 },
        
        NNKSB:{ operator:"GRAND_SEPADU", name:"New North Klang Straits Bypass (NNKSB)", system:"Open", fixedClass1:2.40 },
        MEX:{ operator:"MEX", name:"MEX Highway", system:"Open", fixedClass1:3.50 },
        LATAR:{ operator:"LATAR_OP", name:"LATAR", system:"Open", fixedClass1:2.50 },

        SMART:{ operator:"SMART", name:"SMART Tunnel", system:"Hybrid", peak:4.00, offpeak:3.00 }
    }
};

// ==========================================================
// REGIONAL BOUNDS
// ==========================================================

const REGIONAL_BOUNDS = {
    klangKapar:[3.00,101.35,3.18,101.52],
    johorBahru:[1.40,103.60,1.60,103.85],
    genting:[3.35,101.75,3.45,101.85],
    kelantan:[5.90,102.10,6.30,102.40],
    bangiKajang:[2.90,101.70,3.02,101.85],
    puncakPerdana:[3.10,101.45,3.16,101.55],
    klCenter:[3.10,101.65,3.17,101.75],
    damansara:[3.11,101.58,3.17,101.65],
    seremban:[2.65,101.85,2.78,102.00],
    putrajayaCyberjaya:[2.85,101.60,2.97,101.72]
};

// ==========================================================
// HELPERS
// ==========================================================

function inBoundingBox(coords,bbox){
    if(!coords) return false;
    return (
        coords.lat >= bbox[0] &&
        coords.lon >= bbox[1] &&
        coords.lat <= bbox[2] &&
        coords.lon <= bbox[3]
    );
}

function getActiveZonesForCoords(coords){
    if(!coords) return [];
    return Object.keys(REGIONAL_BOUNDS)
        .filter(zone => inBoundingBox(coords,REGIONAL_BOUNDS[zone]));
}

// ==========================================================
// ACTUAL TOLL ENGINE
// ==========================================================

function calculateActualToll(
    pickup,
    dropoff,
    distanceKm,
    routeHasTolls
){
    let total = 0;
    let breakdown = [];

    if(!routeHasTolls){
        return { total:0, breakdown:[] };
    }

    const originZones = getActiveZonesForCoords(pickup);
    const destZones = getActiveZonesForCoords(dropoff);
    const isLongDistance = distanceKm > 45;

    // ======================================================
    // CLOSED SYSTEM
    // ======================================================
    if(isLongDistance){
        let highway = TOLL_DB.highways.NSE;
        let toll = distanceKm * highway.ratePerKm;
        toll = Math.max(1.80,toll);

        total += toll;
        breakdown.push(`${highway.name} (${highway.system}) - RM ${toll.toFixed(2)}`);

        // LEKAS
        if(originZones.includes("bangiKajang") || destZones.includes("bangiKajang")){
            let lekas = TOLL_DB.highways.LEKAS;
            let lekasToll = distanceKm * lekas.ratePerKm * 0.35;
            total += lekasToll;
            breakdown.push(`${lekas.name} (${lekas.system}) - RM ${lekasToll.toFixed(2)}`);
        }

        // SKVE
        if(originZones.includes("putrajayaCyberjaya") || destZones.includes("putrajayaCyberjaya")){
            let skve = TOLL_DB.highways.SKVE;
            let skveToll = distanceKm * skve.ratePerKm * 0.30; // Approx logic adjustment
            total += skveToll;
            breakdown.push(`${skve.name} (${skve.system}) - RM ${skveToll.toFixed(2)}`);
        }
    }

    // ======================================================
    // OPEN SYSTEM
    // ======================================================
    const urbanTrip = distanceKm <= 40;

    if(urbanTrip){

        // LDP
        if(originZones.includes("puncakPerdana") || destZones.includes("puncakPerdana")){
            total += TOLL_DB.highways.LDP.fixedClass1;
            breakdown.push(`LDP Open Toll - RM ${TOLL_DB.highways.LDP.fixedClass1.toFixed(2)}`);
        }

        // GCE
        if(originZones.includes("puncakPerdana") || destZones.includes("puncakPerdana")){
            total += TOLL_DB.highways.GCE.fixedClass1;
            breakdown.push(`GCE Open Toll - RM ${TOLL_DB.highways.GCE.fixedClass1.toFixed(2)}`);
        }

        // SPRINT
        if(originZones.includes("damansara") || destZones.includes("damansara")){
            total += TOLL_DB.highways.SPRINT.fixedClass1;
            breakdown.push(`SPRINT Open Toll - RM ${TOLL_DB.highways.SPRINT.fixedClass1.toFixed(2)}`);
        }

        // KESAS
        if(originZones.includes("klangKapar") || destZones.includes("klangKapar")){
            total += TOLL_DB.highways.KESAS.fixedClass1;
            breakdown.push(`KESAS Open Toll - RM ${TOLL_DB.highways.KESAS.fixedClass1.toFixed(2)}`);
        }

        // NNKSB
        if(originZones.includes("klangKapar") || destZones.includes("klangKapar")){
            total += TOLL_DB.highways.NNKSB.fixedClass1;
            breakdown.push(`NNKSB Open Toll - RM ${TOLL_DB.highways.NNKSB.fixedClass1.toFixed(2)}`);
        }

        // LATAR
        if(originZones.includes("puncakPerdana") || originZones.includes("klangKapar") || destZones.includes("puncakPerdana") || destZones.includes("klangKapar")){
            total += TOLL_DB.highways.LATAR.fixedClass1;
            breakdown.push(`LATAR Open Toll - RM ${TOLL_DB.highways.LATAR.fixedClass1.toFixed(2)}`);
        }

        // MEX
        if(originZones.includes("putrajayaCyberjaya") || destZones.includes("putrajayaCyberjaya")){
            total += TOLL_DB.highways.MEX.fixedClass1;
            breakdown.push(`MEX Open Toll - RM ${TOLL_DB.highways.MEX.fixedClass1.toFixed(2)}`);
        }

        // SILK
        if(originZones.includes("bangiKajang") || destZones.includes("bangiKajang")){
            total += TOLL_DB.highways.SILK.fixedClass1;
            breakdown.push(`SILK Open Toll - RM ${TOLL_DB.highways.SILK.fixedClass1.toFixed(2)}`);
        }

        // SMART
        if(originZones.includes("klCenter") && (destZones.includes("bangiKajang") || destZones.includes("putrajayaCyberjaya"))){
            const hour = new Date().getHours();
            let smartFare =
                ((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19))
                ? TOLL_DB.highways.SMART.peak
                : TOLL_DB.highways.SMART.offpeak;
            total += smartFare;
            breakdown.push(`SMART Tunnel Hybrid - RM ${smartFare.toFixed(2)}`);
        }
    }

    total = Math.round(total * 10) / 10;
    return { total, breakdown };
}

// ==========================================================
// AUTOCOMPLETE
// ==========================================================

function setupAutocomplete(
    inputId,
    suggestionsId,
    clearBtnId,
    onSelect,
    onClear
){
    const input = document.getElementById(inputId);
    const suggestionsBox = document.getElementById(suggestionsId);
    const clearBtn = document.getElementById(clearBtnId);
    let debounce;

    input.addEventListener('input',()=>{
        clearTimeout(debounce);
        const query = input.value.trim();
        clearBtn.style.display = query.length ? 'block':'none';

        if(query.length < 3){
            suggestionsBox.style.display='none';
            return;
        }

        debounce = setTimeout(()=>{
            fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=99.6,0.8,119.5,7.4&limit=5`)
            .then(r=>r.json())
            .then(data=>{
                suggestionsBox.innerHTML='';
                if(!data.features?.length){
                    suggestionsBox.style.display='none';
                    return;
                }
                suggestionsBox.style.display='block';
                data.features.forEach(f=>{
                    const props = f.properties;
                    const addr = [props.name, props.street, props.city, props.state].filter(Boolean).join(', ');
                    const div = document.createElement('div');
                    div.className='suggestion-item';
                    div.textContent = addr || props.name;

                    div.addEventListener('click',()=>{
                        input.value = addr || props.name;
                        suggestionsBox.style.display='none';
                        const [lon,lat] = f.geometry.coordinates;
                        onSelect({lat,lon});
                    });
                    suggestionsBox.appendChild(div);
                });
            });
        },350);
    });

    clearBtn.addEventListener('click',()=>{
        input.value='';
        clearBtn.style.display='none';
        suggestionsBox.style.display='none';
        onClear();
    });
}

// ==========================================================
// INIT AUTOCOMPLETE
// ==========================================================

setupAutocomplete(
    'pickup',
    'pickup-suggestions',
    'clear-pickup',
    (c)=>{
        pickupCoords=c;
        updateMarker('pickup',c);
        checkAndProcessRoute();
    },
    ()=>{
        pickupCoords=null;
        if(pickupMarker) map.removeLayer(pickupMarker);
        resetCalc();
    }
);

setupAutocomplete(
    'dropoff',
    'dropoff-suggestions',
    'clear-dropoff',
    (c)=>{
        dropoffCoords=c;
        updateMarker('dropoff',c);
        checkAndProcessRoute();
    },
    ()=>{
        dropoffCoords=null;
        if(dropoffMarker) map.removeLayer(dropoffMarker);
        resetCalc();
    }
);

// ==========================================================
// SWAP
// ==========================================================

document.getElementById('swap-locations-btn').addEventListener('click',()=>{
    let tempText = document.getElementById('pickup').value;
    let tempCoord = pickupCoords;

    document.getElementById('pickup').value = document.getElementById('dropoff').value;
    pickupCoords = dropoffCoords;

    document.getElementById('dropoff').value = tempText;
    dropoffCoords = tempCoord;

    if(pickupCoords) updateMarker('pickup',pickupCoords);
    if(dropoffCoords) updateMarker('dropoff',dropoffCoords);
    if(pickupCoords && dropoffCoords) checkAndProcessRoute();
});

// ==========================================================
// CURRENT LOCATION
// ==========================================================

document.getElementById('current-loc-btn').addEventListener('click',()=>{
    if(!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(pos=>{
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        pickupCoords = {lat,lon};

        updateMarker('pickup',pickupCoords);
        map.setView([lat,lon],14);
        document.getElementById('pickup').value = "Current Location";
        checkAndProcessRoute();
    });
});

// ==========================================================
// MARKERS
// ==========================================================

function updateMarker(type,coords){
    const marker = type==='pickup' ? pickupMarker : dropoffMarker;
    if(marker) map.removeLayer(marker);
    const newMarker = L.marker([coords.lat,coords.lon]).addTo(map);

    if(type==='pickup') pickupMarker = newMarker;
    else dropoffMarker = newMarker;
}

// ==========================================================
// RESET
// ==========================================================

function resetCalc(){
    if(routeLine) map.removeLayer(routeLine);
    document.getElementById('result-card').style.display='none';
}

// ==========================================================
// ROUTING
// ==========================================================

function checkAndProcessRoute(){
    if(!pickupCoords || !dropoffCoords) return;

    if(currentRouteTimeout) clearTimeout(currentRouteTimeout);

    currentRouteTimeout = setTimeout(()=>{
        const url = `https://api.openrouteservice.org/v2/directions/driving-car?api_key=${ORS_API_KEY}&start=${pickupCoords.lon},${pickupCoords.lat}&end=${dropoffCoords.lon},${dropoffCoords.lat}&extra_info=tollways`;

        fetch(url)
        .then(res=>res.json())
        .then(data=>{
            const feat = data.features[0];
            const distanceKm = feat.properties.summary.distance / 1000;
            const durationBase = feat.properties.summary.duration / 60;
            const extras = feat.properties.extras;
            let routeHasTolls = false;

            if(extras?.tollways?.values){
                routeHasTolls = extras.tollways.values
