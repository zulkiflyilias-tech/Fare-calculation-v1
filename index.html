<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - Precision v6.1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --gray-text: #6b7280; --accent: #f59e0b; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; background: var(--bg); display: flex; flex-direction: column; 
            height: 100vh; height: 100dvh; overflow: hidden; 
        }
        
        .search-panel { background: var(--card-bg); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1005; }
        .inputs-container { display: flex; align-items: center; gap: 12px; }
        .inputs-flex { flex: 1; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gray-text); text-transform: uppercase; }
        
        input { 
            width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; 
            box-sizing: border-box; font-size: 14px; background: #f9fafb; transition: 0.2s; 
        }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }

        .swap-btn { 
            background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 50%; 
            width: 36px; height: 36px; cursor: pointer; color: var(--primary); 
            display: flex; align-items: center; justify-content: center;
        }
        
        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 4px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: #9ca3af; font-size: 18px; }
        
        .autocomplete-list { 
            position: absolute; top: 100%; left: 0; right: 0; background: white; 
            z-index: 10000; max-height: 350px; overflow-y: auto; border-radius: 12px; 
            box-shadow: 0 12px 24px rgba(0,0,0,0.15); display: none; margin-top: 4px; 
            border: 1px solid #eee; 
        }
        .autocomplete-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9fafb; }
        .autocomplete-item:hover { background: #f8fafc; }
        .loc-icon { background: #f3f4f6; color: #6b7280; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .loc-name { font-weight: 600; font-size: 14px; color: var(--text); }
        .loc-address { font-size: 11px; color: var(--gray-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .results-card { 
            position: fixed; bottom: 20px; left: 16px; right: 16px; 
            background: white; padding: 20px; border-radius: 24px; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 1002; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(150%); opacity: 0;
        }
        .results-card.visible { transform: translateY(0); opacity: 1; }

        .action-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { border: none; border-radius: 12px; padding: 12px 8px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-transform: uppercase; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-copy { background: #f1f5f9; color: #475569; }
        .btn-maps { background: #4285F4; color: white; }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="inputs-container">
        <div class="inputs-flex">
            <div class="input-group">
                <label>Pickup Point</label>
                <input type="text" id="pickup" placeholder="Set pickup location..." autocomplete="off">
                <div class="btn-container"><button id="gps-btn" class="icon-btn">📍</button></div>
                <div id="p-results" class="autocomplete-list"></div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>Destination</label>
                <input type="text" id="dropoff" placeholder="Where are you heading?" autocomplete="off">
                <div id="d-results" class="autocomplete-list"></div>
            </div>
        </div>
        <button id="swap-btn" class="swap-btn">⇅</button>
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 id="fare" style="margin:0; color:var(--primary); font-size:32px;">RM 0</h2>
            <p id="summary" style="font-size:12px; color:#4b5563; margin:4px 0 0 0;"></p>
        </div>
        <span id="badge" style="font-size:10px; font-weight:800; padding:4px 10px; background:#f1f5f9; border-radius:20px;">STANDARD</span>
    </div>
    <div class="action-bar">
        <button class="action-btn btn-whatsapp" id="btn-whatsapp"><span>💬</span> WhatsApp</button>
        <button class="action-btn btn-copy" id="btn-copy"><span>📋</span> Copy</button>
        <button class="action-btn btn-maps" id="btn-maps"><span>🗺️</span> Maps</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    OVERPASS_URL: "https://overpass-api.de/api/interpreter",
    RATES: { BASE: 5.0, KM: 1.2, TIME: 0.2 }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer, currentFare = 0;

const map = L.map("map", { zoomControl: false }).setView([3.1478, 101.6953], 12);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

// Improved Overpass Query for Malls/POIs
async function fetchEntrances(lat, lon) {
    const query = `[out:json][timeout:15];(node["entrance"](around:250,${lat},${lon});node["railway"~"entrance|exit"](around:250,${lat},${lon});node["highway"="bus_stop"](around:250,${lat},${lon});way["amenity"="parking_entrance"](around:250,${lat},${lon}););out center;`;
    try {
        const res = await fetch(CONFIG.OVERPASS_URL, { method: "POST", body: query });
        const data = await res.json();
        return data.elements || [];
    } catch (e) { return []; }
}

function debounceSearch(input, resultsId, type) {
    clearTimeout(searchTimer);
    const query = input.value.trim();
    if (query.length < 3) { $(resultsId).style.display = 'none'; return; }
    searchTimer = setTimeout(async () => {
        try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=3.14&lon=101.69&countrycode=MY&limit=6`);
            const data = await res.json();
            renderResults(data.features, resultsId, type);
        } catch (e) { console.error(e); }
    }, 400);
}

async function renderResults(features, resultsId, type) {
    const list = $(resultsId);
    list.innerHTML = "";
    list.style.display = 'block';

    for (const f of features) {
        const p = f.properties;
        const [lon, lat] = f.geometry.coordinates;
        
        const mainName = p.name || p.street || "Location";
        const fullAddr = [p.name, p.district, p.city, p.state].filter(Boolean).join(', ');

        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.innerHTML = `<div class="loc-icon">📍</div><div style="overflow:hidden"><div class="loc-name">${mainName}</div><div class="loc-address">${fullAddr}</div></div>`;
        item.onclick = () => selectLoc(type, [lat, lon], mainName);
        list.appendChild(item);

        // Malaysian POI keywords for entrance deep-dive
        const poiKeywords = ['mall', 'station', 'hospital', 'plaza', 'sentral', 'university', 'tower', 'airport'];
        const isPOI = poiKeywords.some(k => (p.name||'').toLowerCase().includes(k));

        if (isPOI) {
            const entrances = await fetchEntrances(lat, lon);
            entrances.slice(0, 8).forEach(ent => {
                const entName = ent.tags.name || ent.tags.ref || `Entrance (${ent.tags.entrance || 'Gate'})`;
                const sub = document.createElement('div');
                sub.className = 'autocomplete-item';
                sub.style.paddingLeft = "40px";
                sub.style.background = "#fcfcfc";
                sub.innerHTML = `<div class="loc-icon" style="width:24px; height:24px; font-size:12px;">🚪</div><div style="overflow:hidden"><div class="loc-name" style="font-size:13px; color:var(--primary);">${entName}</div><div class="loc-address">Drop-off/Pick-up for ${mainName}</div></div>`;
                sub.onclick = (e) => { 
                    e.stopPropagation(); 
                    const eLat = ent.lat || ent.center.lat;
                    const eLon = ent.lon || ent.center.lon;
                    selectLoc(type, [eLat, eLon], `${mainName} (${entName})`); 
                };
                list.appendChild(sub);
            });
        }
    }
}

function selectLoc(type, coord, label) {
    if (type === 'pickup') { pickupCoord = coord; $("pickup").value = label; $("p-results").style.display = 'none'; } 
    else { dropoffCoord = coord; $("dropoff").value = label; $("d-results").style.display = 'none'; }
    
    // Auto-center map on selection
    map.setView(coord, 16);
    L.marker(coord).addTo(map);

    if (pickupCoord && dropoffCoord) calculate();
}

async function calculate() {
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        const km = route.summary.distance / 1000;
        const mins = Math.ceil(route.summary.duration / 60);
        
        currentFare = Math.round(CONFIG.RATES.BASE + (km * CONFIG.RATES.KM) + (mins * CONFIG.RATES.TIME));
        
        $("fare").innerText = `RM ${currentFare}`;
        $("summary").innerHTML = `<b>${km.toFixed(1)} km</b> • <b>${mins} min</b>`;
        $("results").classList.add('visible');
        
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 5}).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});
    } catch (e) { console.error(e); }
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

$("pickup").oninput = e => debounceSearch(e.target, "p-results", "pickup");
$("dropoff").oninput = e => debounceSearch(e.target, "d-results", "dropoff");

// Updated GPS with Reverse Geocoding
$("gps-btn").onclick = () => {
    navigator.geolocation.getCurrentPosition(async p => {
        const lat = p.coords.latitude;
        const lon = p.coords.longitude;
        try {
            // Fetch real address for pickup label
            const res = await fetch(`https://photon.komoot.io/reverse?lon=${lon}&lat=${lat}`);
            const data = await res.json();
            const address = data.features[0].properties.name || data.features[0].properties.street || "My Location";
            selectLoc('pickup', [lat, lon], address);
        } catch (e) {
            selectLoc('pickup', [lat, lon], "My Location");
        }
    });
};

$("btn-whatsapp").onclick = () => {
    const msg = encodeURIComponent(`Booking: ${$("pickup").value} to ${$("dropoff").value} (RM${currentFare})`);
    window.open(`https://wa.me/60108988182?text=${msg}`);
};

$("swap-btn").onclick = () => {
    const pV = $("pickup").value, dV = $("dropoff").value;
    const pC = pickupCoord, dC = dropoffCoord;
    $("pickup").value = dV; $("dropoff").value = pV;
    pickupCoord = dC; dropoffCoord = pC;
    if(pickupCoord && dropoffCoord) calculate();
};
</script>
</body>
</html>
