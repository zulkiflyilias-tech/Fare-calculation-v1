<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.8.6 PRO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --gray-text: #6b7280; --accent: #f59e0b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .search-panel { background: var(--card-bg); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1005; }
        .inputs-container { display: flex; align-items: center; gap: 12px; }
        .inputs-flex { flex: 1; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gray-text); text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #f9fafb; transition: 0.2s; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }
        
        /* Adjusted padding for inputs with buttons */
        #pickup, #dropoff { padding-right: 85px; }

        .swap-btn { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; }
        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 4px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: #9ca3af; font-size: 18px; }
        
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 9999; max-height: 280px; overflow-y: auto; border-radius: 0 0 16px 16px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); display: none; margin-top: 4px; border: 1px solid #eee; }
        .autocomplete-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9fafb; }
        .loc-icon { background: #f3f4f6; color: #6b7280; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .loc-name { font-weight: 600; font-size: 14px; color: var(--text); }
        .loc-address { font-size: 12px; color: var(--gray-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 9998; }
        .fare-breakdown { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 85%; max-width: 340px; background: white; padding: 24px; border-radius: 28px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); z-index: 9999; flex-direction: column; 
        }
        .invoice-table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--text); }
        .invoice-table td { padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .invoice-table .rate-label { font-size: 10px; color: var(--gray-text); display: block; margin-top: 2px; font-weight: normal; }
        .invoice-table .amount { text-align: right; font-family: monospace; font-weight: 600; font-size: 14px; }
        .invoice-total { margin-top: 15px; padding-top: 15px; border-top: 2px solid var(--primary); display: flex; justify-content: space-between; font-weight: 800; font-size: 20px; }
        .close-modal-btn { margin-top: 20px; width: 100%; padding: 14px; border: none; border-radius: 14px; background: #f3f4f6; font-weight: 700; cursor: pointer; color: var(--text); }

        .results-card { position: fixed; bottom: 20px; left: 16px; right: 16px; background: white; padding: 20px; border-radius: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 1002; display: none; border: 1px solid #f1f5f9; }
        .fare-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        #fare { margin:0; color:var(--primary); font-size:32px; }
        .tap-hint { font-size: 9px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }

        .action-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { border: none; border-radius: 12px; padding: 10px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-transform: uppercase; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-copy { background: #f1f5f9; color: #475569; }
        .btn-maps { background: #4285F4; color: white; }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="inputs-container">
        <div class="inputs-flex">
            <div class="input-group">
                <label>Pickup</label>
                <input type="text" id="pickup" placeholder="Set pickup..." autocomplete="off">
                <div class="btn-container">
                    <button id="clear-p" class="icon-btn" style="display:none">✕</button>
                    <button id="gps-btn" class="icon-btn">📍</button>
                </div>
                <div id="p-results" class="autocomplete-list"></div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>Destination</label>
                <input type="text" id="dropoff" placeholder="Where to?" autocomplete="off">
                <div class="btn-container">
                    <button id="clear-d" class="icon-btn" style="display:none">✕</button>
                </div>
                <div id="d-results" class="autocomplete-list"></div>
            </div>
        </div>
        <button id="swap-btn" class="swap-btn">⇅</button>
    </div>
    <div class="input-group" style="margin-top: 12px; margin-bottom:0;">
        <label>Travel Schedule</label>
        <input type="datetime-local" id="departure-time">
    </div>
</div>

<div id="map"></div>

<div id="modal-overlay" class="modal-overlay" onclick="toggleBreakdown()"></div>
<div id="breakdown" class="fare-breakdown">
    <h3 style="margin: 0 0 15px 0; font-size: 18px;">Fare Breakdown</h3>
    <div id="invoice-content"></div>
    <button class="close-modal-btn" onclick="toggleBreakdown()">Close</button>
</div>

<div id="results" class="results-card">
    <div class="fare-header" onclick="toggleBreakdown()">
        <div id="fare-container">
            <h2 id="fare">RM 0</h2>
            <div class="tap-hint">Tap for details ▾</div>
        </div>
        <span id="badge" style="font-size:10px; font-weight:800; padding:4px 10px; background:#f1f5f9; border-radius:20px;">STANDARD</span>
    </div>
    <p id="summary" style="font-size:12px; color:#4b5563; margin-top:8px;"></p>
    <div class="action-bar">
        <button class="action-btn btn-whatsapp" id="btn-whatsapp"><span>💬</span> WhatsApp</button>
        <button class="action-btn btn-copy" id="btn-copy"><span>📋</span> Copy</button>
        <button class="action-btn btn-maps" id="btn-maps"><span>🗺️</span> Maps App</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { 
        BASE: 5.00, 
        KM_TIER_1: 1.25, 
        KM_TIER_2: 1.10, 
        KM_TIER_3: 0.90,
        TIME_RATE: 0.20, 
        KM_INTERSTATE_INCENTIVE: 0.45, 
        
        MIDNIGHT: 1.10, MORNING_PEAK: 1.30, LUNCH_SURGE: 1.10, EVENING_PEAK: 1.35
    }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer, currentFare = 0, currentSurgeLabel = "Standard";

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([3.1478, 101.6953], 12);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

// Set default time to current
const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
$("departure-time").value = now.toISOString().slice(0,16);

function toggleBreakdown() {
    const modal = $("breakdown");
    const overlay = $("modal-overlay");
    const isVisible = modal.style.display === "flex";
    modal.style.display = isVisible ? "none" : "flex";
    overlay.style.display = isVisible ? "none" : "block";
}

function debounceSearch(input, resultsId, type) {
    const query = input.value;
    $(type === 'pickup' ? 'clear-p' : 'clear-d').style.display = query ? 'block' : 'none';
    clearTimeout(searchTimer);
    if (query.length < 2) { $(resultsId).style.display = 'none'; return; }
    searchTimer = setTimeout(async () => {
        try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=3.14&lon=101.69&countrycode=MY&limit=10`);
            const data = await res.json();
            renderResults(data.features, resultsId, type);
        } catch (e) { console.error(e); }
    }, 300);
}

function renderResults(features, resultsId, type) {
    const list = $(resultsId);
    if (!features.length) { list.style.display = 'none'; return; }
    list.innerHTML = features.map(f => {
        const p = f.properties;
        const [lon, lat] = f.geometry.coordinates;
        const mainName = p.name || p.street || "Location";
        const subAddress = [p.district, p.city, p.state].filter(x => x && x !== mainName).join(', ') || "Malaysia";
        const fullLabel = `${mainName}, ${subAddress}`;
        return `<div class="autocomplete-item" onclick="selectLoc('${type}', [${lat}, ${lon}], '${fullLabel.replace(/'/g, "\\'")}')">
            <div class="loc-icon">📍</div>
            <div class="loc-details">
                <div class="loc-name">${mainName}</div>
                <div class="loc-address">${subAddress}</div>
            </div>
        </div>`;
    }).join('');
    list.style.display = 'block';
}

function selectLoc(type, coord, label) {
    if (type === 'pickup') { pickupCoord = coord; $("pickup").value = label; $("p-results").style.display = 'none'; } 
    else { dropoffCoord = coord; $("dropoff").value = label; $("d-results").style.display = 'none'; }
    calculate();
}

async function calculate() {
    if (!pickupCoord || !dropoffCoord) return;
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        const km = route.summary.distance / 1000;
        const durationMin = Math.ceil(route.summary.duration / 60);
        
        const dt = new Date($("departure-time").value);
        const hour = dt.getHours() + (dt.getMinutes() / 60);
        let activeMult = 1.0; currentSurgeLabel = "Standard";

        // Surge logic
        if (hour >= 0 && hour < 6) { activeMult = CONFIG.RATES.MIDNIGHT; currentSurgeLabel = "Midnight Surcharge (10%)"; }
        else if (hour >= 7 && hour < 9) { activeMult = CONFIG.RATES.MORNING_PEAK; currentSurgeLabel = "Morning Peak (30%)"; }
        else if (hour >= 12.5 && hour < 14.5) { activeMult = CONFIG.RATES.LUNCH_SURGE; currentSurgeLabel = "Lunch Surge (10%)"; }
        else if (hour >= 17 && hour < 20) { activeMult = CONFIG.RATES.EVENING_PEAK; currentSurgeLabel = "Evening Peak (35%)"; }

        let distFare = 0, tierHtml = "";
        if (km <= 50) { 
            distFare = km * CONFIG.RATES.KM_TIER_1; 
            tierHtml = `<tr><td>Distance (T1)<span class="rate-label">${km.toFixed(1)} km @ RM ${CONFIG.RATES.KM_TIER_1.toFixed(2)}/km</span></td><td class="amount">RM ${distFare.toFixed(2)}</td></tr>`; 
        } else if (km <= 150) { 
            const t1 = 50 * CONFIG.RATES.KM_TIER_1;
            const t2 = (km - 50) * CONFIG.RATES.KM_TIER_2;
            distFare = t1 + t2; 
            tierHtml = `<tr><td>Distance (T1)<span class="rate-label">50.0 km @ RM ${CONFIG.RATES.KM_TIER_1.toFixed(2)}/km</span></td><td class="amount">RM ${t1.toFixed(2)}</td></tr>
                        <tr><td>Distance (T2)<span class="rate-label">${(km-50).toFixed(1)} km @ RM ${CONFIG.RATES.KM_TIER_2.toFixed(2)}/km</span></td><td class="amount">RM ${t2.toFixed(2)}</td></tr>`; 
        } else { 
            const t1 = 50 * CONFIG.RATES.KM_TIER_1;
            const t2 = 100 * CONFIG.RATES.KM_TIER_2;
            const t3 = (km - 150) * CONFIG.RATES.KM_TIER_3;
            distFare = t1 + t2 + t3; 
            tierHtml = `<tr><td>Distance (T1)<span class="rate-label">50.0 km @ RM ${CONFIG.RATES.KM_TIER_1.toFixed(2)}/km</span></td><td class="amount">RM ${t1.toFixed(2)}</td></tr>
                        <tr><td>Distance (T2)<span class="rate-label">100.0 km @ RM ${CONFIG.RATES.KM_TIER_2.toFixed(2)}/km</span></td><td class="amount">RM ${t2.toFixed(2)}</td></tr>
                        <tr><td>Distance (T3)<span class="rate-label">${(km-150).toFixed(1)} km @ RM ${CONFIG.RATES.KM_TIER_3.toFixed(2)}/km</span></td><td class="amount">RM ${t3.toFixed(2)}</td></tr>`; 
        }

        const timeFare = durationMin * CONFIG.RATES.TIME_RATE;
        let subtotal = CONFIG.RATES.BASE + distFare + timeFare;
        const isInterstate = km > CONFIG.RATES.INTERSTATE_THRESHOLD;
        if (isInterstate) subtotal += CONFIG.RATES.INTERSTATE_INCENTIVE;
        currentFare = Math.round(subtotal * activeMult);

        $("fare").innerText = `RM ${currentFare}`;
        $("badge").innerText = isInterstate ? "INTERSTATE" : "STANDARD";
        $("summary").innerHTML = `<b>${km.toFixed(1)} km</b> • <b>${durationMin} min</b>`;
        
        $("invoice-content").innerHTML = `
            <table class="invoice-table">
                <tr><td>Base Fare<span class="rate-label">Fixed fee</span></td><td class="amount">RM ${CONFIG.RATES.BASE.toFixed(2)}</td></tr>
                ${tierHtml}
                <tr><td>Time<span class="rate-label">${durationMin} min @ RM ${CONFIG.RATES.TIME_RATE.toFixed(2)}/min</span></td><td class="amount">RM ${timeFare.toFixed(2)}</td></tr>
                ${isInterstate ? `<tr><td>Interstate Incentive<span class="rate-label">Cross-border fee</span></td><td class="amount">RM ${CONFIG.RATES.INTERSTATE_INCENTIVE.toFixed(2)}</td></tr>` : ''}
                ${activeMult > 1 ? `<tr style="color:var(--accent)"><td>${currentSurgeLabel}<span class="rate-label">Peak hour multiplier</span></td><td class="amount">x${activeMult.toFixed(2)}</td></tr>` : ''}
            </table>
            <div class="invoice-total">
                <span>Total Payable</span>
                <span>RM ${currentFare.toFixed(2)}</span>
            </div>`;
        
        $("results").style.display = 'block';
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 5}).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding: [50,150]});
    } catch (err) { console.error(err); }
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

// Fixed: Explicitly trigger calculation when time input changes
$("departure-time").addEventListener('change', () => {
    if (pickupCoord && dropoffCoord) calculate();
});

$("gps-btn").onclick = () => {
    $("pickup").placeholder = "Locating...";
    navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        try {
            const res = await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}`);
            const data = await res.json();
            if (data.features && data.features.length > 0) {
                const p = data.features[0].properties;
                const addr = `${p.name || p.street || 'Current Location'}, ${p.city || p.state || ''}`;
                selectLoc('pickup', [lat, lon], addr);
            } else { selectLoc('pickup', [lat, lon], "Current Location"); }
        } catch(e) { selectLoc('pickup', [lat, lon], "Current Location"); }
    }, () => {
        alert("GPS access denied.");
        $("pickup").placeholder = "Set pickup...";
    });
};

$("btn-whatsapp").onclick = () => {
    const msg = encodeURIComponent(`🚕 *Booking Inquiry*\n\n📍 From: ${$("pickup").value}\n🏁 To: ${$("dropoff").value}\n💰 Fare: RM ${currentFare}\n⚡ Rate: ${currentSurgeLabel}`);
    window.open(`https://wa.me/?text=${msg}`, '_blank');
};
$("btn-copy").onclick = () => { navigator.clipboard.writeText(`From: ${$("pickup").value}\nTo: ${$("dropoff").value}\nFare: RM ${currentFare}`); alert("Copied!"); };
$("btn-maps").onclick = () => { window.open(`https://www.google.com/maps/dir/?api=1&origin=${pickupCoord[0]},${pickupCoord[1]}&destination=${dropoffCoord[0]},${dropoffCoord[1]}&travelmode=driving`, '_blank'); };
$("pickup").oninput = e => debounceSearch(e.target, "p-results", "pickup");
$("dropoff").oninput = e => debounceSearch(e.target, "d-results", "dropoff");
$("swap-btn").onclick = () => {
    let pV = $("pickup").value, dV = $("dropoff").value;
    $("pickup").value = dV; $("dropoff").value = pV;
    let tC = pickupCoord; pickupCoord = dropoffCoord; dropoffCoord = tC;
    calculate();
};
$("clear-p").onclick = () => { $("pickup").value = ''; pickupCoord = null; $("clear-p").style.display='none'; $("p-results").style.display='none'; };
$("clear-d").onclick = () => { $("dropoff").value = ''; dropoffCoord = null; $("clear-d").style.display='none'; $("d-results").style.display='none'; };
</script>
</body>
</html>
