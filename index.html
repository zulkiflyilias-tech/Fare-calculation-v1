<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Rideshare MY - Professional Fare Estimator | Malaysia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: #f8f9fc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            color: #1e2a3a;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #map {
            height: 35vh;
            width: 100%;
            z-index: 1;
            cursor: crosshair;
        }

        #search-panel {
            flex: 1;
            background: white;
            padding: 18px 16px 20px 16px;
            box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.06);
            z-index: 10;
            box-sizing: border-box;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #2c3e66, #4b2e6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .map-tip {
            font-size: 11px;
            background: #f0eff7;
            padding: 6px 10px;
            border-radius: 30px;
            margin-bottom: 14px;
            text-align: center;
            font-weight: 500;
            color: #4a2c6d;
        }

        .routing-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 14px 70px 14px 42px;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            font-size: 14px;
            background: #ffffff;
            transition: all 0.2s ease;
            font-weight: 500;
            color: #1e2a3a;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            background-color: #fff;
        }

        /* custom markers before inputs */
        .input-container::before {
            content: '';
            position: absolute;
            left: 18px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #10b981;
            z-index: 2;
            pointer-events: none;
        }

        .input-container:has(#dropoff)::before {
            background-color: #ef4444;
        }

        .action-group {
            position: absolute;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 5;
        }

        .icon-btn {
            border: none;
            background: transparent;
            color: #6c757d;
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background-color: #f1f5f9;
            color: #8b5cf6;
        }

        .clear-btn {
            font-size: 20px;
            font-weight: bold;
            display: none;
        }

        .swap-container {
            position: absolute;
            right: 55px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
        }

        .swap-btn {
            background: white;
            border: 1px solid #e2e8f0;
            color: #8b5cf6;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            font-weight: bold;
            font-size: 18px;
            transition: all 0.2s;
        }

        .swap-btn:hover {
            background: #f5f3ff;
            transform: scale(1.05);
            border-color: #c4b5fd;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 20px;
            max-height: 260px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            margin-top: 6px;
            border: 1px solid #ede9fe;
            display: none;
        }

        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.1s;
            color: #1f2937;
        }

        .suggestion-item strong {
            color: #8b5cf6;
        }

        .suggestion-item:hover {
            background-color: #faf5ff;
        }

        #result-card {
            background: #1e293b;
            color: white;
            border-radius: 28px;
            padding: 18px;
            margin-top: 8px;
            cursor: pointer;
            display: none;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
            transition: all 0.2s;
        }

        .fare-header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .fare-header {
            font-size: 36px;
            font-weight: 800;
            color: #c4b5fd;
            letter-spacing: -0.5px;
        }

        .toggle-icon {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.18);
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: 600;
        }

        .fare-meta {
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            color: #cbd5e1;
            font-weight: 500;
        }

        #invoice-details {
            margin-top: 16px;
            border-top: 1px dashed #334155;
            padding-top: 14px;
            display: none;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #cbd5e6;
            margin-bottom: 10px;
        }

        .detail-row.total-bold {
            color: #ffffff;
            font-weight: 700;
            border-top: 1px solid #475569;
            padding-top: 10px;
            margin-top: 6px;
            font-size: 14px;
        }

        #error-msg {
            color: #f97316;
            font-size: 12px;
            margin-top: 10px;
            display: none;
            background: #fff0e6;
            padding: 8px 14px;
            border-radius: 30px;
            text-align: center;
        }

        @media (min-width: 780px) {
            #container {
                flex-direction: row-reverse;
            }
            #map {
                height: 100%;
                flex: 1;
            }
            #search-panel {
                width: 400px;
                height: 100%;
                border-radius: 0;
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.03);
            }
        }

        .current-loc-badge {
            background: #f1f5f9;
            border-radius: 30px;
        }
    </style>
</head>
<body>
<div id="container">
    <div id="map"></div>
    <div id="search-panel">
        <div class="header-row">
            <h2>🚖 Fare Estimator · Malaysia</h2>
        </div>
        <div class="map-tip">📍 Tap on map to set active location (Pickup/Dropoff)</div>

        <div class="routing-wrapper">
            <div class="input-container">
                <input type="text" id="pickup" placeholder="Pickup: e.g., KLCC, Petaling Jaya, Bukit Bintang" autocomplete="off">
                <div class="action-group">
                    <button class="icon-btn" id="current-loc-btn" title="Use my current location">📍</button>
                    <button class="icon-btn clear-btn" id="clear-pickup">✕</button>
                </div>
                <div id="pickup-suggestions" class="suggestions"></div>
            </div>

            <div class="swap-container">
                <button class="swap-btn" id="swap-locations-btn" title="Swap locations">⇅</button>
            </div>

            <div class="input-container">
                <input type="text" id="dropoff" placeholder="Dropoff: e.g., Subang Jaya, KL Sentral, Bangsar" autocomplete="off">
                <div class="action-group">
                    <button class="icon-btn clear-btn" id="clear-dropoff">✕</button>
                </div>
                <div id="dropoff-suggestions" class="suggestions"></div>
            </div>
        </div>

        <div id="error-msg"></div>
        <div id="result-card" onclick="toggleInvoice()">
            <div class="fare-header-row">
                <div id="total-fare" class="fare-header">RM --</div>
                <span class="toggle-icon" id="toggle-lbl">Details</span>
            </div>
            <div class="fare-meta">
                <span id="fare-distance">0 km</span>
                <span id="fare-duration">0 mins</span>
            </div>
            <div id="invoice-details">
                <div class="detail-row"><span>Base Fare</span><span id="calc-base-fare">RM 0.00</span></div>
                <div class="detail-row"><span>Distance Fare (RM/km)</span><span id="calc-ride-distance-rate">RM 0.00</span></div>
                <div class="detail-row"><span>PLUS Tolls Est.</span><span id="calc-tolls">RM 0.00</span></div>
                <div class="detail-row"><span>Traffic & Incentive</span><span id="calc-incentive">RM 0.00</span></div>
                <div class="detail-row" id="deadhead-km-row" style="display: none;"><span>Out-of-Zone Surcharge</span><span id="calc-deadhead-km">RM 0.00</span></div>
                <div class="detail-row total-bold"><span>Final Total (Rounded)</span><span id="calc-grand" style="color: #c4b5fd;">RM 0.00</span></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ---------- INIT MAP (Malaysia view) ----------
    const map = L.map('map').setView([3.1478, 101.6953], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> & CartoDB',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    let pickupMarker = null, dropoffMarker = null, routeLine = null;
    let pickupCoords = null, dropoffCoords = null;
    let currentRouteTimeout = null;
    let activeInputFieldId = 'pickup';

    const pickupInput = document.getElementById('pickup');
    const dropoffInput = document.getElementById('dropoff');

    pickupInput.addEventListener('focus', () => activeInputFieldId = 'pickup');
    dropoffInput.addEventListener('focus', () => activeInputFieldId = 'dropoff');

    // ---------- MALAYSIA HUMAN-READABLE ADDRESS FORMATTING (Forensic Fix) ----------
    function formatMalaysiaAddress(props, lat, lng) {
        if (!props) {
            return `📍 Malaysia (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
        }
        // Prioritize meaningful local names: name, street, city, district, state
        let name = props.name || '';
        let street = props.street || props.road || '';
        let housenumber = props.housenumber ? props.housenumber + ', ' : '';
        let suburb = props.suburb || props.district || props.city_district || '';
        let city = props.city || props.town || props.village || '';
        let state = props.state || '';

        // Clean duplicates: if name contains street already, avoid duplication
        let addressParts = [];
        if (name && name.length > 0 && !(street && name.includes(street))) {
            addressParts.push(name);
        }
        if (street && street !== name) {
            addressParts.push(housenumber + street);
        } else if (!name && street) {
            addressParts.push(street);
        }
        if (suburb && suburb !== city && suburb !== name) {
            addressParts.push(suburb);
        }
        if (city && city !== suburb && city !== name) {
            addressParts.push(city);
        }
        if (state && !addressParts.includes(state)) {
            addressParts.push(state);
        }
        // last resort: provide coordinates reference
        if (addressParts.length === 0) {
            return `📍 Malaysia (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
        }
        return addressParts.join(', ');
    }

    // Enhanced reverse geocode with Photon + robust fallback for Malaysia
    async function reverseGeocodeMalaysia(lat, lng, inputElement, isPickup) {
        try {
            const response = await fetch(`https://photon.komoot.io/api/reverse/?lon=${lng}&lat=${lat}`);
            if (!response.ok) throw new Error('Reverse geo fail');
            const data = await response.json();
            if (data && data.features && data.features.length > 0) {
                const feature = data.features[0];
                const props = feature.properties;
                const formatted = formatMalaysiaAddress(props, lat, lng);
                inputElement.value = formatted;
                return formatted;
            } else {
                inputElement.value = `📍 Malaysia (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                return inputElement.value;
            }
        } catch (err) {
            console.warn("Reverse geocoding error:", err);
            inputElement.value = `📍 Malaysia (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
            return inputElement.value;
        }
    }

    // ---------- AUTOCOMPLETE WITH IMPROVED MALAYSIA SEARCH (PHOTON + FALLBACK) ----------
    function setupAutocomplete(inputId, suggestionsId, clearBtnId, onSelect, onClear) {
        const input = document.getElementById(inputId);
        const suggestionsBox = document.getElementById(suggestionsId);
        const clearBtn = document.getElementById(clearBtnId);
        let debounce;

        input.addEventListener('input', () => {
            clearTimeout(debounce);
            const query = input.value.trim();
            clearBtn.style.display = query ? 'block' : 'none';
            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                suggestionsBox.innerHTML = '';
                return;
            }
            debounce = setTimeout(() => {
                // BBOX: Peninsular Malaysia + East Malaysia broad limits
                const bbox = "99.5,0.8,119.5,7.5";
                const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=${bbox}&limit=8&lang=en`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        suggestionsBox.innerHTML = '';
                        if (!data.features || data.features.length === 0) {
                            suggestionsBox.style.display = 'none';
                            return;
                        }
                        suggestionsBox.style.display = 'block';
                        data.features.forEach(feat => {
                            const [lon, lat] = feat.geometry.coordinates;
                            const props = feat.properties;
                            // generate readable malaysian address
                            let displayAddress = formatMalaysiaAddress(props, lat, lon);
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerHTML = displayAddress;
                            div.addEventListener('click', () => {
                                input.value = displayAddress;
                                suggestionsBox.style.display = 'none';
                                suggestionsBox.innerHTML = '';
                                onSelect({ lat, lon });
                            });
                            suggestionsBox.appendChild(div);
                        });
                    })
                    .catch(err => {
                        console.error("Photon suggest error:", err);
                        suggestionsBox.style.display = 'none';
                    });
            }, 280);
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.style.display = 'none';
            suggestionsBox.innerHTML = '';
            suggestionsBox.style.display = 'none';
            onClear();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const query = input.value.trim();
                if (query.length >= 2) {
                    const bbox = "99.5,0.8,119.5,7.5";
                    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=${bbox}&limit=1`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.features && data.features.length) {
                                const [lon, lat] = data.features[0].geometry.coordinates;
                                const addr = formatMalaysiaAddress(data.features[0].properties, lat, lon);
                                input.value = addr;
                                suggestionsBox.style.display = 'none';
                                onSelect({ lat, lon });
                            } else {
                                showError("Location not found. Try a more specific area in Malaysia.");
                            }
                        }).catch(() => showError("Search error, please try again"));
                }
            }
        });
    }

    // clear / reset
    function resetCalculationDisplay() {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-msg');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        document.getElementById('result-card').style.display = 'none';
    }

    function updateMarker(type, coords) {
        if (type === 'pickup') {
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker([coords.lat, coords.lon], { icon: L.divIcon({ className: 'custom-marker', html: '📍', iconSize: [24,24] }) }).addTo(map);
            pickupMarker.bindTooltip('Pickup', { permanent: false });
        } else {
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            dropoffMarker = L.marker([coords.lat, coords.lon], { icon: L.divIcon({ className: 'custom-marker', html: '🏁', iconSize: [24,24] }) }).addTo(map);
            dropoffMarker.bindTooltip('Dropoff');
        }
    }

    // ---- route & fare calculation ----
    function checkAndProcessRoute() {
        if (!pickupCoords || !dropoffCoords) return;
        document.getElementById('error-msg').style.display = 'none';
        if (currentRouteTimeout) clearTimeout(currentRouteTimeout);
        currentRouteTimeout = setTimeout(() => {
            const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords.lon},${pickupCoords.lat};${dropoffCoords.lon},${dropoffCoords.lat}?overview=full&geometries=geojson`;
            fetch(url).then(res => {
                if (!res.ok) throw new Error('Routing failed');
                return res.json();
            }).then(data => {
                if (!data.routes || data.routes.length === 0) {
                    showError("No drivable route between selected points in Malaysia.");
                    return;
                }
                const route = data.routes[0];
                const distanceKm = route.distance / 1000;
                const baseDurationMins = route.duration / 60;
                const now = new Date();
                const hour = now.getHours();
                const isWeekend = (now.getDay() === 0 || now.getDay() === 6);
                let trafficFactor = 1.15;
                if (!isWeekend) {
                    if ((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19.5)) trafficFactor = 1.55;
                    else if (hour >= 12 && hour <= 14) trafficFactor = 1.25;
                } else {
                    if (hour >= 16 && hour <= 21) trafficFactor = 1.35;
                }
                let distMod = 1.0;
                if (distanceKm <= 5) distMod = 0.65;
                else if (distanceKm <= 15) distMod = 0.85;
                const finalTraffic = 1 + ((trafficFactor - 1) * distMod);
                const adjustedDuration = Math.max(1, Math.round(baseDurationMins * finalTraffic));
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.geoJSON(route.geometry, { style: { color: '#a855f7', weight: 5, opacity: 0.9 } }).addTo(map);
                map.fitBounds(L.latLngBounds([pickupCoords.lat, pickupCoords.lon], [dropoffCoords.lat, dropoffCoords.lon]), { padding: [45, 45] });
                computeFare(distanceKm, adjustedDuration);
            }).catch(err => {
                console.error(err);
                showError("Routing error, please check connectivity.");
            });
        }, 220);
    }

    function computeFare(distance, durationMins) {
        const baseFare = 5.0;
        const perKm = 1.25;
        const distanceFare = distance * perKm;
        let tolls = 0;
        if (distance > 6) {
            tolls = distance <= 45 ? 2.5 : 3.5 + ((distance - 45) * 0.09);
        }
        const incentive = (durationMins / 60) * 14.8;
        let deadhead = 0;
        if (distance > 12) {
            const boundary = Math.min(distance, 350);
            const scale = ((boundary - 12) / (350 - 12)) * 0.45;
            deadhead = distanceFare * scale;
            document.getElementById('deadhead-km-row').style.display = 'flex';
        } else {
            document.getElementById('deadhead-km-row').style.display = 'none';
        }
        let rawTotal = baseFare + distanceFare + tolls + incentive + deadhead;
        let roundedTotal = Math.round(rawTotal * 10) / 10;
        let finalDisplay = Math.round(roundedTotal);
        document.getElementById('total-fare').innerHTML = `RM ${finalDisplay}`;
        document.getElementById('fare-distance').innerHTML = `${distance.toFixed(1)} km`;
        let durationText = durationMins < 60 ? `${durationMins} mins` : `${Math.floor(durationMins/60)} hr ${durationMins%60} mins`;
        document.getElementById('fare-duration').innerHTML = durationText;
        document.getElementById('calc-base-fare').innerHTML = `RM ${baseFare.toFixed(2)}`;
        document.getElementById('calc-ride-distance-rate').innerHTML = `RM ${distanceFare.toFixed(2)}`;
        document.getElementById('calc-tolls').innerHTML = `RM ${tolls.toFixed(2)}`;
        document.getElementById('calc-incentive').innerHTML = `RM ${incentive.toFixed(2)}`;
        document.getElementById('calc-deadhead-km').innerHTML = `RM ${deadhead.toFixed(2)}`;
        document.getElementById('calc-grand').innerHTML = `RM ${roundedTotal.toFixed(2)}`;
        document.getElementById('result-card').style.display = 'block';
    }

    function toggleInvoice() {
        const details = document.getElementById('invoice-details');
        const lbl = document.getElementById('toggle-lbl');
        if (details.style.display === 'none' || !details.style.display) {
            details.style.display = 'block';
            lbl.textContent = 'Hide';
        } else {
            details.style.display = 'none';
            lbl.textContent = 'Details';
        }
    }

    // Global swap function
    window.executeLocationSwap = function() {
        const tempText = pickupInput.value;
        const tempCoords = pickupCoords;
        pickupInput.value = dropoffInput.value;
        pickupCoords = dropoffCoords;
        dropoffInput.value = tempText;
        dropoffCoords = tempCoords;
        document.getElementById('clear-pickup').style.display = pickupInput.value ? 'block' : 'none';
        document.getElementById('clear-dropoff').style.display = dropoffInput.value ? 'block' : 'none';
        if (pickupCoords) updateMarker('pickup', pickupCoords);
        else if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
        if (dropoffCoords) updateMarker('dropoff', dropoffCoords);
        else if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
        else resetCalculationDisplay();
    };
    document.getElementById('swap-locations-btn').addEventListener('click', () => window.executeLocationSwap());

    // Autocomplete bindings
    setupAutocomplete('pickup', 'pickup-suggestions', 'clear-pickup', (coords) => {
        pickupCoords = coords;
        updateMarker('pickup', coords);
        if (dropoffCoords) checkAndProcessRoute();
        else resetCalculationDisplay();
    }, () => {
        pickupCoords = null;
        if (pickupMarker) map.removeLayer(pickupMarker); pickupMarker = null;
        resetCalculationDisplay();
    });

    setupAutocomplete('dropoff', 'dropoff-suggestions', 'clear-dropoff', (coords) => {
        dropoffCoords = coords;
        updateMarker('dropoff', coords);
        if (pickupCoords) checkAndProcessRoute();
        else resetCalculationDisplay();
    }, () => {
        dropoffCoords = null;
        if (dropoffMarker) map.removeLayer(dropoffMarker); dropoffMarker = null;
        resetCalculationDisplay();
    });

    // Map click: set active field location
    map.on('click', async function(e) {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;
        const targetId = activeInputFieldId;
        const targetInput = document.getElementById(targetId);
        const clearBtn = document.getElementById(targetId === 'pickup' ? 'clear-pickup' : 'clear-dropoff');
        // temporary coordinate indicator
        targetInput.value = `📍 (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
        clearBtn.style.display = 'block';
        const selectedCoords = { lat, lon };
        if (targetId === 'pickup') {
            pickupCoords = selectedCoords;
            updateMarker('pickup', selectedCoords);
        } else {
            dropoffCoords = selectedCoords;
            updateMarker('dropoff', selectedCoords);
        }
        // reverse geocode for readable malaysia address
        await reverseGeocodeMalaysia(lat, lon, targetInput, targetId === 'pickup');
        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
        else resetCalculationDisplay();
        if (targetId === 'pickup' && !dropoffCoords) {
            activeInputFieldId = 'dropoff';
            dropoffInput.focus();
        }
    });

    // Current location (GPS) with malaysia address fix
    document.getElementById('current-loc-btn').addEventListener('click', () => {
        if (!navigator.geolocation) return showError("Geolocation not supported.");
        const btn = document.getElementById('current-loc-btn');
        btn.textContent = "⏳";
        navigator.geolocation.getCurrentPosition(async (pos) => {
            btn.textContent = "📍";
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            pickupCoords = { lat, lon };
            await reverseGeocodeMalaysia(lat, lon, pickupInput, true);
            document.getElementById('clear-pickup').style.display = 'block';
            updateMarker('pickup', pickupCoords);
            map.setView([lat, lon], 15);
            if (dropoffCoords) checkAndProcessRoute();
            activeInputFieldId = 'dropoff';
            dropoffInput.focus();
        }, (err) => {
            btn.textContent = "📍";
            showError("Location access denied or unavailable.");
            console.error(err);
        }, { enableHighAccuracy: true, timeout: 8000 });
    });
    
    // Initial reset UI
    resetCalculationDisplay();
</script>
</body>
</html>
