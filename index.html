<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rideshare MY - Pure Fare Estimator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6fa;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden; color: #1e2a3e;
        }
        #container { display: flex; flex-direction: column; height: 100%; }
        #map { height: 35vh; width: 100%; z-index: 1; background: #dce3ec; }
        #search-panel {
            flex: 1; background: white; padding: 18px 16px 20px 16px;
            box-shadow: 0 -8px 28px rgba(0,0,0,0.08); z-index: 10;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
        h2 { margin: 0; font-size: 20px; font-weight: 700; color: #1e2a3e; }
        .badge { font-size: 12px; background: #eef2ff; padding: 4px 8px; border-radius: 40px; color: #2c3e66; font-weight: 500; }
        .routing-wrapper { position: relative; display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
        .input-container { position: relative; display: flex; align-items: center; }
        input {
            width: 100%; padding: 14px 72px 14px 16px;
            border: 1px solid #e2e8f0; border-radius: 20px; font-size: 15px;
            transition: all 0.2s; font-weight: 500;
        }
        #pickup { padding-right: 88px; }
        input:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
        .action-group { position: absolute; right: 12px; display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            background: transparent; border: none; font-size: 18px; cursor: pointer;
            color: #5b6e8c; width: 32px; height: 32px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .icon-btn:hover { background: #f1f5f9; color: #a855f7; }
        .clear-btn { font-size: 20px; display: none; }
        .swap-container { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); z-index: 20; }
        .swap-btn {
            background: white; border: 1px solid #e2e8f0; color: #a855f7;
            width: 34px; height: 34px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            cursor: pointer; font-size: 18px; transition: 0.2s;
        }
        .swap-btn:hover { background: #faf5ff; transform: translateY(-50%) scale(1.05); }
        .suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border-radius: 18px; border: 1px solid #eef2ff;
            max-height: 220px; overflow-y: auto; z-index: 1000;
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.2); display: none;
        }
        .suggestion-item { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .suggestion-item:hover { background: #faf5ff; }
        #result-card {
            background: linear-gradient(145deg, #111827, #1f2937); color: white;
            border-radius: 28px; padding: 20px; margin-top: 16px; display: none;
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
        }
        .fare-header-row { display: flex; justify-content: space-between; align-items: baseline; }
        .fare-header { font-size: 34px; font-weight: 800; color: #d8b4fe; letter-spacing: -0.5px; }
        .fare-meta { display: flex; justify-content: space-between; font-size: 13px; background: rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 40px; margin-top: 8px; }
        #invoice-details { margin-top: 18px; border-top: 1px solid #334155; padding-top: 12px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; margin-bottom: 10px; }
        .detail-row.total-bold { color: white; font-weight: 700; border-top: 1px solid #334155; padding-top: 10px; margin-top: 4px; font-size: 15px; }
        #error-msg { background: #fee2e2; color: #b91c1c; padding: 10px 16px; border-radius: 40px; font-size: 13px; font-weight: 500; display: none; margin: 8px 0 0; }
        .test-tool { background: #f8fafc; border-radius: 20px; padding: 10px 12px; margin-top: 14px; font-size: 12px; border: 1px solid #e4e8f0; color: #334155; }
        .test-btn { background: #2d3a4a; border: none; color: white; border-radius: 40px; padding: 6px 12px; font-size: 11px; font-weight: 600; margin-top: 6px; width: 100%; cursor: pointer; transition: 0.2s; }
        .test-btn:hover { background: #a855f7; }
        @media(min-width: 768px) {
            #container { flex-direction: row-reverse; }
            #map { height: 100%; flex: 1; }
            #search-panel { width: 420px; height: 100%; border-radius: 0; }
        }
    </style>
</head>
<body>
<div id="container">
    <div id="map"></div>
    <div id="search-panel">
        <div class="header-row">
            <h2>🚖 Pure Fare</h2>
            <div class="badge">Malaysia • Direct Routing Data</div>
        </div>
        <div class="routing-wrapper">
            <div class="input-container">
                <input type="text" id="pickup" placeholder="Pickup location" autocomplete="off">
                <div class="action-group">
                    <button class="icon-btn" id="current-loc-btn" title="Use my location">📍</button>
                    <button class="icon-btn clear-btn" id="clear-pickup">✕</button>
                </div>
                <div id="pickup-suggestions" class="suggestions"></div>
            </div>
            <div class="swap-container">
                <button class="swap-btn" id="swap-locations-btn" title="Swap A↔B">⇅</button>
            </div>
            <div class="input-container">
                <input type="text" id="dropoff" placeholder="Drop-off location" autocomplete="off">
                <div class="action-group">
                    <button class="icon-btn clear-btn" id="clear-dropoff">✕</button>
                </div>
                <div id="dropoff-suggestions" class="suggestions"></div>
            </div>
        </div>
        <div id="error-msg"></div>
        <div id="result-card">
            <div class="fare-header-row"><div id="total-fare" class="fare-header">RM --</div></div>
            <div class="fare-meta"><span id="fare-distance">0 km</span><span id="fare-duration">0 mins</span></div>
            <div id="invoice-details">
                <div class="detail-row"><span>Base Fare</span><span id="calc-base-fare">RM 0.00</span></div>
                <div class="detail-row"><span>Distance Fare (RM1.25/km)</span><span id="calc-ride-distance-rate">RM 0.00</span></div>
                <div class="detail-row"><span>Dynamic Incentive (time)</span><span id="calc-incentive">RM 0.00</span></div>
                <div class="detail-row" id="deadhead-km-row" style="display: none;"><span>Out-of-Zone Surcharge</span><span id="calc-deadhead-km">RM 0.00</span></div>
                <div class="detail-row total-bold"><span>Rounded Final Total</span><span id="calc-grand" style="color: #d8b4fe;">RM 0.00</span></div>
            </div>
        </div>
        <div class="test-tool">
            ⚡ TEST: SMK Meru (Klang) → Amsteel Industries (Shah Alam) 
            <button class="test-btn" id="testMeruAmsteelBtn">🚗 Load test route</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([3.1390, 101.6869], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);

    let pickupMarker = null, dropoffMarker = null, routeLine = null;
    let pickupCoords = null, dropoffCoords = null;
    let currentRouteTimeout = null, routeAbortController = null;
    
    function formatDuration(totalMins) {
        if (totalMins < 60) return `${Math.round(totalMins)} mins`;
        const hours = Math.floor(totalMins / 60);
        const mins = Math.round(totalMins % 60);
        return mins > 0 ? `${hours} hr ${mins} mins` : `${hours} hr`;
    }
    
    function processCalculations(distanceKm, durationMins) {
        const baseFare = 5.00, perKmRate = 1.25;
        const rideDistanceFare = distanceKm * perKmRate;
        const driverIncentive = (durationMins / 60) * 14.80;
        
        let deadheadCost = 0;
        if (distanceKm > 12) {
            deadheadCost = rideDistanceFare * (Math.min(distanceKm, 350) - 12) / (350 - 12) * 0.45;
            document.getElementById('deadhead-km-row').style.display = 'flex';
        } else {
            document.getElementById('deadhead-km-row').style.display = 'none';
        }
        
        let roundedTotal = Math.round((Math.max(baseFare, baseFare + rideDistanceFare + driverIncentive + deadheadCost)) * 10) / 10;
        
        document.getElementById('total-fare').textContent = `RM ${Math.round(roundedTotal)}`;
        document.getElementById('fare-distance').textContent = `${distanceKm.toFixed(1)} km`;
        document.getElementById('fare-duration').textContent = formatDuration(durationMins);
        document.getElementById('calc-base-fare').textContent = `RM ${baseFare.toFixed(2)}`;
        document.getElementById('calc-ride-distance-rate').textContent = `RM ${rideDistanceFare.toFixed(2)}`;
        document.getElementById('calc-incentive').textContent = `RM ${driverIncentive.toFixed(2)}`;
        document.getElementById('calc-deadhead-km').textContent = `RM ${deadheadCost.toFixed(2)}`;
        document.getElementById('calc-grand').textContent = `RM ${roundedTotal.toFixed(2)}`;
        document.getElementById('result-card').style.display = 'block';
    }
    
    function computeTrafficDuration(baseMinutes) {
        const now = new Date(), hour = now.getHours(), isWeekend = ([0, 6].includes(now.getDay()));
        let factor = isWeekend ? ((hour >= 16 && hour <= 21) ? 1.35 : 1.05) : (((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19.5)) ? 1.55 : ((hour >= 12 && hour <= 14) ? 1.25 : 1.12));
        return Math.max(2, Math.round(baseMinutes * (1 + ((factor - 1) * (baseMinutes <= 12 ? 0.75 : (baseMinutes <= 30 ? 0.9 : 1.0))))));
    }
    
    async function fetchRouteAndFare() {
        if (!pickupCoords || !dropoffCoords) return;
        document.getElementById('error-msg').style.display = 'none';
        if (currentRouteTimeout) clearTimeout(currentRouteTimeout);
        if (routeAbortController) routeAbortController.abort();
        routeAbortController = new AbortController();
        
        currentRouteTimeout = setTimeout(async () => {
            try {
                const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${pickupCoords.lon},${pickupCoords.lat};${dropoffCoords.lon},${dropoffCoords.lat}?overview=full&geometries=geojson`, { signal: routeAbortController.signal });
                const data = await response.json();
                if (!data.routes?.length) { showError("No drivable route found."); return; }
                
                const route = data.routes[0];
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.geoJSON(route.geometry, { style: { color: '#a855f7', weight: 5, opacity: 0.9, dashArray: '6, 8' } }).addTo(map);
                map.fitBounds(L.latLngBounds([pickupCoords.lat, pickupCoords.lon], [dropoffCoords.lat, dropoffCoords.lon]), { padding: [45, 45] });
                processCalculations(route.distance / 1000, computeTrafficDuration(route.duration / 60));
            } catch (err) {
                if (err.name !== 'AbortError') showError("Routing error: cannot retrieve road data.");
            }
        }, 280);
    }
    
    function showError(msg) {
        const errDiv = document.getElementById('error-msg');
        errDiv.textContent = msg; errDiv.style.display = 'block';
        document.getElementById('result-card').style.display = 'none';
    }
    
    function resetCalculationDisplay() {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
    }
    
    function updateMarker(type, coords) {
        const marker = type === 'pickup' ? pickupMarker : dropoffMarker;
        if (marker) map.removeLayer(marker);
        const newMarker = L.marker([coords.lat, coords.lon], { icon: L.divIcon({ className: 'custom-pin', html: type === 'pickup' ? '📍' : '🏁', iconSize: [24,24] }) }).addTo(map);
        type === 'pickup' ? pickupMarker = newMarker : dropoffMarker = newMarker;
    }
    
    function expandAddress(p) {
        return [p.name, p.street, p.district, p.city || p.town, p.state].filter(Boolean).join(', ') || 'Selected location';
    }
    
    function setupAutocomplete(inputId, suggestionsId, clearBtnId, onSelect, onClear) {
        const input = document.getElementById(inputId), box = document.getElementById(suggestionsId), btn = document.getElementById(clearBtnId);
        let debounce;
        input.addEventListener('input', () => {
            clearTimeout(debounce);
            const val = input.value.trim();
            btn.style.display = val ? 'block' : 'none';
            if (val.length < 3) { box.style.display = 'none'; box.innerHTML = ''; return; }
            debounce = setTimeout(() => {
                const b = map.getBounds(), bbox = `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`;
                fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(val)}&bbox=${bbox}&limit=6&lang=en`)
                    .then(res => res.json()).then(data => {
                        box.innerHTML = '';
                        if (!data.features?.length) { box.style.display = 'none'; return; }
                        box.style.display = 'block';
                        data.features.forEach(f => {
                            const address = expandAddress(f.properties);
                            const div = document.createElement('div');
                            div.className = 'suggestion-item'; div.textContent = address;
                            div.addEventListener('click', () => {
                                input.value = address; box.style.display = 'none';
                                const [lon, lat] = f.geometry.coordinates; onSelect({ lat, lon });
                            });
                            box.appendChild(div);
                        });
                    }).catch(() => box.style.display = 'none');
            }, 320);
        });
        btn.addEventListener('click', () => { input.value = ''; btn.style.display = 'none'; box.innerHTML = ''; box.style.display = 'none'; onClear(); });
    }
    
    document.getElementById('swap-locations-btn').addEventListener('click', () => {
        const pInp = document.getElementById('pickup'), dInp = document.getElementById('dropoff'), tVal = pInp.value, tCoord = pickupCoords;
        pInp.value = dInp.value; pickupCoords = dropoffCoords; dInp.value = tVal; dropoffCoords = tCoord;
        document.getElementById('clear-pickup').style.display = pInp.value ? 'block' : 'none';
        document.getElementById('clear-dropoff').style.display = dInp.value ? 'block' : 'none';
        pickupCoords ? updateMarker('pickup', pickupCoords) : (pickupMarker && (map.removeLayer(pickupMarker), pickupMarker = null));
        dropoffCoords ? updateMarker('dropoff', dropoffCoords) : (dropoffMarker && (map.removeLayer(dropoffMarker), dropoffMarker = null));
        pickupCoords && dropoffCoords ? fetchRouteAndFare() : resetCalculationDisplay();
    });
    
    document.getElementById('testMeruAmsteelBtn').addEventListener('click', () => {
        pickupCoords = { lat: 3.0425, lon: 101.4380 }; dropoffCoords = { lat: 3.0475, lon: 101.5130 };
        updateMarker('pickup', pickupCoords); updateMarker('dropoff', dropoffCoords);
        document.getElementById('pickup').value = "SMK Meru, Klang, Selangor";
        document.getElementById('dropoff').value = "Amsteel Industries, Shah Alam, Selangor";
        document.getElementById('clear-pickup').style.display = 'block'; document.getElementById('clear-dropoff').style.display = 'block';
        map.setView([3.045, 101.475], 12); fetchRouteAndFare();
    });
    
    document.getElementById('current-loc-btn').addEventListener('click', () => {
        if (!navigator.geolocation) { showError("Geolocation unsupported."); return; }
        const pInp = document.getElementById('pickup'); pInp.value = "Locating...";
        navigator.geolocation.getCurrentPosition(pos => {
            pickupCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            updateMarker('pickup', pickupCoords); map.setView([pickupCoords.lat, pickupCoords.lon], 14);
            document.getElementById('clear-pickup').style.display = 'block';
            fetch(`https://photon.komoot.io/api/reverse?lon=${pickupCoords.lon}&lat=${pickupCoords.lat}`)
                .then(res => res.json()).then(data => {
                    pInp.value = data.features?.length ? expandAddress(data.features[0].properties) : `Gps: ${pickupCoords.lat.toFixed(4)}, ${pickupCoords.lon.toFixed(4)}`;
                    fetchRouteAndFare();
                }).catch(() => { pInp.value = `Gps: ${pickupCoords.lat.toFixed(4)}, ${pickupCoords.lon.toFixed(4)}`; fetchRouteAndFare(); });
        }, () => { pInp.value = ""; showError("Location access denied."); });
    });
    
    setupAutocomplete('pickup', 'pickup-suggestions', 'clear-pickup', (c) => { pickupCoords = c; updateMarker('pickup', c); fetchRouteAndFare(); }, () => { pickupCoords = null; if(pickupMarker){map.removeLayer(pickupMarker);pickupMarker=null;} resetCalculationDisplay(); });
    setupAutocomplete('dropoff', 'dropoff-suggestions', 'clear-dropoff', (c) => { dropoffCoords = c; updateMarker('dropoff', c); fetchRouteAndFare(); }, () => { dropoffCoords = null; if(dropoffMarker){map.removeLayer(dropoffMarker);dropoffMarker=null;} resetCalculationDisplay(); });
</script>
</body>
</html>
