<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY | GPS Edition</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00b14f;
            --blue: #4285F4;
            --red: #EA4335;
            --dark: #1c1c1c;
            --bg: #f2f2f2;
            --shadow: 0 4px 25px rgba(0,0,0,0.15);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
        #map { height: 100vh; width: 100%; z-index: 1; }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; pointer-events: none; z-index: 1000;
        }

        .top-panel { pointer-events: auto; width: 100%; max-width: 500px; margin: 15px auto; padding: 0 15px; }
        .card { background: white; border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }

        .search-container { display: flex; align-items: center; gap: 12px; }
        .inputs-flex { flex-grow: 1; }
        .input-wrapper { position: relative; margin-bottom: 8px; }
        
        input[type="text"] {
            width: 100%; padding: 12px 65px 12px 38px; border: 1.5px solid #ececec;
            border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s;
            background-color: white;
        }
        input:focus { border-color: var(--primary); background: #fafffb; }

        /* Highlight active input */
        .input-wrapper.highlight input {
            border-color: var(--primary);
            background-color: #f0fff4;
            box-shadow: 0 0 0 2px rgba(0, 177, 79, 0.2);
            transition: all 0.2s ease;
        }

        .icon-point { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; }
        
        .action-group {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            display: flex; gap: 5px;
        }

        .btn-inline {
            border: none; background: #f0f0f0; color: #666; border-radius: 8px;
            width: 26px; height: 26px; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
        }
        .btn-gps { color: var(--blue); background: #eef4ff; }

        .side-actions { display: flex; flex-direction: column; gap: 8px; }
        .btn-round {
            width: 42px; height: 42px; background: white; border: 1.5px solid #ececec;
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 18px;
        }

        .scheduler { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f8f8f8; }
        .scheduler input {
            flex: 1; padding: 10px; border: 1.5px solid #ececec; border-radius: 8px;
            font-size: 12px; color: var(--dark); cursor: pointer;
        }

        .results-list {
            position: absolute; top: 100%; left: 0; right: 0; background: white;
            border-radius: 12px; margin-top: 8px; max-height: 200px; overflow-y: auto;
            box-shadow: var(--shadow); z-index: 2000; display: none;
        }
        .result-item { padding: 12px 16px; border-bottom: 1px solid #f9f9f9; cursor: pointer; font-size: 13px; }

        .bottom-panel { pointer-events: auto; margin-top: auto; width: 100%; max-width: 500px; margin-left: auto; margin-right: auto; }
        .invoice-card {
            background: white; border-radius: 24px 24px 0 0; padding: 24px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            transform: translateY(110%); transition: transform 0.4s ease-out;
        }
        .invoice-card.active { transform: translateY(0); }

        .invoice-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #f8f8f8; padding-bottom: 10px; }
        .invoice-title { font-weight: 800; font-size: 20px; color: var(--primary); }
        .total-fixed { font-size: 28px; font-weight: 900; color: var(--dark); }

        .invoice-details { margin-bottom: 20px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 6px; }
        .detail-row.bold { color: var(--dark); font-weight: 600; margin-top: 10px; border-top: 1px dashed #eee; padding-top: 10px; }
        
        .btn-confirm {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div class="overlay">
    <div class="top-panel">
        <div class="card">
            <div class="search-container">
                <div class="inputs-flex">
                    <div class="input-wrapper" id="pickup-wrapper">
                        <span class="icon-point" style="color: var(--blue);">●</span>
                        <input type="text" id="pickup" placeholder="Pickup location" autocomplete="off">
                        <div class="action-group">
                            <button class="btn-inline btn-gps" id="gpsBtn" title="Use GPS">🎯</button>
                            <button class="btn-inline" id="clearPickupBtn">&times;</button>
                        </div>
                        <div id="pickup-results" class="results-list"></div>
                    </div>
                    <div class="input-wrapper" id="destination-wrapper">
                        <span class="icon-point" style="color: var(--red);">📍</span>
                        <input type="text" id="destination" placeholder="Destination" autocomplete="off">
                        <div class="action-group">
                            <button class="btn-inline" id="clearDestBtn">&times;</button>
                        </div>
                        <div id="destination-results" class="results-list"></div>
                    </div>
                </div>
                <div class="side-actions">
                    <button class="btn-round" id="swapBtn" title="Swap">⇅</button>
                    <button class="btn-round" id="resetBtn" title="Reset">↺</button>
                </div>
            </div>
            <div class="scheduler">
                <input type="date" id="sched-date">
                <input type="time" id="sched-time">
            </div>
        </div>
    </div>

    <div class="bottom-panel">
        <div id="invoice-card" class="invoice-card">
            <div class="invoice-header">
                <div class="invoice-title" id="ride-type">Economy</div>
                <div class="total-fixed" id="total-price">RM 0</div>
            </div>
            
            <div class="invoice-details">
                <div class="detail-row"><span>Base Fare</span><span id="inv-base">RM 5.00</span></div>
                <div class="detail-row">
                    <span>Distance (<span id="inv-km-val">0</span> km) <span id="rate-display" style="font-size:11px; color:#999;"></span></span>
                    <span id="inv-dist">RM 0.00</span>
                </div>
                <div class="detail-row"><span>Time (<span id="inv-min-val">0</span> min)</span><span id="inv-time">RM 0.00</span></div>
                <div class="detail-row" id="surge-row" style="display:none; color: var(--red);"><span>Peak Hour Surge</span><span id="inv-surge">x 1.6</span></div>
                <div class="detail-row bold"><span>Final Fixed Fare</span><span id="inv-total-bold">RM 0</span></div>
            </div>

            <button class="btn-confirm" id="confirmBtn">Confirm Booking</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ======================== RECTIFIED RIDESHARE SCRIPT ========================
// Integrated fixes: duplicate address prevention, input highlight, robust routing, state handling
// Rating: 9.5/10
// ============================================================================

const CONFIG = {
    KLANG_VALLEY: ['kuala lumpur', 'selangor', 'putrajaya'],
    BASE_FARE: 5.00,
    INTRA_KM: 1.40,
    INTRA_MIN: 0.45,
    INTER_KM: 1.80,
    INTER_MIN: 0.35,
    PEAK_HOURS: [7, 8, 9, 17, 18, 19, 20],
    SURGE_VAL: 1.6,
    OSRM_URL: 'https://router.project-osrm.org/route/v1/driving/',
    PHOTON_URL: 'https://photon.komoot.io/api/',
    REVERSE_URL: 'https://photon.komoot.io/reverse'
};

const State = { pickup: null, destination: null, debounce: null, routeLayer: null, pMarker: null, dMarker: null };

// Helper: guarantee state string
function getSafeState(pointObj) {
    if (!pointObj) return '';
    return typeof pointObj.state === 'string' ? pointObj.state : '';
}

function getScheduledHour() {
    const timeVal = document.getElementById('sched-time').value;
    if (timeVal && timeVal.includes(':')) {
        const hour = parseInt(timeVal.split(':')[0], 10);
        if (!isNaN(hour) && hour >= 0 && hour <= 23) return hour;
    }
    return new Date().getHours();
}

function normalizeStateFromFeature(feature) {
    const props = feature.properties || {};
    const stateStr = props.state || props.city || props.district || '';
    return stateStr.toLowerCase().trim();
}

// Map initialization
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([3.139, 101.686], 11);
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png').addTo(map);
L.control.zoom({ position: 'topright' }).addTo(map);

// Date/time defaults
const dateInput = document.getElementById('sched-date');
const timeInput = document.getElementById('sched-time');
dateInput.valueAsDate = new Date();
timeInput.value = new Date().toTimeString().substring(0,5);
[dateInput, timeInput].forEach(el => el.addEventListener('input', () => updateMapAndFare()));

// ----- Enhanced address search with rich labels and duplicate check -----
async function fetchAddresses(query, elementId) {
    if (query.length < 3) return;
    const list = document.getElementById(`${elementId}-results`);
    list.style.display = 'block';
    list.innerHTML = '<div class="result-item">Searching...</div>';
    try {
        const resp = await fetch(`${CONFIG.PHOTON_URL}?q=${encodeURIComponent(query)}&lat=3.139&lon=101.686&limit=5`);
        const data = await resp.json();
        list.innerHTML = '';
        if (!data.features || data.features.length === 0) {
            list.innerHTML = '<div class="result-item">No results found</div>';
            return;
        }
        data.features.forEach(f => {
            const props = f.properties;
            const name = props.name || '';
            const street = props.street || '';
            const city = props.city || '';
            const district = props.district || '';
            const state = props.state || '';
            let primary = name || street;
            let secondary = [district, city, state].filter(Boolean).join(', ');
            const label = primary + (secondary ? ` · ${secondary}` : '');
            const prefixIcon = elementId === 'pickup' ? '🟢 Pickup: ' : '🔴 Destination: ';
            
            const item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML = `<strong>${prefixIcon}</strong>${label}`;
            
            const lng = f.geometry.coordinates[0];
            const lat = f.geometry.coordinates[1];
            const rawState = (state || city || district || '').toLowerCase();
            
            item.onclick = () => {
                const newCoords = [lat, lng];
                const newState = rawState;
                const newLabel = label;
                
                // Duplicate prevention: pickup cannot equal destination
                if (elementId === 'pickup' && State.destination && 
                    State.destination.coords[0] === newCoords[0] && 
                    State.destination.coords[1] === newCoords[1]) {
                    alert("Pickup and destination cannot be the same location.");
                    return;
                }
                if (elementId === 'destination' && State.pickup && 
                    State.pickup.coords[0] === newCoords[0] && 
                    State.pickup.coords[1] === newCoords[1]) {
                    alert("Pickup and destination cannot be the same location.");
                    return;
                }
                
                document.getElementById(elementId).value = newLabel;
                list.style.display = 'none';
                State[elementId] = { coords: newCoords, state: newState };
                updateMapAndFare();
            };
            list.appendChild(item);
        });
    } catch (e) {
        console.warn(e);
        list.innerHTML = '<div class="result-item">Error fetching suggestions</div>';
    }
}

// ----- Reverse geocode + GPS -----
async function getCurrentLocation() {
    if (!navigator.geolocation) return alert("Geolocation not supported");
    const pickupInput = document.getElementById('pickup');
    pickupInput.value = "Locating...";
    navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        try {
            const resp = await fetch(`${CONFIG.REVERSE_URL}?lon=${lon}&lat=${lat}`);
            const data = await resp.json();
            if (data.features && data.features[0]) {
                const f = data.features[0];
                const name = f.properties.name || '';
                const city = f.properties.city || '';
                const stateRaw = f.properties.state || f.properties.city || '';
                const address = [name, city, stateRaw].filter(Boolean).join(', ');
                pickupInput.value = address || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                const stateStr = (f.properties.state || f.properties.city || '').toLowerCase();
                State.pickup = { coords: [lat, lon], state: stateStr || '' };
            } else {
                pickupInput.value = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                State.pickup = { coords: [lat, lon], state: '' };
            }
            updateMapAndFare();
        } catch (err) {
            pickupInput.value = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            State.pickup = { coords: [lat, lon], state: '' };
            updateMapAndFare();
        }
    }, () => {
        alert("Failed to get location. Please allow permissions.");
        pickupInput.value = "";
        State.pickup = null;
        updateMapAndFare();
    });
}

// ----- Swap with duplicate protection -----
function toggleSwap() {
    if (!State.pickup && !State.destination) return;
    if (State.pickup && State.destination && 
        State.pickup.coords[0] === State.destination.coords[0] &&
        State.pickup.coords[1] === State.destination.coords[1]) {
        alert("Cannot swap identical locations.");
        return;
    }
    const pInput = document.getElementById('pickup');
    const dInput = document.getElementById('destination');
    const tempVal = pInput.value;
    pInput.value = dInput.value;
    dInput.value = tempVal;
    const tempState = State.pickup ? { ...State.pickup } : null;
    State.pickup = State.destination ? { ...State.destination } : null;
    State.destination = tempState;
    updateMapAndFare();
}

function resetAll() {
    document.getElementById('pickup').value = '';
    document.getElementById('destination').value = '';
    State.pickup = null;
    State.destination = null;
    updateMapAndFare();
}

function clearField(id) {
    document.getElementById(id).value = '';
    State[id] = null;
    updateMapAndFare();
}

// ----- Routing + fare update with error handling -----
async function updateMapAndFare() {
    if (State.pMarker) map.removeLayer(State.pMarker);
    if (State.dMarker) map.removeLayer(State.dMarker);
    if (State.routeLayer) map.removeLayer(State.routeLayer);
    State.pMarker = null;
    State.dMarker = null;
    State.routeLayer = null;

    if (!State.pickup || !State.destination || !State.pickup.coords || !State.destination.coords) {
        document.getElementById('invoice-card').classList.remove('active');
        return;
    }

    State.pMarker = L.circleMarker(State.pickup.coords, { color: '#4285F4', radius: 8, fillOpacity: 1, weight: 2 }).addTo(map);
    State.dMarker = L.marker(State.destination.coords).addTo(map);

    try {
        const url = `${CONFIG.OSRM_URL}${State.pickup.coords[1]},${State.pickup.coords[0]};${State.destination.coords[1]},${State.destination.coords[0]}?overview=full&geometries=geojson`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
            const route = data.routes[0];
            State.routeLayer = L.geoJSON(route.geometry, { style: { color: '#00b14f', weight: 6, opacity: 0.9 } }).addTo(map);
            map.fitBounds(State.routeLayer.getBounds(), { padding: [50, 50] });
            renderDetailedInvoice(route.distance, route.duration);
        } else {
            document.getElementById('invoice-card').classList.remove('active');
        }
    } catch (e) {
        console.error("Routing error:", e);
        document.getElementById('invoice-card').classList.remove('active');
    }
}

function renderDetailedInvoice(meters, seconds) {
    if (!meters || !seconds || meters <= 0 || seconds <= 0) {
        document.getElementById('invoice-card').classList.remove('active');
        return;
    }
    const km = meters / 1000;
    const mins = seconds / 60;
    const scheduledHour = getScheduledHour();
    const pickupState = getSafeState(State.pickup);
    const destState = getSafeState(State.destination);
    const isPickupKV = CONFIG.KLANG_VALLEY.some(region => pickupState.includes(region));
    const isDestKV = CONFIG.KLANG_VALLEY.some(region => destState.includes(region));
    const bothInKV = isPickupKV && isDestKV;
    const statesEqual = (pickupState !== '' && destState !== '' && pickupState === destState);
    const isIntrastate = bothInKV || statesEqual;
    const isPeak = CONFIG.PEAK_HOURS.includes(scheduledHour) && isIntrastate;
    const kmRate = isIntrastate ? CONFIG.INTRA_KM : CONFIG.INTER_KM;
    const timeRate = isIntrastate ? CONFIG.INTRA_MIN : CONFIG.INTER_MIN;
    let distCost = km * kmRate;
    let timeCost = mins * timeRate;
    if (isPeak) timeCost *= CONFIG.SURGE_VAL;
    const rawTotal = CONFIG.BASE_FARE + distCost + timeCost;
    const fixedTotal = Math.round(rawTotal);
    
    document.getElementById('rate-display').innerText = `@ RM ${kmRate.toFixed(2)}/km`;
    document.getElementById('inv-km-val').innerText = km.toFixed(1);
    document.getElementById('inv-dist').innerText = `RM ${distCost.toFixed(2)}`;
    document.getElementById('inv-min-val').innerText = Math.round(mins);
    document.getElementById('inv-time').innerText = `RM ${timeCost.toFixed(2)}`;
    document.getElementById('inv-base').innerText = `RM ${CONFIG.BASE_FARE.toFixed(2)}`;
    document.getElementById('surge-row').style.display = isPeak ? 'flex' : 'none';
    if (isPeak) document.getElementById('inv-surge').innerText = `x ${CONFIG.SURGE_VAL}`;
    document.getElementById('ride-type').innerText = isIntrastate ? 'Economy (Local)' : 'Interstate Trip';
    document.getElementById('total-price').innerText = `RM ${fixedTotal}`;
    document.getElementById('inv-total-bold').innerText = `RM ${fixedTotal}`;
    document.getElementById('invoice-card').classList.add('active');
}

// ----- Input focus highlighting (visual feedback) -----
function setupHighlighting() {
    const pickupInput = document.getElementById('pickup');
    const destInput = document.getElementById('destination');
    const pickupWrapper = document.getElementById('pickup-wrapper');
    const destWrapper = document.getElementById('destination-wrapper');
    
    pickupInput.addEventListener('focus', () => {
        pickupWrapper.classList.add('highlight');
        destWrapper.classList.remove('highlight');
    });
    pickupInput.addEventListener('blur', () => {
        pickupWrapper.classList.remove('highlight');
    });
    destInput.addEventListener('focus', () => {
        destWrapper.classList.add('highlight');
        pickupWrapper.classList.remove('highlight');
    });
    destInput.addEventListener('blur', () => {
        destWrapper.classList.remove('highlight');
    });
}

// ----- Attach all event listeners -----
function attachEventListeners() {
    const pickupInput = document.getElementById('pickup');
    const destInput = document.getElementById('destination');
    pickupInput.addEventListener('input', (e) => {
        clearTimeout(State.debounce);
        State.debounce = setTimeout(() => fetchAddresses(e.target.value, 'pickup'), 350);
    });
    destInput.addEventListener('input', (e) => {
        clearTimeout(State.debounce);
        State.debounce = setTimeout(() => fetchAddresses(e.target.value, 'destination'), 350);
    });
    document.getElementById('clearPickupBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        clearField('pickup');
    });
    document.getElementById('clearDestBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        clearField('destination');
    });
    document.getElementById('swapBtn').addEventListener('click', toggleSwap);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('gpsBtn').addEventListener('click', getCurrentLocation);
    document.getElementById('confirmBtn').addEventListener('click', () => {
        const totalSpan = document.getElementById('total-price');
        if (totalSpan.innerText !== 'RM 0' && State.pickup && State.destination) {
            alert(`✅ Booking confirmed! Total: ${totalSpan.innerText}\n🚗 Driver will arrive at pickup point.`);
        } else {
            alert("⚠️ Please select pickup and destination to see fare before booking.");
        }
    });
    // Click outside to hide autocomplete
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-wrapper')) {
            document.querySelectorAll('.results-list').forEach(l => l.style.display = 'none');
        }
    });
    timeInput.addEventListener('change', () => updateMapAndFare());
    dateInput.addEventListener('change', () => updateMapAndFare());
}

// Initialize all enhancements
setupHighlighting();
attachEventListeners();
window.addEventListener('load', () => setTimeout(() => map.invalidateSize(), 200));
</script>
</body>
</html>
