<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rideshare MY - Flat Access Logic</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />

    <style>
        :root { --primary: #059669; --dark: #111827; --wa: #25D366; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: #f9fafb; }
        #map { height: 400px; width: 100%; z-index: 1; }

        .ui-overlay {
            max-width: 480px; margin: -40px auto 40px; position: relative;
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); z-index: 100;
        }

        .price-tag { font-size: 2.5rem; font-weight: 900; margin: 5px 0; }
        .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .fee-item { color: var(--danger); font-weight: 600; }
        .btn-booking { background: var(--wa); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ui-overlay">
    <div id="price-container" style="display: none;">
        <div class="price-tag" id="total-fare">RM 0.00</div>
        <div class="data-row"><span>🛣️ Distance</span><b id="txt-dist">0.0 km</b></div>
        
        <!-- Surcharge Breakdown Area -->
        <div id="breakdown-area"></div>

        <button class="btn-booking" onclick="requestWhatsApp()">Confirm Booking</button>
    </div>
    
    <div id="initial-state" style="text-align:center; padding: 10px;">
        <p>📍 Tap map to set points. Fees apply once per zone.</p>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
// --- CONFIGURATION ---
const SPECIAL_ZONES = [
    {
        name: "KLCC Premium Zone",
        fee: 5.00,
        color: "#3b82f6",
        coords: [[3.155, 101.700], [3.160, 101.715], [3.145, 101.720], [3.135, 101.705]]
    },
    {
        name: "Airport Surcharge",
        fee: 12.00,
        color: "#f59e0b",
        coords: [[2.760, 101.690], [2.760, 101.720], [2.730, 101.720], [2.730, 101.690]]
    }
];

const FARE_CONFIG = { BASE: 5.00, RATE_KM: 1.25, MIN: 8.00 };

// --- MAP SETUP ---
let map = L.map('map', { zoomControl: false }).setView([3.1400, 101.7000], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

SPECIAL_ZONES.forEach(zone => {
    L.polygon(zone.coords, { color: zone.color, fillOpacity: 0.15 }).addTo(map)
     .bindPopup(`${zone.name}: RM ${zone.fee.toFixed(2)}`);
});

let routingControl = L.Routing.control({ waypoints: [], show: false }).addTo(map);

map.on('click', (e) => {
    let wps = routingControl.getWaypoints();
    if (!wps[0].latLng) routingControl.spliceWaypoints(0, 1, e.latlng);
    else if (!wps[1].latLng) routingControl.spliceWaypoints(1, 1, e.latlng);
});

routingControl.on('routesfound', (e) => {
    const route = e.routes[0];
    const wps = routingControl.getWaypoints();
    document.getElementById("initial-state").style.display = "none";
    document.getElementById("price-container").style.display = "block";
    
    calculateFlatFare(route.summary.totalDistance / 1000, wps[0].latLng, wps[1].latLng);
});

// --- CORE LOGIC ---

// Ray-Casting Point-in-Polygon Algorithm
function isInside(point, polygon) {
    let x = point.lat, y = point.lng;
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        let xi = polygon[i][0], yi = polygon[i][1];
        let xj = polygon[j][0], yj = polygon[j][1];
        let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
    }
    return inside;
}

function calculateFlatFare(km, start, end) {
    let totalSurcharge = 0;
    let appliedZones = [];

    SPECIAL_ZONES.forEach(zone => {
        const startInside = isInside(start, zone.coords);
        const endInside = isInside(end, zone.coords);

        // FLAT ACCESS LOGIC: If either is true, apply fee ONCE.
        if (startInside || endInside) {
            totalSurcharge += zone.fee;
            appliedZones.push(zone);
        }
    });

    const baseFare = FARE_CONFIG.BASE + (km * FARE_CONFIG.RATE_KM);
    const finalFare = Math.max(baseFare + totalSurcharge, FARE_CONFIG.MIN);

    // --- UI UPDATES ---
    document.getElementById("total-fare").innerText = `RM ${finalFare.toFixed(2)}`;
    document.getElementById("txt-dist").innerText = `${km.toFixed(2)} km`;
    
    const breakdown = document.getElementById("breakdown-area");
    breakdown.innerHTML = "";
    appliedZones.forEach(z => {
        breakdown.innerHTML += `
            <div class="data-row fee-item">
                <span>🚀 ${z.name}</span>
                <span>+ RM ${z.fee.toFixed(2)}</span>
            </div>`;
    });
}

function requestWhatsApp() {
    const fare = document.getElementById("total-fare").innerText;
    window.open(`https://wa.me/?text=${encodeURIComponent("Booking request for " + fare)}`);
}
</script>
</body>
</html>
