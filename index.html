<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.4.8 PRO</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --primary: #059669;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
        }

        body {
            font-family: -apple-system, sans-serif;
            margin: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .search-panel {
            background: var(--card-bg);
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 1005;
        }

        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--gray-text);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px 80px 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            background: #f9fafb;
        }

        .btn-container {
            position: absolute;
            right: 8px;
            top: 24px;
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: #9ca3af;
            font-size: 18px;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            z-index: 9999;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
            display: none;
        }

        .autocomplete-item {
            padding: 12px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
        }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .results-card {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            z-index: 1002;
            display: none;
        }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="input-group">
        <label>Pickup Location</label>
        <input type="text" id="pickup" placeholder="Search pickup..." autocomplete="off">
        <div class="btn-container">
            <button id="clear-p" class="icon-btn" style="display:none">✕</button>
            <button id="gps-btn" class="icon-btn">📍</button>
        </div>
        <div id="p-results" class="autocomplete-list"></div>
    </div>
    <div class="input-group">
        <label>Destination</label>
        <input type="text" id="dropoff" placeholder="Search destination..." autocomplete="off">
        <div class="btn-container">
            <button id="clear-d" class="icon-btn" style="display:none">✕</button>
        </div>
        <div id="d-results" class="autocomplete-list"></div>
    </div>
    <div class="input-group" style="margin-bottom:0;">
        <label>Travel Schedule</label>
        <input type="datetime-local" id="departure-time">
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="fare" style="margin:0; color:var(--primary); font-size:34px;">RM 0</h2>
        <span id="badge" style="font-size:11px; font-weight:700; padding:6px 12px; background:#f1f5f9; border-radius:20px;">Calculating...</span>
    </div>
    <p id="summary" style="font-size:12px; color:#4b5563; margin-top:10px; line-height:1.5;"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { 
        BASE: 3.00, 
        KM_STANDARD: 1.25, // Updated rate
        KM_CAP: 2.05,      // Price ceiling per KM
        MIDNIGHT: 25.00, 
        TERRAIN: 20.00 
    }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer;

// DEFAULT DATE: MAY 6, 2026
const defaultDate = new Date("2026-05-06T12:00:00");
$("departure-time").value = defaultDate.toISOString().slice(0,16);

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([4.2105, 101.9758], 7);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

function debounceSearch(input, resultsId, type) {
    const query = input.value;
    $(type === 'pickup' ? 'clear-p' : 'clear-d').style.display = query ? 'block' : 'none';
    clearTimeout(searchTimer);
    if (query.length < 3) { $(resultsId).style.display = 'none'; return; }

    searchTimer = setTimeout(async () => {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&countrycode=MY&limit=5`);
        const data = await res.json();
        renderResults(data.features, resultsId, type);
    }, 400);
}

function renderResults(features, resultsId, type) {
    const list = $(resultsId);
    list.innerHTML = features.map(f => `
        <div class="autocomplete-item" onclick="selectLoc('${type}', [${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], '${f.properties.name || 'Unknown'}')">
            <b>${f.properties.name || 'Unknown'}</b><br><small>${f.properties.city || ''}</small>
        </div>`).join('');
    list.style.display = 'block';
}

function selectLoc(type, coord, label) {
    if (type === 'pickup') { pickupCoord = coord; $("pickup").value = label; $("p-results").style.display = 'none'; }
    else { dropoffCoord = coord; $("dropoff").value = label; $("d-results").style.display = 'none'; }
    calculate();
}

async function calculate() {
    if (!pickupCoord || !dropoffCoord) return;
    
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        const km = route.summary.distance / 1000;
        
        // REFRESH RATES BASED ON SELECTED TIME
        const dateObj = new Date($("departure-time").value);
        const hour = dateObj.getHours();
        const mins = dateObj.getMinutes();
        const timeVal = hour + (mins/60);
        const locText = ($("pickup").value + $("dropoff").value).toLowerCase();

        // 1. MULTIPLIER LOGIC
        let peakMult = ((timeVal >= 6 && timeVal < 9) || (timeVal >= 12.5 && timeVal < 14.5) || (timeVal >= 17 && timeVal < 20)) ? 1.2 : 1.0;
        let interstateMult = km > 100 ? 1.5 : 1.0;
        
        // 2. CALCULATE DISTANCE RATE WITH CAP
        let dynamicRate = CONFIG.RATES.KM_STANDARD * peakMult * interstateMult;
        if (dynamicRate > CONFIG.RATES.KM_CAP) dynamicRate = CONFIG.RATES.KM_CAP;

        // 3. FLAT SURCHARGES
        let midnight = (timeVal >= 0 && timeVal < 6) ? CONFIG.RATES.MIDNIGHT : 0;
        let terrain = ["genting", "cameron", "fraser", "highland"].some(k => locText.includes(k)) ? CONFIG.RATES.TERRAIN : 0;
        
        let total = CONFIG.RATES.BASE + (km * dynamicRate) + midnight + terrain;
        
        // 4. UI UPDATES
        $("fare").innerText = `RM ${Math.round(total)}`;
        $("badge").innerText = km > 100 ? "Interstate" : (midnight ? "Midnight" : (peakMult > 1 ? "Peak Hour" : "Standard"));
        
        let capNotice = dynamicRate >= CONFIG.RATES.KM_CAP ? " <b style='color:red'>(CAPPED)</b>" : "";
        $("summary").innerHTML = `📏 ${km.toFixed(1)} km | ⏱️ ${Math.ceil(route.summary.duration/60)} min<br>
            Rate: RM ${dynamicRate.toFixed(2)}/km${capNotice} | Add-ons: RM ${(midnight + terrain).toFixed(2)}`;
        
        $("results").style.display = 'block';

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 5}).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding: [50,50]});
        
    } catch (err) {
        console.error("Calculation Error:", err);
    }
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

$("pickup").oninput = e => debounceSearch(e.target, "p-results", "pickup");
$("dropoff").oninput = e => debounceSearch(e.target, "d-results", "dropoff");
$("departure-time").onchange = () => calculate();

$("gps-btn").onclick = () => {
    navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        const res = await fetch(`https://photon.komoot.io/reverse?lon=${lon}&lat=${lat}`);
        const data = await res.json();
        const name = data.features[0]?.properties.name || "My Location";
        selectLoc('pickup', [lat, lon], name);
    });
};

$("clear-p").onclick = () => { $("pickup").value = ''; $("p-results").style.display = 'none'; $("clear-p").style.display = 'none'; };
$("clear-d").onclick = () => { $("dropoff").value = ''; $("d-results").style.display = 'none'; $("clear-d").style.display = 'none'; };
</script>
</body>
</html>
