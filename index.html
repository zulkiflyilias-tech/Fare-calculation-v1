<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rideshare MY Pro - Fare Estimator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f8f9fa;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    color:#212529;
}

#container{
    display:flex;
    flex-direction:column;
    height:100%;
    position:relative;
}

#map{
    height:33vh;
    width:100%;
    z-index:1;
}

#search-panel{
    flex:1;
    background:#fff;
    padding:16px 16px 32px;
    box-shadow:0 -4px 20px rgba(0,0,0,.08);
    z-index:10;
    border-top-left-radius:16px;
    border-top-right-radius:16px;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

.routing-wrapper{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:8px;
    margin-top:8px;
}

.input-container{
    position:relative;
    display:flex;
    align-items:center;
}

input{
    width:100%;
    padding:12px 64px 12px 12px;
    border:1px solid #e0e0e0;
    border-radius:8px;
    font-size:14px;
    background:#f9f9f9;
    transition:.2s;
}

#pickup{padding-right:88px}

input:focus{
    outline:none;
    border-color:#8e24aa;
    background:#fff;
    box-shadow:0 0 0 2px rgba(142,36,170,.1);
}

.action-group{
    position:absolute;
    right:8px;
    display:flex;
    align-items:center;
    gap:6px;
    z-index:5;
}

.icon-btn{
    border:none;
    background:none;
    color:#757575;
    font-size:14px;
    cursor:pointer;
    padding:6px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s;
}

.icon-btn:hover{
    background:#f0f0f0;
    color:#8e24aa;
}

.clear-btn{
    display:none;
    font-size:18px;
    color:#aaa;
}

.swap-container{
    position:absolute;
    right:48px;
    top:50%;
    transform:translateY(-50%);
    z-index:15;
}

.swap-btn{
    background:#fff;
    border:1px solid #e0e0e0;
    color:#8e24aa;
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    font-size:14px;
}

.suggestions{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:#fff;
    border:1px solid #e0e0e0;
    border-radius:8px;
    max-height:180px;
    overflow-y:auto;
    z-index:1000;
    box-shadow:0 6px 16px rgba(0,0,0,.1);
    display:none;
}

.suggestion-item{
    padding:12px;
    cursor:pointer;
    font-size:13px;
    border-bottom:1px solid #f5f5f5;
}

.suggestion-item:hover{
    background:#f5f5f5;
}

#result-card{
    background:#1c1c1e;
    color:#fff;
    padding:16px;
    border-radius:12px;
    margin-top:8px;
    margin-bottom:16px;
    display:none;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
}

.fare-header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.fare-header{
    font-size:42px;
    font-weight:900;
    color:#39ff14;
    line-height:1;
    text-shadow:0 0 10px rgba(57,255,20,.3);
}

.meta-distance,
.meta-duration{
    font-weight:700;
}

.meta-distance{
    font-size:16px;
    color:#fff;
}

.meta-duration{
    font-size:14px;
    color:#aeaeb2;
}

#invoice-details{
    margin-top:12px;
    border-top:1px dashed #3a3a3c;
    padding-top:12px;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    color:#aeaeb2;
    margin-bottom:8px;
}

.detail-row.total-bold{
    color:#fff;
    font-weight:600;
    border-top:1px solid #2c2c2e;
    padding-top:10px;
    font-size:16px;
}

#error-msg{
    color:#ff3b30;
    font-size:13px;
    margin-top:8px;
    display:none;
    font-weight:500;
}

/* Loading spinner for GPS */
.loc-spinner{
    display:none;
    width:14px;
    height:14px;
    border:2px solid #ddd;
    border-top-color:#8e24aa;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(min-width:768px){
    #container{
        flex-direction:row-reverse;
    }

    #map{
        height:100%;
        flex:1;
    }

    #search-panel{
        width:420px;
        height:100%;
        border-radius:0;
        padding:24px 20px;
    }

    .fare-header{
        font-size:48px;
    }
}
</style>
</head>

<body>

<div id="container">

    <div id="map"></div>

    <div id="search-panel">

        <div class="routing-wrapper">

            <!-- PICKUP -->
            <div class="input-container">
                <input type="text" id="pickup" placeholder="Pickup location..." autocomplete="off">

                <div class="action-group">
                    <!-- GPS icon via inline SVG -->
                    <button class="icon-btn" id="current-loc-btn" title="Use current location">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
                            <circle cx="12" cy="12" r="8" stroke-dasharray="2 2"/>
                        </svg>
                    </button>
                    <div class="loc-spinner" id="loc-spinner"></div>
                    <button class="icon-btn clear-btn" id="clear-pickup">&times;</button>
                </div>

                <div id="pickup-suggestions" class="suggestions"></div>
            </div>

            <!-- SWAP -->
            <div class="swap-container">
                <button class="swap-btn" id="swap-locations-btn" title="Swap pickup and drop-off">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 16V4m0 0L3 8m4-4 4 4"/>
                        <path d="M17 8v12m0 0 4-4m-4 4-4-4"/>
                    </svg>
                </button>
            </div>

            <!-- DROPOFF -->
            <div class="input-container">
                <input type="text" id="dropoff" placeholder="Drop-off location..." autocomplete="off">

                <div class="action-group">
                    <button class="icon-btn clear-btn" id="clear-dropoff">&times;</button>
                </div>

                <div id="dropoff-suggestions" class="suggestions"></div>
            </div>

        </div>

        <div id="error-msg"></div>

        <div id="result-card">

            <div class="fare-header-row">
                <div class="fare-left-col">
                    <div id="total-fare" class="fare-header">RM --</div>
                </div>
                <div class="fare-right-col" style="text-align:right;">
                    <div id="fare-distance" class="meta-distance">0 km</div>
                    <div id="fare-duration" class="meta-duration">0 mins</div>
                </div>
            </div>

            <div id="invoice-details">

                <div class="detail-row">
                    <span>Base Fare</span>
                    <span id="calc-base-fare">RM 5.00</span>
                </div>

                <div class="detail-row">
                    <span>Distance Fare</span>
                    <span id="calc-ride-distance-rate">RM 0.00</span>
                </div>

                <div class="detail-row">
                    <span>Traffic &amp; Incentive</span>
                    <span id="calc-incentive">RM 0.00</span>
                </div>

                <div class="detail-row">
                    <span>Out-of-Zone Surcharge</span>
                    <span id="calc-deadhead-km">RM 0.00</span>
                </div>

                <div class="detail-row total-bold">
                    <span>Rounded Final Total</span>
                    <span id="calc-grand" style="color:#39ff14;">RM 0.00</span>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ==========================================================
// MAP INIT
// ==========================================================

const map = L.map('map').setView([3.1390, 101.6869], 11);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution: '&copy; OpenStreetMap contributors' }
).addTo(map);

const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=";

// ==========================================================
// GLOBALS
// ==========================================================

let pickupMarker    = null;
let dropoffMarker   = null;
let routeLine       = null;
let pickupCoords    = null;
let dropoffCoords   = null;
let currentRouteTimeout = null;

// ==========================================================
// REVERSE GEOCODING  (Nominatim)
// ==========================================================

async function reverseGeocode(lat, lon) {
    try {
        const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=jsonv2&addressdetails=1&accept-language=en`;
        const res  = await fetch(url, {
            headers: { 'Accept-Language': 'en' }
        });
        const data = await res.json();

        if (!data || data.error) return null;

        const a = data.address || {};

        // Build a short human-readable label (most specific parts first)
        const parts = [
            a.amenity || a.building || a.house_name,
            a.road || a.pedestrian || a.footway,
            a.suburb || a.neighbourhood || a.quarter,
            a.city || a.town || a.village || a.municipality,
            a.state
        ].filter(Boolean);

        return parts.length ? parts.join(', ') : data.display_name;
    } catch (e) {
        return null;
    }
}

// ==========================================================
// AUTOCOMPLETE  (Photon / Komoot)
// ==========================================================

function setupAutocomplete(inputId, suggestionsId, clearBtnId, onSelect, onClear) {
    const input          = document.getElementById(inputId);
    const suggestionsBox = document.getElementById(suggestionsId);
    const clearBtn       = document.getElementById(clearBtnId);
    let debounce;

    input.addEventListener('input', () => {
        clearTimeout(debounce);
        const query = input.value.trim();
        clearBtn.style.display = query.length ? 'block' : 'none';

        if (query.length < 3) {
            suggestionsBox.style.display = 'none';
            return;
        }

        debounce = setTimeout(() => {
            fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=99.6,0.8,119.5,7.4&limit=5`)
                .then(r => r.json())
                .then(data => {
                    suggestionsBox.innerHTML = '';
                    if (!data.features?.length) {
                        suggestionsBox.style.display = 'none';
                        return;
                    }
                    suggestionsBox.style.display = 'block';
                    data.features.forEach(f => {
                        const props = f.properties;
                        const addr  = [props.name, props.street, props.city, props.state]
                                        .filter(Boolean).join(', ');
                        const div   = document.createElement('div');
                        div.className   = 'suggestion-item';
                        div.textContent = addr || props.name;
                        div.addEventListener('click', () => {
                            input.value = addr || props.name;
                            suggestionsBox.style.display = 'none';
                            const [lon, lat] = f.geometry.coordinates;
                            onSelect({ lat, lon });
                        });
                        suggestionsBox.appendChild(div);
                    });
                })
                .catch(() => {
                    suggestionsBox.style.display = 'none';
                });
        }, 350);
    });

    clearBtn.addEventListener('click', () => {
        input.value = '';
        clearBtn.style.display = 'none';
        suggestionsBox.style.display = 'none';
        onClear();
    });
}

// ==========================================================
// INIT AUTOCOMPLETE
// ==========================================================

setupAutocomplete(
    'pickup', 'pickup-suggestions', 'clear-pickup',
    (c) => {
        pickupCoords = c;
        updateMarker('pickup', c);
        checkAndProcessRoute();
    },
    () => {
        pickupCoords = null;
        if (pickupMarker) map.removeLayer(pickupMarker);
        resetCalc();
    }
);

setupAutocomplete(
    'dropoff', 'dropoff-suggestions', 'clear-dropoff',
    (c) => {
        dropoffCoords = c;
        updateMarker('dropoff', c);
        checkAndProcessRoute();
    },
    () => {
        dropoffCoords = null;
        if (dropoffMarker) map.removeLayer(dropoffMarker);
        resetCalc();
    }
);

// ==========================================================
// SWAP
// ==========================================================

document.getElementById('swap-locations-btn').addEventListener('click', () => {
    const tempText  = document.getElementById('pickup').value;
    const tempCoord = pickupCoords;

    document.getElementById('pickup').value  = document.getElementById('dropoff').value;
    pickupCoords  = dropoffCoords;

    document.getElementById('dropoff').value = tempText;
    dropoffCoords = tempCoord;

    // Sync clear-button visibility
    document.getElementById('clear-pickup').style.display  = document.getElementById('pickup').value.length  ? 'block' : 'none';
    document.getElementById('clear-dropoff').style.display = document.getElementById('dropoff').value.length ? 'block' : 'none';

    if (pickupCoords)  updateMarker('pickup',  pickupCoords);
    if (dropoffCoords) updateMarker('dropoff', dropoffCoords);
    if (pickupCoords && dropoffCoords) checkAndProcessRoute();
});

// ==========================================================
// CURRENT LOCATION  (with reverse geocoding)
// ==========================================================

document.getElementById('current-loc-btn').addEventListener('click', () => {
    if (!navigator.geolocation) {
        showError('Geolocation is not supported by this browser.');
        return;
    }

    const spinner   = document.getElementById('loc-spinner');
    const locBtn    = document.getElementById('current-loc-btn');
    const pickupInput = document.getElementById('pickup');

    // Show spinner, hide button icon
    spinner.style.display  = 'block';
    locBtn.style.display   = 'none';
    pickupInput.value      = 'Locating...';
    pickupInput.disabled   = true;

    navigator.geolocation.getCurrentPosition(
        async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            pickupCoords = { lat, lon };

            updateMarker('pickup', pickupCoords);
            map.setView([lat, lon], 14);

            // Reverse geocode to get a real address
            const address = await reverseGeocode(lat, lon);
            pickupInput.value = address || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            document.getElementById('clear-pickup').style.display = 'block';

            // Restore UI
            spinner.style.display = 'none';
            locBtn.style.display  = 'flex';
            pickupInput.disabled  = false;

            checkAndProcessRoute();
        },
        (err) => {
            spinner.style.display = 'none';
            locBtn.style.display  = 'flex';
            pickupInput.disabled  = false;
            pickupInput.value     = '';
            showError('Could not get your location. Please check permissions.');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
});

// ==========================================================
// MARKERS
// ==========================================================

function updateMarker(type, coords) {
    if (type === 'pickup') {
        if (pickupMarker) map.removeLayer(pickupMarker);
        pickupMarker = L.marker([coords.lat, coords.lon]).addTo(map);
    } else {
        if (dropoffMarker) map.removeLayer(dropoffMarker);
        dropoffMarker = L.marker([coords.lat, coords.lon]).addTo(map);
    }
}

// ==========================================================
// ERROR
// ==========================================================

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// ==========================================================
// RESET
// ==========================================================

function resetCalc() {
    if (routeLine) map.removeLayer(routeLine);
    document.getElementById('result-card').style.display = 'none';
}

// ==========================================================
// ROUTING
// ==========================================================

function checkAndProcessRoute() {
    if (!pickupCoords || !dropoffCoords) return;

    if (currentRouteTimeout) clearTimeout(currentRouteTimeout);

    currentRouteTimeout = setTimeout(() => {
        const url =
            `https://api.openrouteservice.org/v2/directions/driving-car` +
            `?api_key=${ORS_API_KEY}` +
            `&start=${pickupCoords.lon},${pickupCoords.lat}` +
            `&end=${dropoffCoords.lon},${dropoffCoords.lat}`;

        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error(`ORS error: ${res.status}`);
                return res.json();
            })
            .then(data => {
                if (!data.features || !data.features.length) {
                    showError('No route found between the selected locations.');
                    return;
                }

                const feat        = data.features[0];
                const distanceKm  = feat.properties.summary.distance / 1000;
                const durationMin = feat.properties.summary.duration / 60;

                if (routeLine) map.removeLayer(routeLine);

                routeLine = L.geoJSON(feat.geometry, {
                    style: { color: '#8e24aa', weight: 5 }
                }).addTo(map);

                map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });

                computeFareAndDisplay(distanceKm, durationMin);
            })
            .catch(err => {
                showError('Route calculation failed. Please try again.');
                console.error(err);
            });
    }, 350);
}

// ==========================================================
// FARE ENGINE
// ==========================================================

function computeFareAndDisplay(distance, durationMins) {
    const baseFare      = 5.0;
    const perKmRate     = 1.25;
    const chargeable    = Math.max(0, distance - 1);
    const distanceFare  = chargeable * perKmRate;
    const incentive     = (durationMins / 60) * 12;

    let deadhead = 0;
    if (distance > 12) {
        const scale = ((Math.min(distance, 350) - 12) / 338) * 0.45;
        deadhead = distanceFare * scale;
    }

    const rawTotal     = baseFare + distanceFare + incentive + deadhead;
    const roundedTotal = Math.round(rawTotal * 10) / 10;
    const finalRound   = Math.round(roundedTotal);

    // UI update
    document.getElementById('result-card').style.display           = 'block';
    document.getElementById('total-fare').textContent              = `RM ${finalRound}`;
    document.getElementById('fare-distance').textContent           = `${distance.toFixed(1)} km`;
    document.getElementById('fare-duration').textContent           =
        durationMins < 60
        ? `${Math.round(durationMins)} mins`
        : `${Math.floor(durationMins / 60)}h ${Math.round(durationMins % 60)}m`;

    document.getElementById('calc-base-fare').textContent          = `RM ${baseFare.toFixed(2)}`;
    document.getElementById('calc-ride-distance-rate').textContent = `RM ${distanceFare.toFixed(2)}`;
    document.getElementById('calc-incentive').textContent          = `RM ${incentive.toFixed(2)}`;
    document.getElementById('calc-deadhead-km').textContent        = `RM ${deadhead.toFixed(2)}`;
    document.getElementById('calc-grand').textContent              = `RM ${roundedTotal.toFixed(2)}`;
}

</script>
</body>
</html>
