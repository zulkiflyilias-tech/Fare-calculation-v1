<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - Direct Nav v4.4</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --whatsapp: #25D366;
            --copy: #6b7280;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        .search-panel {
            background: var(--card-bg); padding: 16px; border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1001;
        }

        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label {
            display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px;
            color: var(--gray-text); text-transform: uppercase; letter-spacing: 0.05em;
        }

        input {
            width: 100%; padding: 12px 90px 12px 14px; border: 1.5px solid #e5e7eb;
            border-radius: 12px; font-size: 14px; outline: none; background: #f9fafb;
        }

        input:focus { border-color: var(--primary); background: white; }

        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 4px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; }

        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; background: white;
            z-index: 2000; max-height: 280px; overflow-y: auto; display: none;
            border-radius: 0 0 12px 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .autocomplete-item { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
        .loc-name { font-weight: 700; font-size: 14px; display: block; color: #111; }
        .loc-addr { font-size: 11px; color: var(--gray-text); }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .swap-container { position: absolute; right: 24px; top: 76px; z-index: 1005; }
        .swap-btn {
            background: white; border: 1px solid #e5e7eb; border-radius: 50%;
            width: 36px; height: 36px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; color: var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .results-card {
            position: fixed; bottom: 24px; left: 16px; right: 16px; background: white;
            padding: 20px; border-radius: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            z-index: 1002; display: none;
        }

        #fare { font-size: 32px; font-weight: 800; color: var(--primary); margin: 0; }
        .sub-fare { font-size: 13px; color: var(--gray-text); margin-bottom: 8px; }
        .mode-badge { background:#ecfdf5; color:var(--primary); padding:6px 12px; border-radius:30px; font-size:11px; font-weight:700; }

        .fee-toggle { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 13px; background: #f9fafb; padding: 8px 12px; border-radius: 10px; border: 1px solid #e5e7eb; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn { padding: 12px 4px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: 700; font-size: 12px; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-wa { background: var(--whatsapp); }
        .btn-nav { background: #3b82f6; }
        .btn-copy { background: var(--copy); }
        #loading-state { text-align: center; padding: 20px; color: var(--primary); }
    </style>
</head>
<body>

    <div class="search-panel">
        <div class="input-group">
            <label>Pickup Location</label>
            <input type="text" id="pickup" placeholder="Search for pickup..." autocomplete="off">
            <div class="btn-container">
                <button class="icon-btn" id="clear-pickup" style="display:none">✕</button>
                <button class="icon-btn" id="gps-trigger">📍</button>
            </div>
            <div id="pickup-results" class="autocomplete-list"></div>
        </div>

        <div class="swap-container">
            <button class="swap-btn" id="swap-btn">⇅</button>
        </div>

        <div class="input-group">
            <label>Destination</label>
            <input type="text" id="dropoff" placeholder="Search for destination..." autocomplete="off">
            <div class="btn-container"><button class="icon-btn" id="clear-dropoff" style="display:none">✕</button></div>
            <div id="dropoff-results" class="autocomplete-list"></div>
        </div>

        <div class="input-group" style="margin-bottom: 0;">
            <label>Travel Schedule</label>
            <input type="datetime-local" id="departure-time">
        </div>
    </div>

    <div id="map"></div>

    <div id="results" class="results-card">
        <div id="loading-state">Calculating route...</div>
        <div id="fare-content" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div><h2 id="fare">RM 0</h2><div id="base-fare-display" class="sub-fare"></div></div>
                <span id="mode-badge" class="mode-badge"></span>
            </div>
            <div class="fee-toggle">
                <input type="checkbox" id="include-fee" checked style="width: auto;">
                <label for="include-fee">Include 20% Fee in Message</label>
            </div>
            <div style="margin: 10px 0; font-size:14px; color:#4b5563;">
                📏 <b id="distance">0 km</b> | ⏱️ <b id="eta">0 min</b>
            </div>
            <div class="btn-group">
                <a id="wa-btn" class="btn btn-wa" target="_blank">WhatsApp</a>
                <button id="copy-btn" class="btn btn-copy">Copy Text</button>
                <a id="nav-btn" class="btn btn-nav">Directions</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const CONFIG = {
            WHATSAPP: "60108988182",
            ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
            CENTER: [3.139, 101.686],
            BBOX: "99.5,1.2,103.6,6.8"
        };

        const $ = id => document.getElementById(id);
        let pickupCoord, dropoffCoord, routeLayer, pickupMarker, dropoffMarker, searchTimer;
        let fareData = { base: 0, total: 0, km: 0, time: 0, mode: "" };

        const map = L.map("map", { zoomControl: false, attributionControl: false }).setView(CONFIG.CENTER, 13);
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        $("departure-time").value = now.toISOString().slice(0,16);

        async function searchPlaces(query, resultId, type) {
            $(`clear-${type}`).style.display = query.length > 0 ? 'flex' : 'none';
            clearTimeout(searchTimer);
            if (query.length < 3) { $(resultId).style.display = 'none'; return; }
            searchTimer = setTimeout(async () => {
                const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=${CONFIG.BBOX}&limit=6`);
                const data = await res.json();
                renderResults(data.features, resultId, type);
            }, 400);
        }

        function renderResults(features, resultId, type) {
            const list = $(resultId);
            list.innerHTML = features.map(f => {
                const p = f.properties;
                const fullStr = `${p.name || 'Unknown'}, ${[p.street, p.city].filter(Boolean).join(', ')}`.replace(/'/g, "\\'");
                return `<div class="autocomplete-item" onclick="selectLoc('${type}', [${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], '${fullStr}')">
                    <span class="loc-name">${p.name || 'Unknown'}</span>
                    <span class="loc-addr">${p.city || 'Malaysia'}</span>
                </div>`;
            }).join('');
            list.style.display = features.length ? 'block' : 'none';
        }

        function selectLoc(type, coord, label) {
            $(type).value = label;
            $(`${type}-results`).style.display = 'none';
            if (type === 'pickup') {
                if (pickupMarker) map.removeLayer(pickupMarker);
                pickupCoord = coord;
                pickupMarker = L.circleMarker(coord, {color: '#3b82f6', radius: 8}).addTo(map);
            } else {
                if (dropoffMarker) map.removeLayer(dropoffMarker);
                dropoffCoord = coord;
                dropoffMarker = L.circleMarker(coord, {color: '#ef4444', radius: 8}).addTo(map);
            }
            if (pickupCoord && dropoffCoord) calculate();
        }

        async function calculate() {
            $("results").style.display = 'block';
            $("fare-content").style.display = 'none';
            $("loading-state").style.display = 'block';

            try {
                const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
                    body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
                });
                const data = await res.json();
                const route = data.routes[0];
                if (routeLayer) map.removeLayer(routeLayer);
                routeLayer = L.polyline(decodePoly(route.geometry), { color: '#059669', weight: 6 }).addTo(map);
                map.fitBounds(routeLayer.getBounds(), { padding: [80, 80] });

                const km = route.summary.distance / 1000;
                const h = new Date($("departure-time").value).getHours();
                const isRush = (h >= 7 && h <= 9) || (h >= 17 && h <= 20);
                const isMid = (h >= 0 && h < 6);

                let subtotal = 3.00 + (km > 1 ? (km-1)*1.25 : 0) + (route.summary.duration/36*0.25);
                if (isMid) subtotal *= 1.5;

                fareData = { base: Math.round(subtotal), total: Math.round(subtotal*1.2), km: km.toFixed(1), time: Math.ceil(route.summary.duration/60), mode: isMid ? "Midnight" : (isRush ? "Rush Hour" : "Standard") };
                updateUI();
                $("loading-state").style.display = 'none';
                $("fare-content").style.display = 'block';
            } catch (e) { $("loading-state").innerText = "Error calculating route."; }
        }

        function updateUI() {
            const useFull = $("include-fee").checked;
            const fare = useFull ? fareData.total : fareData.base;
            $("fare").innerText = `RM ${fare}`;
            $("base-fare-display").innerText = `Base: RM ${fareData.base} | Inc. 20%: RM ${fareData.total}`;
            $("distance").innerText = `${fareData.km} km`;
            $("eta").innerText = `${fareData.time} min`;
            $("mode-badge").innerText = fareData.mode;

            const msg = `*eHailing Booking*\nFrom: ${$("pickup").value}\nTo: ${$("dropoff").value}\nFare: RM ${fare}`;
            $("wa-btn").href = `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`;
            
            // DIRECT APP LAUNCH LOGIC
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const lat = dropoffCoord[0], lng = dropoffCoord[1];
            $("nav-btn").href = isIOS ? `comgooglemaps://?daddr=${lat},${lng}&directionsmode=driving` : `google.navigation:q=${lat},${lng}&mode=d`;
            
            window.lastSummaryText = msg;
        }

        function decodePoly(str) {
            let index = 0, lat = 0, lng = 0, coordinates = [];
            while (index < str.length) {
                let b, shift = 0, result = 0;
                do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lat += (result & 1) ? ~(result >> 1) : (result >> 1);
                shift = 0; result = 0;
                do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lng += (result & 1) ? ~(result >> 1) : (result >> 1);
                coordinates.push([lat / 1e5, lng / 1e5]);
            }
            return coordinates;
        }

        $("pickup").oninput = e => searchPlaces(e.target.value, "pickup-results", "pickup");
        $("dropoff").oninput = e => searchPlaces(e.target.value, "dropoff-results", "dropoff");
        $("clear-pickup").onclick = () => { $("pickup").value = ""; $("clear-pickup").style.display = "none"; };
        $("clear-dropoff").onclick = () => { $("dropoff").value = ""; $("clear-dropoff").style.display = "none"; };
        $("gps-trigger").onclick = () => {
            navigator.geolocation.getCurrentPosition(p => selectLoc('pickup', [p.coords.latitude, p.coords.longitude], "Current Location"));
        };
        $("copy-btn").onclick = () => {
            navigator.clipboard.writeText(window.lastSummaryText).then(() => {
                $("copy-btn").innerText = "Copied!";
                setTimeout(() => $("copy-btn").innerText = "Copy Text", 2000);
            });
        };
    </script>
</body>
</html>
