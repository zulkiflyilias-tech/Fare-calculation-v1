<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v6.8.0 PRO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --gray-text: #6b7280; --accent: #f59e0b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .search-panel { background: var(--card-bg); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1005; }
        .inputs-container { display: flex; align-items: center; gap: 12px; }
        .inputs-flex { flex: 1; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gray-text); text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #f9fafb; transition: 0.2s; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }
        
        #pickup, #dropoff { padding-right: 85px; }
        .swap-btn { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; }
        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 4px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: #9ca3af; font-size: 18px; }
        
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 10000; max-height: 280px; overflow-y: auto; border-radius: 0 0 16px 16px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); display: none; margin-top: 4px; border: 1px solid #eee; }
        .autocomplete-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9fafb; }
        .autocomplete-item.venue-hotspot { background: #ecfdf5; border-left: 4px solid var(--primary); }
        .loc-icon { background: #f3f4f6; color: #6b7280; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .loc-name { font-weight: 600; font-size: 14px; color: var(--text); }
        .loc-address { font-size: 11px; color: var(--gray-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #map { flex-grow: 1; width: 100%; z-index: 1; cursor: crosshair; }
        .results-card { position: fixed; bottom: 20px; left: 16px; right: 16px; background: white; padding: 20px; border-radius: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 1002; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateY(150%); opacity: 0; pointer-events: none; }
        .results-card.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .action-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { border: none; border-radius: 12px; padding: 10px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-transform: uppercase; }
        .btn-whatsapp { background: #25D366; color: white; }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="inputs-container">
        <div class="inputs-flex">
            <div class="input-group">
                <label>Pickup</label>
                <input type="text" id="pickup" placeholder="Set pickup..." autocomplete="off">
                <div class="btn-container">
                    <button id="clear-p" class="icon-btn" style="display:none">✕</button>
                    <button id="gps-btn" class="icon-btn">📍</button>
                </div>
                <div id="p-results" class="autocomplete-list"></div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>Destination (SCM Entrances available)</label>
                <input type="text" id="dropoff" placeholder="Where to?" autocomplete="off">
                <div class="btn-container">
                    <button id="clear-d" class="icon-btn" style="display:none">✕</button>
                </div>
                <div id="d-results" class="autocomplete-list"></div>
            </div>
        </div>
        <button id="swap-btn" class="swap-btn">⇅</button>
    </div>
    <div class="input-group" style="margin-top: 12px; margin-bottom:0;">
        <label>Travel Schedule</label>
        <input type="datetime-local" id="departure-time">
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div class="fare-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
            <h2 id="fare" style="margin:0; color:var(--primary); font-size:32px;">RM 0</h2>
            <div style="font-size: 9px; color: #9ca3af; text-transform: uppercase;">Estimated Fare</div>
        </div>
        <span id="badge" style="font-size:10px; font-weight:800; padding:4px 10px; background:#f1f5f9; border-radius:20px;">STANDARD</span>
    </div>
    <p id="summary" style="font-size:12px; color:#4b5563; margin-top:8px;"></p>
    <div class="action-bar">
        <button class="action-btn btn-whatsapp" id="btn-whatsapp"><span>💬</span> WhatsApp</button>
        <button class="action-btn" id="btn-copy" style="background:#f1f5f9;"><span>📋</span> Copy</button>
        <button class="action-btn" id="btn-maps" style="background:#4285F4; color:white;"><span>🗺️</span> Maps</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { BASE: 5.0, KM_TIER_1: 1.25, TIME_RATE: 0.20 },
    HOTSPOTS: [
        { name: "SCM - Main Entrance (Lobby A)", lat: 3.1095, lon: 101.4602, keywords: ["scm", "setia city", "main"] },
        { name: "SCM - Park Entrance (Lobby B)", lat: 3.1085, lon: 101.4590, keywords: ["scm", "setia city", "park"] },
        { name: "SCM - North Entrance (Lobby C)", lat: 3.1110, lon: 101.4585, keywords: ["scm", "setia city", "north"] },
        { name: "SCM - AEON Entrance", lat: 3.1105, lon: 101.4580, keywords: ["scm", "aeon"] }
    ]
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer, pickupMarker, dropoffMarker;

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([3.1478, 101.6953], 12);

// GOOGLE MAPS TILE LAYER
L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3']
}).addTo(map);

// AUTO-ZOOM SELECTION LOGIC
function selectLoc(type, coord, label) {
    if (type === 'pickup') {
        pickupCoord = coord;
        $("pickup").value = label;
        $("p-results").style.display = 'none';
        updateMarker('pickup', coord[0], coord[1]);
    } else {
        dropoffCoord = coord;
        $("dropoff").value = label;
        $("d-results").style.display = 'none';
        updateMarker('dropoff', coord[0], coord[1]);

        // CRITICAL FIX: Fly-to animation for destination
        setTimeout(() => {
            map.flyTo(coord, 18, { animate: true, duration: 1.5 });
        }, 100);
    }
}

function updateMarker(type, lat, lng) {
    if (type === 'pickup') {
        if (pickupMarker) map.removeLayer(pickupMarker);
        pickupMarker = L.circleMarker([lat, lng], { radius: 8, color: '#059669', fillOpacity: 1 }).addTo(map);
    } else {
        if (dropoffMarker) map.removeLayer(dropoffMarker);
        dropoffMarker = L.circleMarker([lat, lng], { radius: 8, color: '#ef4444', fillOpacity: 1 }).addTo(map);
    }
    if (pickupCoord && dropoffCoord) calculate();
}

async function searchNominatim(query, resultsId, type) {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=my&limit=10&addressdetails=1`);
        const data = await res.json();
        const qLower = query.toLowerCase();
        const manualMatches = CONFIG.HOTSPOTS.filter(h => h.keywords.some(k => qLower.includes(k)));
        
        let html = '';
        manualMatches.forEach(h => {
            html += `<div class="autocomplete-item venue-hotspot" onclick="selectLoc('${type}', [${h.lat}, ${h.lon}], '${h.name}')">
                <div class="loc-icon">🏢</div><div><div class="loc-name">${h.name}</div><div class="loc-address">Verified Entry</div></div>
            </div>`;
        });
        data.forEach(r => {
            html += `<div class="autocomplete-item" onclick="selectLoc('${type}', [${r.lat}, ${r.lon}], '${r.display_name}')">
                <div class="loc-icon">📍</div><div><div class="loc-name">${r.display_name.split(',')[0]}</div><div class="loc-address">${r.display_name}</div></div>
            </div>`;
        });
        $(resultsId).innerHTML = html;
        $(resultsId).style.display = html ? 'block' : 'none';
    } catch (e) { console.error(e); }
}

async function calculate() {
    const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
        body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
    });
    const data = await res.json();
    const route = data.routes[0];
    const km = route.summary.distance / 1000;
    const dur = Math.ceil(route.summary.duration / 60);
    const fare = Math.round(CONFIG.RATES.BASE + (km * CONFIG.RATES.KM_TIER_1) + (dur * CONFIG.RATES.TIME_RATE));

    $("fare").innerText = `RM ${fare}`;
    $("summary").innerHTML = `<b>${km.toFixed(1)} km</b> • <b>${dur} min</b>`;
    $("results").classList.add('visible');
    
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 5}).addTo(map);
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

$("pickup").oninput = e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => searchNominatim(e.target.value, "p-results", "pickup"), 400); };
$("dropoff").oninput = e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => searchNominatim(e.target.value, "d-results", "dropoff"), 400); };
</script>
</body>
</html>
