<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.5.0 PRO</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --primary: #059669;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .search-panel {
            background: var(--card-bg);
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 1005;
        }

        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--gray-text);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px 80px 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            background: #f9fafb;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-container {
            position: absolute;
            right: 8px;
            top: 24px;
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: #9ca3af;
            font-size: 18px;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            z-index: 9999;
            max-height: 250px;
            overflow-y: auto;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
            display: none;
        }

        .autocomplete-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
        }

        .autocomplete-item:hover {
            background: #f9fafb;
        }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .results-card {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            z-index: 1002;
            display: none;
        }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="input-group">
        <label>Pickup Location</label>
        <input type="text" id="pickup" placeholder="Search pickup..." autocomplete="off">
        <div class="btn-container">
            <button id="clear-p" class="icon-btn" style="display:none">✕</button>
            <button id="gps-btn" class="icon-btn">📍</button>
        </div>
        <div id="p-results" class="autocomplete-list"></div>
    </div>
    <div class="input-group">
        <label>Destination</label>
        <input type="text" id="dropoff" placeholder="Search destination..." autocomplete="off">
        <div class="btn-container">
            <button id="clear-d" class="icon-btn" style="display:none">✕</button>
        </div>
        <div id="d-results" class="autocomplete-list"></div>
    </div>
    <div class="input-group" style="margin-bottom:0;">
        <label>Departure Time</label>
        <input type="datetime-local" id="departure-time">
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="fare" style="margin:0; color:var(--primary); font-size:34px;">RM 0</h2>
        <span id="badge" style="font-size:11px; font-weight:700; padding:6px 12px; background:#f1f5f9; border-radius:20px;">Standard</span>
    </div>
    <p id="summary" style="font-size:12px; color:#4b5563; margin-top:10px; line-height:1.6;"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const CONFIG = {
    // OpenRouteService Key
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { 
        BASE: 5.00,             // Updated to RM 5.00
        KM_STANDARD: 1.25, 
        KM_CAP: 2.05,      
        MIDNIGHT_MULT: 1.2,     // 1.2x Base Fare surcharge
        PEAK_MIN_RATE: 0.45,    // RM 0.45/min during peak
        INTERSTATE_MULT: 1.8,   // Updated to 1.8x
        TERRAIN: 20.00 
    }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer;

// Set current time as default
const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
$("departure-time").value = now.toISOString().slice(0,16);

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([4.2105, 101.9758], 7);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

function debounceSearch(input, resultsId, type) {
    const query = input.value;
    $(type === 'pickup' ? 'clear-p' : 'clear-d').style.display = query ? 'block' : 'none';
    clearTimeout(searchTimer);
    if (query.length < 3) { $(resultsId).style.display = 'none'; return; }

    searchTimer = setTimeout(async () => {
        try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&countrycode=MY&limit=5`);
            const data = await res.json();
            renderResults(data.features, resultsId, type);
        } catch (e) { console.error("Search Error", e); }
    }, 400);
}

function renderResults(features, resultsId, type) {
    const list = $(resultsId);
    list.innerHTML = features.map(f => {
        const p = f.properties;
        // Malaysian Address Format: Building/Point, Street, District/City, State
        const addressLine = [p.name, p.street, p.district || p.city, p.state]
            .filter(Boolean)
            .join(", ");

        return `
            <div class="autocomplete-item" onclick="selectLoc('${type}', [${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], '${addressLine.replace(/'/g, "\\'")}')">
                <div style="font-weight:700; color:#1f2937;">${p.name || 'Unknown Location'}</div>
                <div style="font-size:11px; color:#6b7280;">${addressLine}</div>
            </div>`;
    }).join('');
    list.style.display = 'block';
}

function selectLoc(type, coord, label) {
    if (type === 'pickup') { 
        pickupCoord = coord; 
        $("pickup").value = label; 
        $("p-results").style.display = 'none'; 
    } else { 
        dropoffCoord = coord; 
        $("dropoff").value = label; 
        $("d-results").style.display = 'none'; 
    }
    calculate();
}

async function calculate() {
    if (!pickupCoord || !dropoffCoord) return;
    
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        
        const km = route.summary.distance / 1000;
        const durationMin = Math.ceil(route.summary.duration / 60);
        
        const dateObj = new Date($("departure-time").value);
        const hour = dateObj.getHours() + (dateObj.getMinutes() / 60);
        const locText = ($("pickup").value + $("dropoff").value).toLowerCase();

        // 1. MODIFIERS
        const isPeak = (hour >= 6 && hour < 9) || (hour >= 12.5 && hour < 14.5) || (hour >= 17 && hour < 20);
        const isMidnight = (hour >= 0 && hour < 6);
        const isInterstate = km > 100;

        // 2. SURCHARGES
        let baseFare = CONFIG.RATES.BASE;
        let midnightSurcharge = isMidnight ? (baseFare * CONFIG.RATES.MIDNIGHT_MULT) : 0;
        let terrainSurcharge = ["genting", "cameron", "fraser", "highland"].some(k => locText.includes(k)) ? CONFIG.RATES.TERRAIN : 0;

        // 3. DISTANCE RATE
        let peakMult = isPeak ? 1.2 : 1.0;
        let interstateMult = isInterstate ? CONFIG.RATES.INTERSTATE_MULT : 1.0;
        let dynamicRate = Math.min(CONFIG.RATES.KM_STANDARD * peakMult * interstateMult, CONFIG.RATES.KM_CAP);

        // 4. TIME RATE (PEAK ONLY)
        let timeFare = isPeak ? (durationMin * CONFIG.RATES.PEAK_MIN_RATE) : 0;

        // FINAL TOTAL
        let total = baseFare + (km * dynamicRate) + timeFare + midnightSurcharge + terrainSurcharge;
        
        // UI UPDATES
        $("fare").innerText = `RM ${Math.round(total)}`;
        $("badge").innerText = isInterstate ? "Interstate" : (isMidnight ? "Midnight" : (isPeak ? "Peak Hour" : "Standard"));
        $("badge").style.background = isPeak ? "#fee2e2" : (isMidnight ? "#fef3c7" : "#f1f5f9");
        
        $("summary").innerHTML = `
            📏 <b>${km.toFixed(1)} km</b> | ⏱️ <b>${durationMin} min</b><br>
            <span style="font-size:11px; color:#6b7280;">
                Base: RM ${baseFare.toFixed(2)} | 
                Rate: RM ${dynamicRate.toFixed(2)}/km <br>
                ${isPeak ? `Peak Traffic: RM ${timeFare.toFixed(2)} (${CONFIG.RATES.PEAK_MIN_RATE}/min) | ` : ''}
                Add-ons: RM ${(midnightSurcharge + terrainSurcharge).toFixed(2)}
            </span>`;
        
        $("results").style.display = 'block';

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 5}).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding: [50,150]});
        
    } catch (err) {
        console.error("Calculation Error:", err);
    }
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

$("pickup").oninput = e => debounceSearch(e.target, "p-results", "pickup");
$("dropoff").oninput = e => debounceSearch(e.target, "d-results", "dropoff");
$("departure-time").onchange = () => calculate();

$("gps-btn").onclick = () => {
    navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        try {
            const res = await fetch(`https://photon.komoot.io/reverse?lon=${lon}&lat=${lat}`);
            const data = await res.json();
            const p = data.features[0].properties;
            const name = [p.name, p.city].filter(Boolean).join(", ") || "My Location";
            selectLoc('pickup', [lat, lon], name);
        } catch(e) { selectLoc('pickup', [lat, lon], "Current Location"); }
    }, err => alert("Please enable GPS"), {enableHighAccuracy: true});
};

$("clear-p").onclick = () => { $("pickup").value = ''; $("p-results").style.display = 'none'; $("clear-p").style.display = 'none'; };
$("clear-d").onclick = () => { $("dropoff").value = ''; $("d-results").style.display = 'none'; $("clear-d").style.display = 'none'; };

// Close autocomplete when clicking outside
document.addEventListener('click', (e) => {
    if (!e.target.closest('.input-group')) {
        $("p-results").style.display = 'none';
        $("d-results").style.display = 'none';
    }
});
</script>
</body>
</html>
