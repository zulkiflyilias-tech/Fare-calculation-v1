<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novelty Resources | Transit Engine</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root {
            --primary: #059669;
            --bg: #f8fafc;
            --card: #ffffff;
            --whatsapp: #25D366;
            --text-main: #1e293b;
        }

        body { margin: 0; display: flex; height: 100vh; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text-main); }
        #map { flex: 1; }
        #sidebar {
            width: 400px; padding: 24px; background: var(--card);
            box-shadow: 4px 0 15px rgba(0,0,0,0.08); display: flex; flex-direction: column; z-index: 1000;
        }

        .header { margin-bottom: 24px; }
        .header h2 { margin: 0; color: var(--primary); font-size: 1.6rem; letter-spacing: -0.5px; }
        .header p { margin: 4px 0 0; font-size: 0.85rem; color: #64748b; font-weight: 500; }

        .input-group { margin-bottom: 20px; position: relative; }
        label { display: block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; color: #94a3b8; letter-spacing: 0.5px; }
        
        .search-wrapper { position: relative; display: flex; align-items: center; }
        input {
            width: 100%; box-sizing: border-box; padding: 14px 45px 14px 16px; border: 2px solid #f1f5f9;
            border-radius: 12px; font-size: 14px; transition: all 0.2s; background: #fdfdfd;
        }
        input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1); }

        .gps-btn {
            position: absolute; right: 12px; background: none; border: none; cursor: pointer;
            color: var(--primary); padding: 8px; border-radius: 8px; display: flex; align-items: center;
        }
        .gps-btn:hover { background: #ecfdf5; }
        .gps-btn.loading { animation: spin 1s linear infinite; opacity: 0.6; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .autocomplete-results {
            position: absolute; width: 100%; background: white; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; z-index: 2000; margin-top: 4px; border: 1px solid #e2e8f0;
            max-height: 280px; overflow-y: auto;
        }
        .autocomplete-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .autocomplete-item:hover { background: #f8fafc; }
        .place-name { font-weight: 700; font-size: 0.9rem; display: block; color: var(--text-main); }
        .place-address { font-size: 0.75rem; color: #64748b; display: block; margin-top: 2px; line-height: 1.4; }

        #results {
            margin-top: auto; padding: 24px; border-radius: 20px; background: #1e293b;
            color: white; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .fare-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        #fare { font-size: 2.2rem; font-weight: 800; color: #fff; }
        .stats { display: flex; gap: 12px; font-size: 0.8rem; color: #94a3b8; }

        .btn {
            display: block; width: 100%; text-align: center; padding: 16px; border-radius: 14px;
            background: var(--whatsapp); color: white; text-decoration: none; font-weight: 800;
            margin-top: 18px; transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }

        @media(max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; box-sizing: border-box; padding: 20px; }
            #map { height: 35vh; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <h2>Novelty Resources</h2>
        <p>Premium Transit | Peninsular Malaysia</p>
    </div>

    <div class="input-group">
        <label>Pickup Location</label>
        <div class="search-wrapper">
            <input id="pickup" placeholder="Search or use GPS..." autocomplete="off">
            <button id="gps-trigger" class="gps-btn" title="Use current location">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </button>
        </div>
        <div id="pickup-results" class="autocomplete-results"></div>
    </div>

    <div class="input-group">
        <label>Dropoff Location</label>
        <div class="search-wrapper">
            <input id="dropoff" placeholder="Search destination..." autocomplete="off">
        </div>
        <div id="dropoff-results" class="autocomplete-results"></div>
    </div>

    <div id="results">
        <div class="fare-row">
            <div id="fare">RM 0</div>
            <div id="eta" style="color: #4ade80; font-weight: 700;">-- mins</div>
        </div>
        <div class="stats">
            <span id="distance">0 km</span>
            <span>•</span>
            <span>Reliable Engine</span>
        </div>
        <a id="wa" class="btn" target="_blank">Book via WhatsApp</a>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const CONFIG = {
        WHATSAPP: "60108988182",
        ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
        CENTER: [3.139, 101.686],
        BBOX: "99.6,1.15,104.4,6.95",
        TRAFFIC_MULTIPLIER: 1.25 
    };

    const FARE_ENGINE = {
        BASE: 5.00,       
        TIERS: [
            { upTo: 5,   rate: 1.10 }, 
            { upTo: 15,  rate: 1.25 }, 
            { upTo: 50,  rate: 1.40 }, 
            { upTo: 100, rate: 1.85 }, 
            { upTo: Infinity, rate: 2.30 } 
        ]
    };

    const $ = id => document.getElementById(id);
    let pickupCoord, dropoffCoord, routeLayer, pickupMarker, dropoffMarker;
    let timer;

    const map = L.map("map", { zoomControl: false }).setView(CONFIG.CENTER, 13);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

    async function search(val, resultId, type) {
        clearTimeout(timer);
        if (val.length < 3) { $(resultId).style.display = 'none'; return; }
        timer = setTimeout(async () => {
            try {
                const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(val)}&bbox=${CONFIG.BBOX}&limit=8`);
                const data = await res.json();
                renderResults(data.features, resultId, type);
            } catch (e) { console.error("Search error"); }
        }, 300);
    }

    function renderResults(features, resultId, type) {
        const list = $(resultId);
        const mapCenter = [map.getCenter().lat, map.getCenter().lng];
        const sorted = features.sort((a, b) => {
            const getD = c => Math.sqrt(Math.pow(mapCenter[0]-c[1], 2) + Math.pow(mapCenter[1]-c[0], 2));
            return getD(a.geometry.coordinates) - getD(b.geometry.coordinates);
        });

        list.innerHTML = sorted.map(f => {
            const p = f.properties;
            const name = p.name || p.street || 'Selected Point';
            const address = [p.street, p.district, p.city, p.postcode].filter(Boolean).join(', ');
            const fullStr = `${name}${address ? ', ' + address : ''}`;
            return `
                <div class="autocomplete-item" onclick="selectLocation('${type}', [${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], '${fullStr.replace(/'/g, "\\'")}')">
                    <span class="place-name">${name}</span>
                    <span class="place-address">${address}</span>
                </div>
            `;
        }).join('');
        list.style.display = 'block';
    }

    function selectLocation(type, coord, fullLabel) {
        $(type).value = fullLabel;
        $(`${type}-results`).style.display = 'none';
        const mCfg = { radius: 8, fillOpacity: 1, weight: 2, color: '#fff' };
        if (type === 'pickup') {
            pickupCoord = coord;
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.circleMarker(coord, { ...mCfg, fillColor: '#059669' }).addTo(map);
        } else {
            dropoffCoord = coord;
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            dropoffMarker = L.circleMarker(coord, { ...mCfg, fillColor: '#1e293b' }).addTo(map);
        }
        if (pickupCoord && dropoffCoord) calculateRoute();
    }

    $("gps-trigger").onclick = () => {
        const btn = $("gps-trigger");
        btn.classList.add('loading');
        if (!navigator.geolocation) { alert("Geolocation not supported"); btn.classList.remove('loading'); return; }
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            try {
                const res = await fetch(`https://photon.komoot.io/reverse?lon=${lon}&lat=${lat}`);
                const data = await res.json();
                const p = data.features[0].properties;
                const name = p.name || p.street || "Current Location";
                const address = [p.street, p.district, p.city, p.postcode].filter(Boolean).join(', ');
                const fullLabel = `${name}${address ? ', ' + address : ''}`;
                selectLocation('pickup', [lat, lon], fullLabel);
                map.setView([lat, lon], 16);
            } catch (e) { selectLocation('pickup', [lat, lon], "Pinned Location"); }
            btn.classList.remove('loading');
        }, () => { btn.classList.remove('loading'); }, { enableHighAccuracy: true });
    };

    async function calculateRoute() {
        try {
            const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
                body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
            });
            const data = await res.json();
            const route = data.routes[0];
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.polyline(decodePoly(route.geometry), { color: '#059669', weight: 6, opacity: 0.8 }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
            processFare(route.summary.distance / 1000, (route.summary.duration / 60) * CONFIG.TRAFFIC_MULTIPLIER);
        } catch (e) { console.error("Route error"); }
    }

    function processFare(km, mins) {
        // Updated logic: RM 0.45/min if below 50km, else RM 0.65/min
        const activeMinuteRate = (km < 50) ? 0.45 : 0.65;

        let distCost = 0, remaining = km, lastLimit = 0;
        for (const tier of FARE_ENGINE.TIERS) {
            if (remaining <= 0) break;
            let currentSegment = Math.min(remaining, tier.upTo - lastLimit);
            distCost += currentSegment * tier.rate;
            remaining -= currentSegment;
            lastLimit = tier.upTo;
        }

        const total = Math.ceil(FARE_ENGINE.BASE + distCost + (mins * activeMinuteRate));

        $("results").style.display = 'block';
        $("fare").innerText = `RM ${total}`;
        $("distance").innerText = `${km.toFixed(1)} km`;
        $("eta").innerText = `${Math.round(mins)} mins`;

        const msg = `*Booking Request*\n\n*Pickup:* ${$("pickup").value}\n*Dropoff:* ${$("dropoff").value}\n\n*Distance:* ${km.toFixed(1)}km\n*Fare:* RM ${total}`;
        $("wa").href = `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`;
    }

    function decodePoly(str) {
        let index = 0, lat = 0, lng = 0, coordinates = [];
        while (index < str.length) {
            let b, shift = 0, result = 0;
            do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
            lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
            shift = 0; result = 0;
            do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
            lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
            coordinates.push([lat / 1e5, lng / 1e5]);
        }
        return coordinates;
    }

    $("pickup").oninput = e => search(e.target.value, "pickup-results", "pickup");
    $("dropoff").oninput = e => search(e.target.value, "dropoff-results", "dropoff");
    document.addEventListener('click', e => {
        if (!e.target.closest('.input-group')) {
            document.querySelectorAll('.autocomplete-results').forEach(el => el.style.display = 'none');
        }
    });
</script>
</body>
</html>
