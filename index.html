<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v6.5.0 PRO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --gray-text: #6b7280; --accent: #f59e0b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .search-panel { background: var(--card-bg); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1005; }
        .inputs-container { display: flex; align-items: center; gap: 12px; }
        .inputs-flex { flex: 1; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gray-text); text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #f9fafb; transition: 0.2s; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }
        
        #pickup, #dropoff { padding-right: 85px; }

        .swap-btn { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; }
        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 4px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: #9ca3af; font-size: 18px; }
        
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 10000; max-height: 280px; overflow-y: auto; border-radius: 0 0 16px 16px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); display: none; margin-top: 4px; border: 1px solid #eee; }
        .autocomplete-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9fafb; }
        .autocomplete-item.venue-hotspot { background: #ecfdf5; border-left: 4px solid var(--primary); }
        .loc-icon { background: #f3f4f6; color: #6b7280; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .loc-name { font-weight: 600; font-size: 14px; color: var(--text); }
        .loc-address { font-size: 11px; color: var(--gray-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #map { flex-grow: 1; width: 100%; z-index: 1; cursor: crosshair; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 9998; }
        .fare-breakdown { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 85%; max-width: 340px; background: white; padding: 24px; border-radius: 28px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); z-index: 9999; flex-direction: column; 
        }
        .invoice-table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--text); }
        .invoice-table td { padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .invoice-table .rate-label { font-size: 10px; color: var(--gray-text); display: block; }
        .invoice-table .amount { text-align: right; font-family: monospace; font-weight: 600; }
        .invoice-total { margin-top: 15px; padding-top: 15px; border-top: 2px solid var(--primary); display: flex; justify-content: space-between; font-weight: 800; font-size: 20px; }
        
        .results-card { 
            position: fixed; bottom: 20px; left: 16px; right: 16px; 
            background: white; padding: 20px; border-radius: 24px; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 1002; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(150%); opacity: 0; pointer-events: none;
        }
        .results-card.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .action-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { border: none; border-radius: 12px; padding: 10px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-transform: uppercase; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-copy { background: #f1f5f9; color: #475569; }
        .btn-maps { background: #4285F4; color: white; }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="inputs-container">
        <div class="inputs-flex">
            <div class="input-group">
                <label>Pickup (Tap map for exact spot)</label>
                <input type="text" id="pickup" placeholder="Set pickup..." autocomplete="off">
                <div class="btn-container">
                    <button id="clear-p" class="icon-btn" style="display:none">✕</button>
                    <button id="gps-btn" class="icon-btn">📍</button>
                </div>
                <div id="p-results" class="autocomplete-list"></div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>Destination</label>
                <input type="text" id="dropoff" placeholder="Where to?" autocomplete="off">
                <div class="btn-container">
                    <button id="clear-d" class="icon-btn" style="display:none">✕</button>
                </div>
                <div id="d-results" class="autocomplete-list"></div>
            </div>
        </div>
        <button id="swap-btn" class="swap-btn">⇅</button>
    </div>
    <div class="input-group" style="margin-top: 12px; margin-bottom:0;">
        <label>Travel Schedule</label>
        <input type="datetime-local" id="departure-time">
    </div>
</div>

<div id="map"></div>

<div id="modal-overlay" class="modal-overlay" onclick="toggleBreakdown()"></div>
<div id="breakdown" class="fare-breakdown">
    <h3 style="margin: 0 0 15px 0;">Fare Breakdown</h3>
    <div id="invoice-content"></div>
    <button class="action-btn" style="width:100%; margin-top:15px; background:#f3f4f6" onclick="toggleBreakdown()">Close</button>
</div>

<div id="results" class="results-card">
    <div class="fare-header" onclick="toggleBreakdown()" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
            <h2 id="fare" style="margin:0; color:var(--primary); font-size:32px;">RM 0</h2>
            <div style="font-size: 9px; color: #9ca3af; text-transform: uppercase;">Tap for details ▾</div>
        </div>
        <span id="badge" style="font-size:10px; font-weight:800; padding:4px 10px; background:#f1f5f9; border-radius:20px;">STANDARD</span>
    </div>
    <p id="summary" style="font-size:12px; color:#4b5563; margin-top:8px;"></p>
    <div class="action-bar">
        <button class="action-btn btn-whatsapp" id="btn-whatsapp"><span>💬</span> WhatsApp</button>
        <button class="action-btn btn-copy" id="btn-copy"><span>📋</span> Copy</button>
        <button class="action-btn btn-maps" id="btn-maps"><span>🗺️</span> Maps App</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { 
        BASE: 5.00, KM_TIER_1: 1.25, KM_TIER_2: 1.00, KM_TIER_3: 0.85, TIME_RATE: 0.20, 
        INTERSTATE_INCENTIVE: 50.00, INTERSTATE_THRESHOLD: 100,
        MIDNIGHT: 1.10, MORNING_PEAK: 1.30, LUNCH_SURGE: 1.10, EVENING_PEAK: 1.35
    },
    HOTSPOTS: [
        { name: "SCM - Main Entrance (Lobby A)", lat: 3.1095, lon: 101.4602, keywords: ["scm", "setia city mall", "main"] },
        { name: "SCM - Park Entrance (Lobby B)", lat: 3.1085, lon: 101.4590, keywords: ["scm", "setia city mall", "park"] },
        { name: "SCM - North Entrance (Lobby C)", lat: 3.1110, lon: 101.4585, keywords: ["scm", "setia city mall", "north"] },
        { name: "SCM - AEON Entrance", lat: 3.1105, lon: 101.4580, keywords: ["scm", "aeon"] },
        { name: "KL Sentral - Departure Hall", lat: 3.1344, lon: 101.6865, keywords: ["sentral", "kls"] }
    ]
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer, currentFare = 0, currentSurgeLabel = "Standard";
let pickupMarker, dropoffMarker;

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([3.1478, 101.6953], 12);

// GOOGLE MAPS STYLE LAYOUT
L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    subdomains:['mt0','mt1','mt2','mt3']
}).addTo(map);

const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
$("departure-time").value = now.toISOString().slice(0,16);

// MAP CLICK FOR EXACT PINPOINTING
map.on('click', async function(e) {
    const { lat, lng } = e.latlng;
    if (!pickupCoord) {
        pickupCoord = [lat, lng];
        updateMarker('pickup', lat, lng);
        reverseGeocode(lat, lng, 'pickup');
    } else {
        dropoffCoord = [lat, lng];
        updateMarker('dropoff', lat, lng);
        reverseGeocode(lat, lng, 'dropoff');
    }
});

function updateMarker(type, lat, lng) {
    if (type === 'pickup') {
        if (pickupMarker) map.removeLayer(pickupMarker);
        pickupMarker = L.circleMarker([lat, lng], { radius: 8, color: '#059669', fillOpacity: 1 }).addTo(map);
    } else {
        if (dropoffMarker) map.removeLayer(dropoffMarker);
        dropoffMarker = L.circleMarker([lat, lng], { radius: 8, color: '#ef4444', fillOpacity: 1 }).addTo(map);
    }
    if (pickupCoord && dropoffCoord) calculate();
}

async function reverseGeocode(lat, lng, type) {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`);
        const data = await res.json();
        const addr = data.display_name.split(',').slice(0, 3).join(',');
        $(type).value = addr;
        $(type === 'pickup' ? 'clear-p' : 'clear-d').style.display = 'block';
    } catch (e) { $(type).value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`; }
}

function debounceSearch(input, resultsId, type) {
    const query = input.value;
    $(type === 'pickup' ? 'clear-p' : 'clear-d').style.display = query ? 'block' : 'none';
    clearTimeout(searchTimer);
    if (query.length < 3) { $(resultsId).style.display = 'none'; return; }
    searchTimer = setTimeout(() => searchNominatim(query, resultsId, type), 400);
}

async function searchNominatim(query, resultsId, type) {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=my&limit=10&addressdetails=1`);
        const data = await res.json();
        const qLower = query.toLowerCase();
        const manualMatches = CONFIG.HOTSPOTS.filter(h => 
            h.keywords.some(k => qLower.includes(k)) || h.name.toLowerCase().includes(qLower)
        );
        renderResults(data, manualMatches, resultsId, type);
    } catch (e) { console.error(e); }
}

function renderResults(apiResults, hotspots, resultsId, type) {
    const list = $(resultsId);
    let html = '';
    hotspots.forEach(h => {
        html += `<div class="autocomplete-item venue-hotspot" onclick="selectLoc('${type}', [${h.lat}, ${h.lon}], '${h.name}')">
            <div class="loc-icon">🏢</div>
            <div class="loc-details">
                <div class="loc-name">${h.name}</div>
                <div class="loc-address">Verified Pickup Point</div>
            </div>
        </div>`;
    });
    apiResults.forEach(r => {
        const name = r.address.suburb || r.address.neighbourhood || r.address.road || "Location";
        const sub = r.display_name.split(',').slice(1, 4).join(',');
        html += `<div class="autocomplete-item" onclick="selectLoc('${type}', [${r.lat}, ${r.lon}], '${r.display_name.replace(/'/g, "")}')">
            <div class="loc-icon">📍</div>
            <div class="loc-details">
                <div class="loc-name">${name}</div>
                <div class="loc-address">${sub}</div>
            </div>
        </div>`;
    });
    list.innerHTML = html;
    list.style.display = html ? 'block' : 'none';
}

function selectLoc(type, coord, label) {
    if (type === 'pickup') { 
        pickupCoord = coord; 
        $("pickup").value = label; 
        $("p-results").style.display = 'none'; 
    } else { 
        dropoffCoord = coord; 
        $("dropoff").value = label; 
        $("d-results").style.display = 'none'; 
        // FLY TO DESTINATION AT HIGH ZOOM
        map.flyTo(coord, 18, { animate: true, duration: 1.5 });
    }
    updateMarker(type, coord[0], coord[1]);
}

async function calculate() {
    if (!pickupCoord || !dropoffCoord) return;
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        const km = route.summary.distance / 1000;
        const durationMin = Math.ceil(route.summary.duration / 60);
        
        const dt = new Date($("departure-time").value);
        const hour = dt.getHours() + (dt.getMinutes() / 60);
        let activeMult = 1.0; currentSurgeLabel = "Standard";
        if (hour >= 0 && hour < 6) { activeMult = CONFIG.RATES.MIDNIGHT; currentSurgeLabel = "Midnight Surcharge (10%)"; }
        else if (hour >= 7 && hour < 9) { activeMult = CONFIG.RATES.MORNING_PEAK; currentSurgeLabel = "Morning Peak (30%)"; }
        else if (hour >= 17 && hour < 20) { activeMult = CONFIG.RATES.EVENING_PEAK; currentSurgeLabel = "Evening Peak (35%)"; }

        let distFare = 0, tierHtml = "";
        if (km <= 50) { 
            distFare = km * CONFIG.RATES.KM_TIER_1; 
            tierHtml = `<tr><td>Distance (T1)<span class="rate-label">${km.toFixed(1)} km @ RM ${CONFIG.RATES.KM_TIER_1.toFixed(2)}</span></td><td class="amount">RM ${distFare.toFixed(2)}</td></tr>`; 
        } else {
            const t1 = 50 * CONFIG.RATES.KM_TIER_1;
            const t2 = (km - 50) * CONFIG.RATES.KM_TIER_2;
            distFare = t1 + t2;
            tierHtml = `<tr><td>Distance (T1+T2)<span class="rate-label">${km.toFixed(1)} km (Tiered)</span></td><td class="amount">RM ${distFare.toFixed(2)}</td></tr>`;
        }

        const timeFare = durationMin * CONFIG.RATES.TIME_RATE;
        let subtotal = CONFIG.RATES.BASE + distFare + timeFare;
        const isInterstate = km > CONFIG.RATES.INTERSTATE_THRESHOLD;
        if (isInterstate) subtotal += CONFIG.RATES.INTERSTATE_INCENTIVE;
        currentFare = Math.round(subtotal * activeMult);

        $("fare").innerText = `RM ${currentFare}`;
        $("badge").innerText = isInterstate ? "INTERSTATE" : "STANDARD";
        $("summary").innerHTML = `<b>${km.toFixed(1)} km</b> • <b>${durationMin} min</b>`;
        
        $("invoice-content").innerHTML = `
            <table class="invoice-table">
                <tr><td>Base Fare</td><td class="amount">RM ${CONFIG.RATES.BASE.toFixed(2)}</td></tr>
                ${tierHtml}
                <tr><td>Time<span class="rate-label">${durationMin} min</span></td><td class="amount">RM ${timeFare.toFixed(2)}</td></tr>
                ${isInterstate ? `<tr><td>Interstate Fee</td><td class="amount">RM ${CONFIG.RATES.INTERSTATE_INCENTIVE.toFixed(2)}</td></tr>` : ''}
                ${activeMult > 1 ? `<tr style="color:var(--accent)"><td>${currentSurgeLabel}</td><td class="amount">x${activeMult.toFixed(2)}</td></tr>` : ''}
            </table>
            <div class="invoice-total"><span>Total</span><span>RM ${currentFare.toFixed(2)}</span></div>`;
        
        $("results").classList.add('visible');
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 5}).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding: [50,150]});
    } catch (err) { console.error(err); }
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

function toggleBreakdown() {
    const modal = $("breakdown");
    const overlay = $("modal-overlay");
    const isVisible = modal.style.display === "flex";
    modal.style.display = isVisible ? "none" : "flex";
    overlay.style.display = isVisible ? "none" : "block";
}

$("btn-maps").onclick = () => { 
    if(pickupCoord && dropoffCoord) {
        const url = `https://www.google.com/maps/dir/?api=1&origin=${pickupCoord[0]},${pickupCoord[1]}&destination=${dropoffCoord[0]},${dropoffCoord[1]}&travelmode=driving`;
        window.open(url, '_blank'); 
    }
};

$("pickup").oninput = e => debounceSearch(e.target, "p-results", "pickup");
$("dropoff").oninput = e => debounceSearch(e.target, "d-results", "dropoff");
$("gps-btn").onclick = () => {
    navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        selectLoc('pickup', [lat, lon], "Current Location");
        reverseGeocode(lat, lon, 'pickup');
    });
};

$("btn-whatsapp").onclick = () => {
    const msg = encodeURIComponent(`*Booking Inquiry*\nPickup: ${$("pickup").value}\nDest: ${$("dropoff").value}\nFare: RM ${currentFare}`);
    window.open(`https://wa.me/60108988182?text=${msg}`, '_blank');
};

$("btn-copy").onclick = () => {
    const txt = `Booking Inquiry\nPickup: ${$("pickup").value}\nDest: ${$("dropoff").value}\nFare: RM ${currentFare}`;
    navigator.clipboard.writeText(txt).then(() => alert("Copied!"));
};

$("clear-p").onclick = () => { $("pickup").value = ''; pickupCoord = null; if(pickupMarker) map.removeLayer(pickupMarker); $("clear-p").style.display='none'; };
$("clear-d").onclick = () => { $("dropoff").value = ''; dropoffCoord = null; if(dropoffMarker) map.removeLayer(dropoffMarker); $("clear-d").style.display='none'; };
$("swap-btn").onclick = () => {
    let pV = $("pickup").value, dV = $("dropoff").value, pC = pickupCoord;
    $("pickup").value = dV; $("dropoff").value = pV;
    pickupCoord = dropoffCoord; dropoffCoord = pC;
    if (pickupCoord) updateMarker('pickup', pickupCoord[0], pickupCoord[1]);
    if (dropoffCoord) updateMarker('dropoff', dropoffCoord[0], dropoffCoord[1]);
    calculate();
};
</script>
</body>
</html>
