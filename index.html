<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rideshare MY - Novelty Resources</title>
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; padding: 20px; color: var(--dark); }
        .card { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input[type="number"], input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .checkbox-item { display: flex; align-items: center; background: #eee; padding: 10px; border-radius: 8px; cursor: pointer; }
        .checkbox-item input { margin-right: 10px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-calc { background: var(--primary); color: white; font-size: 1.1em; }
        .btn-copy { background: var(--dark); color: white; }
        #result { margin-top: 20px; padding: 15px; background: #e8f8f5; border-radius: 8px; text-align: center; display: none; }
        .fare-amount { font-size: 2em; font-weight: bold; color: var(--primary); display: block; }
    </style>
</head>
<body>

<div class="card">
    <h2>Rideshare MY</h2>
    
    <div class="input-group">
        <label>Distance (KM)</label>
        <input type="number" id="distance" placeholder="e.g. 362.8" step="0.1">
    </div>

    <div class="input-group">
        <label>Estimated Time (Minutes)</label>
        <input type="number" id="duration" placeholder="e.g. 231">
    </div>

    <div class="checkbox-group">
        <label class="checkbox-item">
            <input type="checkbox" id="isPeak"> Peak Hour
        </label>
        <label class="checkbox-item">
            <input type="checkbox" id="isInterstate"> Interstate
        </label>
    </div>

    <button class="btn-calc" onclick="updateFare()">Calculate Fare</button>
    
    <div id="result">
        <small>Estimated Fare</small>
        <span class="fare-amount" id="fareDisplay">RM 0.00</span>
        <button class="btn-copy" onclick="copyFare()">Copy Quote</button>
    </div>
</div>

<script>
function calculateFareLogic(distanceKm, durationMin, isPeak, isInterstate) {
    const baseFare = 5.00;
    const timeRate = 0.30;
    const interstateSurcharge = 50.00;
    const peakMultiplier = 1.25;

    let distanceFare = 0;

    // Reverse Tier Calculation (High -> Low)
    if (distanceKm <= 10) {
        distanceFare = distanceKm * 1.60;
    } else if (distanceKm <= 25) {
        distanceFare = (10 * 1.60) + (distanceKm - 10) * 1.40;
    } else if (distanceKm <= 50) {
        distanceFare = (10 * 1.60) + (15 * 1.40) + (distanceKm - 25) * 1.25;
    } else if (distanceKm <= 75) {
        distanceFare = (10 * 1.60) + (15 * 1.40) + (25 * 1.25) + (distanceKm - 50) * 1.10;
    } else if (distanceKm <= 100) {
        distanceFare = (10 * 1.60) + (15 * 1.40) + (25 * 1.25) + (25 * 1.10) + (distanceKm - 75) * 1.00;
    } else {
        distanceFare = (10 * 1.60) + (15 * 1.40) + (25 * 1.25) + (25 * 1.10) + (25 * 1.00) + (distanceKm - 100) * 0.90;
    }

    let total = baseFare + distanceFare + (durationMin * timeRate);
    if (isInterstate) total += interstateSurcharge;
    if (isPeak) total *= peakMultiplier;

    return total.toFixed(2);
}

function updateFare() {
    const dist = parseFloat(document.getElementById('distance').value) || 0;
    const time = parseFloat(document.getElementById('duration').value) || 0;
    const peak = document.getElementById('isPeak').checked;
    const interstate = document.getElementById('isInterstate').checked;

    const finalFare = calculateFareLogic(dist, time, peak, interstate);
    
    document.getElementById('fareDisplay').innerText = "RM " + finalFare;
    document.getElementById('result').style.display = 'block';
}

function copyFare() {
    const fare = document.getElementById('fareDisplay').innerText;
    const text = `Rideshare MY Quote\nDistance: ${document.getElementById('distance').value}KM\nEstimated Fare: ${fare}\n*Excludes Tolls`;
    navigator.clipboard.writeText(text);
    alert("Quote copied to clipboard!");
}
</script>

</body>
</html>
