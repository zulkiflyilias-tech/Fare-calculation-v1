<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Rideshare MY - Pure Fare Estimator | OSRM Driven</title>
    <!-- Leaflet CSS (integrity + crossorigin for security) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            color: #1e2a3e;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #map {
            height: 35vh;
            width: 100%;
            z-index: 1;
            background: #dce3ec;
        }

        #search-panel {
            flex: 1;
            background: white;
            padding: 18px 16px 20px 16px;
            box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.08);
            z-index: 10;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 18px;
        }

        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e2a3e, #2c3e66);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .badge {
            font-size: 12px;
            background: #eef2ff;
            padding: 4px 8px;
            border-radius: 40px;
            color: #2c3e66;
            font-weight: 500;
        }

        .routing-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 14px 72px 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 15px;
            background: #fefefe;
            transition: all 0.2s;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        #pickup {
            padding-right: 88px;
        }

        input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
            background: white;
        }

        .action-group {
            position: absolute;
            right: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #5b6e8c;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: #f1f5f9;
            color: #a855f7;
        }

        .clear-btn {
            font-size: 20px;
            display: none;
        }

        .swap-container {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
        }

        .swap-btn {
            background: white;
            border: 1px solid #e2e8f0;
            color: #a855f7;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: 0.2s;
        }

        .swap-btn:hover {
            background: #faf5ff;
            transform: scale(1.05);
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 18px;
            border: 1px solid #eef2ff;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .suggestion-item {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background: #faf5ff;
        }

        #result-card {
            background: linear-gradient(145deg, #111827, #1f2937);
            color: white;
            border-radius: 28px;
            padding: 20px;
            margin-top: 16px;
            display: none;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        }

        .fare-header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }

        .fare-header {
            font-size: 34px;
            font-weight: 800;
            color: #d8b4fe;
            letter-spacing: -0.5px;
        }

        .fare-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            background: rgba(255,255,255,0.08);
            padding: 8px 12px;
            border-radius: 40px;
            margin-top: 8px;
        }

        #invoice-details {
            margin-top: 18px;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .detail-row.total-bold {
            color: white;
            font-weight: 700;
            border-top: 1px solid #334155;
            padding-top: 10px;
            margin-top: 4px;
            font-size: 15px;
        }

        #error-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            margin: 8px 0 0;
        }

        /* custom marker styles for clarity */
        .leaflet-div-icon {
            background: transparent;
            border: none;
            font-size: 28px;
            line-height: 1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        @media(min-width: 768px) {
            #container {
                flex-direction: row-reverse;
            }
            #map {
                height: 100%;
                flex: 1;
            }
            #search-panel {
                width: 420px;
                height: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
<div id="container">
    <div id="map"></div>
    <div id="search-panel">
        <div class="header-row">
            <h2>🚖 Pure Fare</h2>
            <div class="badge">Malaysia • Direct OSRM Data</div>
        </div>

        <div class="routing-wrapper">
            <div class="input-container">
                <input type="text" id="pickup" placeholder="Pickup location" autocomplete="off">
                <div class="action-group">
                    <button class="icon-btn" id="current-loc-btn" title="Use my location" aria-label="Use my current location">📍</button>
                    <button class="icon-btn clear-btn" id="clear-pickup" aria-label="Clear pickup">✕</button>
                </div>
                <div id="pickup-suggestions" class="suggestions"></div>
            </div>

            <div class="swap-container">
                <button class="swap-btn" id="swap-locations-btn" title="Swap A↔B" aria-label="Swap pickup and dropoff">⇅</button>
            </div>

            <div class="input-container">
                <input type="text" id="dropoff" placeholder="Drop-off location" autocomplete="off">
                <div class="action-group">
                    <button class="icon-btn clear-btn" id="clear-dropoff" aria-label="Clear dropoff">✕</button>
                </div>
                <div id="dropoff-suggestions" class="suggestions"></div>
            </div>
        </div>

        <div id="error-msg" role="alert"></div>

        <div id="result-card" aria-live="polite">
            <div class="fare-header-row">
                <div id="total-fare" class="fare-header">RM --</div>
            </div>
            <div class="fare-meta">
                <span id="fare-distance">0 km</span>
                <span id="fare-duration">0 mins</span>
            </div>
            <div id="invoice-details">
                <div class="detail-row"><span>Base Fare</span><span id="calc-base-fare">RM 0.00</span></div>
                <div class="detail-row"><span>Distance Fare (RM1.25/km)</span><span id="calc-ride-distance-rate">RM 0.00</span></div>
                <div class="detail-row"><span>Dynamic Incentive (time)</span><span id="calc-incentive">RM 0.00</span></div>
                <div class="detail-row" id="deadhead-km-row" style="display: none;"><span>Out-of-Zone Surcharge</span><span id="calc-deadhead-km">RM 0.00</span></div>
                <div class="detail-row total-bold"><span>Rounded Final Total</span><span id="calc-grand" style="color: #d8b4fe;">RM 0.00</span></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
    // ----------------------------------------------
    // RIDE SHARE ESTIMATOR (Malaysia) - Test tool removed
    // ----------------------------------------------
    (function() {
        // ----- MAP INITIALIZATION -----
        const map = L.map('map').setView([3.1390, 101.6869], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; CartoDB',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // ----- GLOBALS (safe encapsulation)-----
        let pickupMarker = null;
        let dropoffMarker = null;
        let routeLine = null;
        let pickupCoords = null;
        let dropoffCoords = null;
        let currentRouteTimeout = null;
        let routeAbortController = null;

        // Helper: format duration safely
        function formatDuration(totalMins) {
            if (isNaN(totalMins) || totalMins <= 0) return "0 mins";
            if (totalMins < 60) return `${Math.round(totalMins)} mins`;
            const hours = Math.floor(totalMins / 60);
            const mins = Math.round(totalMins % 60);
            return mins > 0 ? `${hours} hr ${mins} mins` : `${hours} hr`;
        }

        function roundToMalaysianCents(value) {
            if (isNaN(value)) return 0;
            return Math.round(value * 10) / 10;
        }

        // Fare logic (identical to spec but hardened)
        function processCalculations(distanceKm, durationMins) {
            // input validation
            distanceKm = Math.max(0.1, distanceKm);
            durationMins = Math.max(1, durationMins);
            
            const baseFare = 5.00;
            const perKmRate = 1.25;
            const rideDistanceFare = distanceKm * perKmRate;
            const driverIncentive = (durationMins / 60) * 14.80;
            
            let deadheadCost = 0;
            if (distanceKm > 12) {
                const boundaryKm = Math.min(distanceKm, 350);
                const dynamicScalePct = ((boundaryKm - 12) / (350 - 12)) * 0.45;
                deadheadCost = rideDistanceFare * dynamicScalePct;
                const deadheadRow = document.getElementById('deadhead-km-row');
                if (deadheadRow) deadheadRow.style.display = 'flex';
            } else {
                const deadheadRow = document.getElementById('deadhead-km-row');
                if (deadheadRow) deadheadRow.style.display = 'none';
            }
            
            let rawTotal = baseFare + rideDistanceFare + driverIncentive + deadheadCost;
            let roundedTotal = Math.max(baseFare, roundToMalaysianCents(rawTotal));
            const finalDisplayedWholeFare = Math.round(roundedTotal);
            
            // DOM updates with safety checks
            const totalFareElem = document.getElementById('total-fare');
            if (totalFareElem) totalFareElem.textContent = `RM ${finalDisplayedWholeFare}`;
            
            const distanceElem = document.getElementById('fare-distance');
            if (distanceElem) distanceElem.textContent = `${distanceKm.toFixed(1)} km`;
            
            const durationElem = document.getElementById('fare-duration');
            if (durationElem) durationElem.textContent = formatDuration(durationMins);
            
            const baseElem = document.getElementById('calc-base-fare');
            if (baseElem) baseElem.textContent = `RM ${baseFare.toFixed(2)}`;
            
            const rideDistElem = document.getElementById('calc-ride-distance-rate');
            if (rideDistElem) rideDistElem.textContent = `RM ${rideDistanceFare.toFixed(2)}`;
            
            const incentiveElem = document.getElementById('calc-incentive');
            if (incentiveElem) incentiveElem.textContent = `RM ${driverIncentive.toFixed(2)}`;
            
            const deadheadElem = document.getElementById('calc-deadhead-km');
            if (deadheadElem) deadheadElem.textContent = `RM ${deadheadCost.toFixed(2)}`;
            
            const grandElem = document.getElementById('calc-grand');
            if (grandElem) grandElem.textContent = `RM ${roundedTotal.toFixed(2)}`;
            
            const resultCard = document.getElementById('result-card');
            if (resultCard) resultCard.style.display = 'block';
        }
        
        // traffic duration simulation (realistic factor)
        function computeTrafficDuration(baseMinutes) {
            if (isNaN(baseMinutes) || baseMinutes <= 0) baseMinutes = 5;
            const now = new Date();
            const hour = now.getHours();
            const isWeekend = (now.getDay() === 0 || now.getDay() === 6);
            let factor = 1.15;
            if (!isWeekend) {
                if ((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19.5)) factor = 1.55;
                else if (hour >= 12 && hour <= 14) factor = 1.25;
                else factor = 1.12;
            } else {
                if (hour >= 16 && hour <= 21) factor = 1.35;
                else factor = 1.05;
            }
            let distanceImpact = 1.0;
            if (baseMinutes <= 12) distanceImpact = 0.75;
            else if (baseMinutes <= 30) distanceImpact = 0.9;
            const corrected = baseMinutes * (1 + ((factor - 1) * distanceImpact));
            return Math.max(2, Math.round(corrected));
        }
        
        // ----- MAIN ROUTE PROCESSING (sanitized, abort controller) -----
        async function fetchRouteAndFare() {
            if (!pickupCoords || !dropoffCoords) return;
            hideError();
            
            if (currentRouteTimeout) clearTimeout(currentRouteTimeout);
            if (routeAbortController) routeAbortController.abort();
            routeAbortController = new AbortController();
            const { signal } = routeAbortController;
            
            // small debounce to avoid rapid requests
            currentRouteTimeout = setTimeout(async () => {
                // Validate coordinates
                if (!pickupCoords?.lon || !pickupCoords?.lat || !dropoffCoords?.lon || !dropoffCoords?.lat) return;
                const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords.lon},${pickupCoords.lat};${dropoffCoords.lon},${dropoffCoords.lat}?overview=full&geometries=geojson&steps=false&annotations=false`;
                try {
                    const response = await fetch(url, { signal });
                    if (!response.ok) throw new Error(`OSRM error ${response.status}`);
                    const data = await response.json();
                    if (!data.routes || data.routes.length === 0) {
                        showError("No drivable route found. Try different locations.");
                        return;
                    }
                    
                    const route = data.routes[0];
                    const distanceKm = route.distance / 1000;
                    const baseDurationMins = route.duration / 60;
                    const finalDurationMins = computeTrafficDuration(baseDurationMins);
                    
                    // remove old route line
                    if (routeLine) map.removeLayer(routeLine);
                    if (route.geometry) {
                        routeLine = L.geoJSON(route.geometry, {
                            style: { color: '#a855f7', weight: 5, opacity: 0.9, dashArray: '6, 8' }
                        }).addTo(map);
                    }
                    
                    // fit bounds with padding
                    if (pickupCoords && dropoffCoords) {
                        const bounds = L.latLngBounds(
                            [pickupCoords.lat, pickupCoords.lon],
                            [dropoffCoords.lat, dropoffCoords.lon]
                        );
                        map.fitBounds(bounds, { padding: [45, 45] });
                    }
                    
                    processCalculations(distanceKm, finalDurationMins);
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.warn("Routing fetch error:", err);
                    showError("Routing error: unable to get route data. Please retry.");
                } finally {
                    currentRouteTimeout = null;
                }
            }, 280);
        }
        
        function checkAndProcessRoute() {
            if (!pickupCoords || !dropoffCoords) {
                resetCalculationDisplay();
                return;
            }
            fetchRouteAndFare();
        }
        
        function showError(msg) {
            const errDiv = document.getElementById('error-msg');
            if (errDiv) {
                errDiv.textContent = msg;
                errDiv.style.display = 'block';
            }
            const resultCard = document.getElementById('result-card');
            if (resultCard) resultCard.style.display = 'none';
        }
        
        function hideError() {
            const errDiv = document.getElementById('error-msg');
            if (errDiv) errDiv.style.display = 'none';
        }
        
        function resetCalculationDisplay() {
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
            const resultCard = document.getElementById('result-card');
            if (resultCard) resultCard.style.display = 'none';
            hideError();
        }
        
        function updateMarker(type, coords) {
            if (!coords) return;
            if (type === 'pickup') {
                if (pickupMarker) map.removeLayer(pickupMarker);
                pickupMarker = L.marker([coords.lat, coords.lon], {
                    icon: L.divIcon({ className: 'custom-pin', html: '📍', iconSize: [28,28], popupAnchor: [0, -10] })
                }).addTo(map).bindPopup('Pickup', { autoClose: false, closeOnClick: false }).openPopup();
            } else {
                if (dropoffMarker) map.removeLayer(dropoffMarker);
                dropoffMarker = L.marker([coords.lat, coords.lon], {
                    icon: L.divIcon({ className: 'custom-pin', html: '🏁', iconSize: [28,28] })
                }).addTo(map).bindPopup('Drop-off');
            }
        }
        
        // Enhanced address formatter (sanitize string)
        function expandAddress(props) {
            const parts = [];
            if (props.name && typeof props.name === 'string') parts.push(props.name.trim());
            if (props.street && typeof props.street === 'string') parts.push(props.street.trim());
            if (props.district && typeof props.district === 'string') parts.push(props.district.trim());
            if ((props.city || props.town) && typeof (props.city || props.town) === 'string') parts.push((props.city || props.town).trim());
            if (props.state && typeof props.state === 'string') parts.push(props.state.trim());
            return parts.length > 0 ? parts.join(', ') : 'Selected location';
        }
        
        // Photon autocomplete with timeout, bbox Malaysia
        function setupAutocomplete(inputId, suggestionsId, clearBtnId, onSelect, onClear) {
            const input = document.getElementById(inputId);
            const suggestionsBox = document.getElementById(suggestionsId);
            const clearBtn = document.getElementById(clearBtnId);
            if (!input || !suggestionsBox) return;
            
            let debounceTimer;
            let currentRequest = null;
            
            const handleInput = () => {
                clearTimeout(debounceTimer);
                const val = input.value.trim();
                if (clearBtn) clearBtn.style.display = val ? 'block' : 'none';
                if (val.length < 3) {
                    suggestionsBox.style.display = 'none';
                    suggestionsBox.innerHTML = '';
                    return;
                }
                debounceTimer = setTimeout(() => {
                    // Abort previous fetch if any
                    if (currentRequest) currentRequest.abort();
                    const bbox = "99.6,0.8,119.5,7.4";
                    const controller = new AbortController();
                    currentRequest = controller;
                    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(val)}&bbox=${bbox}&limit=6&lang=en`, { signal: controller.signal })
                        .then(res => res.json())
                        .then(data => {
                            if (controller !== currentRequest) return;
                            suggestionsBox.innerHTML = '';
                            if (!data.features || !data.features.length) {
                                suggestionsBox.style.display = 'none';
                                return;
                            }
                            suggestionsBox.style.display = 'block';
                            data.features.forEach(feature => {
                                const address = expandAddress(feature.properties);
                                const div = document.createElement('div');
                                div.className = 'suggestion-item';
                                div.textContent = address.length > 80 ? address.slice(0,80)+'…' : address;
                                div.setAttribute('role', 'option');
                                div.addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    input.value = address;
                                    suggestionsBox.style.display = 'none';
                                    const [lon, lat] = feature.geometry.coordinates;
                                    if (onSelect && typeof onSelect === 'function') {
                                        onSelect({ lat, lon });
                                    }
                                });
                                suggestionsBox.appendChild(div);
                            });
                        })
                        .catch(err => {
                            if (err.name === 'AbortError') return;
                            console.warn('Photon error', err);
                            suggestionsBox.style.display = 'none';
                        });
                }, 320);
            };
            
            input.addEventListener('input', handleInput);
            input.addEventListener('blur', () => {
                // delay to allow click on suggestion
                setTimeout(() => {
                    suggestionsBox.style.display = 'none';
                }, 200);
            });
            
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    input.value = '';
                    suggestionsBox.innerHTML = '';
                    suggestionsBox.style.display = 'none';
                    if (clearBtn) clearBtn.style.display = 'none';
                    if (onClear) onClear();
                });
            }
        }
        
        // Swap locations with safety
        function executeLocationSwap() {
            const pickupInp = document.getElementById('pickup');
            const dropoffInp = document.getElementById('dropoff');
            if (!pickupInp || !dropoffInp) return;
            
            const tempVal = pickupInp.value;
            const tempCoord = pickupCoords ? { ...pickupCoords } : null;
            pickupInp.value = dropoffInp.value;
            pickupCoords = dropoffCoords ? { ...dropoffCoords } : null;
            dropoffInp.value = tempVal;
            dropoffCoords = tempCoord;
            
            const clearPickup = document.getElementById('clear-pickup');
            const clearDropoff = document.getElementById('clear-dropoff');
            if (clearPickup) clearPickup.style.display = pickupInp.value ? 'block' : 'none';
            if (clearDropoff) clearDropoff.style.display = dropoffInp.value ? 'block' : 'none';
            
            if (pickupCoords) updateMarker('pickup', pickupCoords);
            else if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
            if (dropoffCoords) updateMarker('dropoff', dropoffCoords);
            else if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
            
            if (pickupCoords && dropoffCoords) checkAndProcessRoute();
            else resetCalculationDisplay();
        }
        
        // ----- Geolocation with reverse geocoding (sanitized) -----
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                showError("Geolocation is not supported by your browser.");
                return;
            }
            const pickupInput = document.getElementById('pickup');
            if (pickupInput) pickupInput.value = "Locating...";
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                    pickupCoords = coords;
                    updateMarker('pickup', pickupCoords);
                    map.setView([pickupCoords.lat, pickupCoords.lon], 14);
                    const clearPickupBtn = document.getElementById('clear-pickup');
                    if (clearPickupBtn) clearPickupBtn.style.display = 'block';
                    
                    fetch(`https://photon.komoot.io/api/reverse?lon=${pickupCoords.lon}&lat=${pickupCoords.lat}`)
                        .then(res => res.json())
                        .then(data => {
                            if (pickupInput) {
                                if (data.features && data.features.length > 0) {
                                    const address = expandAddress(data.features[0].properties);
                                    pickupInput.value = address;
                                } else {
                                    pickupInput.value = `${pickupCoords.lat.toFixed(5)}, ${pickupCoords.lon.toFixed(5)}`;
                                }
                            }
                            checkAndProcessRoute();
                        })
                        .catch(() => {
                            if (pickupInput) pickupInput.value = `${pickupCoords.lat.toFixed(5)}, ${pickupCoords.lon.toFixed(5)}`;
                            checkAndProcessRoute();
                        });
                },
                err => {
                    console.warn("Geolocation error", err);
                    if (pickupInput) pickupInput.value = "";
                    showError("Location access denied or unavailable. Please type address.");
                }
            );
        }
        
        // ----- Attach event listeners and init autocomplete (test handler removed) -----
        document.getElementById('current-loc-btn')?.addEventListener('click', getCurrentLocation);
        document.getElementById('swap-locations-btn')?.addEventListener('click', executeLocationSwap);
        
        // autocomplete setups
        setupAutocomplete('pickup', 'pickup-suggestions', 'clear-pickup', 
            (coords) => { pickupCoords = coords; updateMarker('pickup', coords); checkAndProcessRoute(); },
            () => { pickupCoords = null; if(pickupMarker){ map.removeLayer(pickupMarker); pickupMarker = null; } resetCalculationDisplay(); }
        );
        setupAutocomplete('dropoff', 'dropoff-suggestions', 'clear-dropoff',
            (coords) => { dropoffCoords = coords; updateMarker('dropoff', coords); checkAndProcessRoute(); },
            () => { dropoffCoords = null; if(dropoffMarker){ map.removeLayer(dropoffMarker); dropoffMarker = null; } resetCalculationDisplay(); }
        );
        
        // initial cleanup
        resetCalculationDisplay();
    })();
</script>
</body>
</html>
