<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.4.7 PRO</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --primary: #059669;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
            --pickup-blue: #3b82f6;
            --dropoff-red: #ef4444;
        }

        body {
            font-family: -apple-system, sans-serif;
            margin: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .search-panel {
            background: var(--card-bg);
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 1005;
        }

        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--gray-text);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px 40px 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            background: #f9fafb;
        }

        .clear-btn {
            position: absolute;
            right: 10px;
            top: 28px;
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            z-index: 9999;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
            display: none;
        }

        .autocomplete-item {
            padding: 12px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
        }

        .autocomplete-item:hover { background: #f9fafb; }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .results-card {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            z-index: 1002;
            display: none;
        }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="input-group">
        <label>Pickup Location</label>
        <input type="text" id="pickup" placeholder="Type to search..." autocomplete="off">
        <button id="clear-p" class="clear-btn">✕</button>
        <div id="p-results" class="autocomplete-list"></div>
    </div>
    <div class="input-group">
        <label>Destination</label>
        <input type="text" id="dropoff" placeholder="Type to search..." autocomplete="off">
        <button id="clear-d" class="clear-btn">✕</button>
        <div id="d-results" class="autocomplete-list"></div>
    </div>
    <div class="input-group" style="margin-bottom:0;">
        <label>Travel Schedule (May 6, 2026)</label>
        <input type="datetime-local" id="departure-time">
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="fare" style="margin:0; color:var(--primary); font-size:34px;">RM 0</h2>
        <span id="badge" style="font-size:11px; font-weight:700; padding:6px 12px; background:#ecfdf5; border-radius:20px;">Standard Rate</span>
    </div>
    <p id="summary" style="font-size:13px; color:#4b5563;"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { BASE: 3.00, KM: 1.05, PEAK: 10.00, MIDNIGHT: 25.00, INTERSTATE: 50.00, TERRAIN: 20.00 }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer;

// SET DATE TO MAY 6, 2026
const date = new Date("2026-05-06T12:00:00");
$("departure-time").value = date.toISOString().slice(0,16);

const map = L.map("map", { zoomControl: false }).setView([4.2105, 101.9758], 7);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

// NO-LAG DEBOUNCE LOGIC
function debounceSearch(input, resultsId, type) {
    const query = input.value;
    $(type === 'pickup' ? 'clear-p' : 'clear-d').style.display = query ? 'block' : 'none';
    
    clearTimeout(searchTimer);
    if (query.length < 3) { $(resultsId).style.display = 'none'; return; }

    searchTimer = setTimeout(async () => {
        try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&countrycode=MY&limit=5`);
            const data = await res.json();
            renderResults(data.features, resultsId, type);
        } catch (e) { console.error("Search error"); }
    }, 400); // 400ms delay to prevent lag
}

function renderResults(features, resultsId, type) {
    const list = $(resultsId);
    list.innerHTML = features.map(f => `
        <div class="autocomplete-item" onclick="selectLoc('${type}', [${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], '${f.properties.name || 'Unknown'}')">
            <b>${f.properties.name || 'Unknown'}</b><br><small>${f.properties.city || ''}</small>
        </div>`).join('');
    list.style.display = 'block';
}

function selectLoc(type, coord, label) {
    if (type === 'pickup') { pickupCoord = coord; $("pickup").value = label; $("p-results").style.display = 'none'; }
    else { dropoffCoord = coord; $("dropoff").value = label; $("d-results").style.display = 'none'; }
    calculate();
}

async function calculate() {
    if (!pickupCoord || !dropoffCoord) return;
    const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
        body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
    });
    const data = await res.json();
    const km = data.routes[0].summary.distance / 1000;
    
    const time = new Date($("departure-time").value).getHours();
    let midnight = (time >= 0 && time < 6) ? CONFIG.RATES.MIDNIGHT : 0;
    let peak = ((time >= 6 && time < 9) || (time >= 12 && time < 15) || (time >= 17 && time < 20)) ? CONFIG.RATES.PEAK : 0;
    let interstate = km > 100 ? CONFIG.RATES.INTERSTATE : 0;
    
    let total = CONFIG.RATES.BASE + (km * CONFIG.RATES.KM) + midnight + peak + interstate;
    
    $("fare").innerText = `RM ${Math.round(total)}`;
    $("summary").innerText = `${km.toFixed(1)} km | Fees: RM ${(midnight + peak + interstate).toFixed(2)}`;
    $("results").style.display = 'block';
}

$("pickup").addEventListener("input", e => debounceSearch(e.target, "p-results", "pickup"));
$("dropoff").addEventListener("input", e => debounceSearch(e.target, "d-results", "dropoff"));
$("clear-p").onclick = () => { $("pickup").value = ''; $("p-results").style.display = 'none'; $("clear-p").style.display = 'none'; };
$("clear-d").onclick = () => { $("dropoff").value = ''; $("d-results").style.display = 'none'; $("clear-d").style.display = 'none'; };
</script>
</body>
</html>
