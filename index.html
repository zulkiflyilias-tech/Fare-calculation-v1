<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fare Estimator - Rideshare MY</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --blue: #4285F4; --green: #34A853; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        .search-box {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: white; padding: 20px; border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 90%; max-width: 400px;
        }
        .input-group { background: #f1f3f4; margin-bottom: 10px; border-radius: 8px; display: flex; padding: 5px 10px; }
        .input-group input { border: none; background: transparent; flex: 1; padding: 10px; outline: none; }
        .btn-calculate { width: 100%; background: var(--blue); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #result { margin-top: 15px; text-align: center; border-top: 1px dashed #ccc; padding-top: 15px; }
        .fare-price { font-size: 28px; font-weight: bold; color: var(--green); display: block; }
        .fare-details { font-size: 13px; color: #666; }
    </style>
</head>
<body>

<div class="search-box">
    <div class="input-group"><input type="text" id="pickup" placeholder="Pickup Location"></div>
    <div class="input-group"><input type="text" id="dropoff" placeholder="Destination"></div>
    <div class="input-group"><input type="datetime-local" id="travel-schedule"></div>
    <button class="btn-calculate" id="calc-btn" onclick="estimateFare()">Calculate Fare</button>
    <div id="result" style="display:none;">
        <span id="surge-label" class="fare-details"></span>
        <span id="fare-output" class="fare-price"></span>
        <span id="dist-time-output" class="fare-details"></span>
    </div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([3.139, 101.686], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let routeLayer;

    // Default time
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('travel-schedule').value = now.toISOString().slice(0, 16);

    async function getCoords(address) {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(address)}&limit=1`);
        const data = await res.json();
        return data.features.length > 0 ? data.features[0].geometry.coordinates : null;
    }

    async function estimateFare() {
        const pickup = document.getElementById('pickup').value;
        const dropoff = document.getElementById('dropoff').value;
        if (!pickup || !dropoff) return alert("Enter both locations");

        const start = await getCoords(pickup);
        const end = await getCoords(dropoff);
        if (!start || !end) return alert("Location not found");

        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson`;
        const response = await fetch(osrmUrl);
        const data = await response.json();
        
        const route = data.routes[0];
        const distKm = (route.distance / 1000).toFixed(2);
        const timeMin = (route.duration / 60).toFixed(0);

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.geoJSON(route.geometry, { color: '#4285F4', weight: 5 }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

        // PRICING LOGIC
        const baseFare = 5.00, distRate = 1.25, timeRate = 0.30, minFare = 8.00;
        const hour = new Date(document.getElementById('travel-schedule').value).getHours();
        let surge = 1.0, label = "Standard Rate";

        if ((hour >= 7 && hour < 9) || (hour >= 17 && hour < 20)) { surge = 1.3; label = "Peak Hour (1.3x)"; }
        
        // Calculate: Base + (Variable * Surge)
        let total = baseFare + (((distKm * distRate) + (timeMin * timeRate)) * surge);
        if (total < minFare) total = minFare;

        document.getElementById('result').style.display = 'block';
        document.getElementById('surge-label').innerText = label;
        document.getElementById('fare-output').innerText = `RM ${total.toFixed(2)}`;
        document.getElementById('dist-time-output').innerText = `${distKm} km | ${timeMin} min`;
    }
</script>
</body>
</html>
