<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.5 MOBILE PRO</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --whatsapp: #25D366;
            --copy: #6b7280;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
            --pickup-blue: #3b82f6;
            --dropoff-red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* UI Components */
        .search-panel {
            background: var(--card-bg);
            padding: 12px 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 1005;
            border-bottom: 1px solid #e5e7eb;
        }

        .input-group { position: relative; margin-bottom: 8px; }
        .input-group label {
            display: block; font-size: 10px; font-weight: 800;
            margin-bottom: 2px; color: var(--gray-text); text-transform: uppercase;
        }

        input {
            width: 100%; padding: 10px 40px 10px 12px;
            border: 1.5px solid #e5e7eb; border-radius: 10px;
            box-sizing: border-box; font-size: 14px; outline: none;
            background: #f9fafb; transition: all 0.2s;
        }

        input:focus { border-color: var(--primary); background: white; }

        .btn-container { position: absolute; right: 8px; top: 20px; }
        .icon-btn { background: transparent; border: none; padding: 6px; font-size: 18px; color: #9ca3af; cursor: pointer; }

        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; z-index: 9999; max-height: 250px;
            overflow-y: auto; display: none; border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .autocomplete-item { padding: 12px; border-bottom: 1px solid #f3f4f6; cursor: pointer; }
        .loc-name { font-weight: 700; font-size: 13px; display: block; }
        .loc-addr { font-size: 11px; color: var(--gray-text); }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        /* Fare Results Card */
        .results-card {
            position: fixed; bottom: 10px; left: 10px; right: 10px;
            background: white; padding: 16px; border-radius: 18px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
            z-index: 1002; display: none;
        }

        #fare { font-size: 28px; font-weight: 800; color: var(--primary); margin: 0; }
        .badge { font-size: 10px; background: #f3f4f6; padding: 4px 8px; border-radius: 10px; font-weight: 600; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
        .btn { padding: 12px; border-radius: 8px; text-align: center; color: white; text-decoration: none; font-weight: 700; font-size: 12px; border: none; cursor: pointer; }
        .btn-wa { background: var(--whatsapp); }
        .btn-nav { background: #3b82f6; }
        .btn-copy { background: var(--copy); }

        .marker-label {
            background: white; border: 2px solid black; border-radius: 50%;
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 12px;
        }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="input-group" id="pickup-group">
        <label>Pickup Point</label>
        <input type="text" id="pickup" placeholder="Search or use GPS..." autocomplete="off">
        <div class="btn-container">
            <button class="icon-btn" id="gps-trigger" title="Get Current Location">📍</button>
        </div>
        <div id="pickup-results" class="autocomplete-list"></div>
    </div>

    <div class="input-group" id="dropoff-group">
        <label>Destination</label>
        <input type="text" id="dropoff" placeholder="Where to?" autocomplete="off">
        <div id="dropoff-results" class="autocomplete-list"></div>
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="fare">RM 0</h2>
        <span id="mode-badge" class="badge">Standard</span>
    </div>
    <div style="font-size:12px; margin-top:5px; color:#555;">
        📏 <b id="distance">0 km</b> | ⏱️ <b id="eta">0 min</b> | 🚧 <b id="toll">RM 0</b>
    </div>
    <div class="btn-group">
        <a id="wa-btn" class="btn btn-wa" target="_blank">WhatsApp</a>
        <button id="copy-btn" class="btn btn-copy">Copy</button>
        <div id="nav-btn" class="btn btn-nav">Drive</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const CONFIG = {
    WHATSAPP: "60108988182",
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    CENTER: [3.1390, 101.6869],
    RATES: { 
        BASE: 1.10, 
        LONG: 1.75, 
        MIN_FARE: 5.00,
        TOLL_URBAN: 0.20, 
        TOLL_LONG: 0.14,
        AIRPORT_SURCHARGE: 7.50
    }
};

const iconA = L.divIcon({ className: '', html: `<div class="marker-label" style="border-color:#3b82f6; color:#3b82f6;">A</div>`, iconSize: [24,24] });
const iconB = L.divIcon({ className: '', html: `<div class="marker-label" style="border-color:#ef4444; color:#ef4444;">B</div>`, iconSize: [24,24] });

const map = L.map("map", { zoomControl: false, attributionControl: false, preferCanvas: true }).setView(CONFIG.CENTER, 12);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

let pickupCoord, dropoffCoord, routeLayer, pickupMarker, dropoffMarker, searchTimer, lastText = "";
const $ = id => document.getElementById(id);

// --- Core Functions ---

async function searchPlaces(query, resultId, type) {
    const list = $(resultId);
    clearTimeout(searchTimer);
    if (query.length < 3) { list.style.display = 'none'; return; }

    searchTimer = setTimeout(async () => {
        try {
            const url = `https://api.openrouteservice.org/geocode/autocomplete?api_key=${CONFIG.ORS_KEY}&text=${encodeURIComponent(query)}&boundary.country=MY&size=6`;
            const res = await fetch(url);
            const data = await res.json();
            
            list.innerHTML = data.features.map(f => {
                const p = f.properties;
                const coord = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
                const label = p.label.replace(/'/g, "\\'");
                return `<div class="autocomplete-item" onclick="selectLoc('${type}', [${coord}], '${label}')">
                    <span class="loc-name">${p.name}</span><span class="loc-addr">${p.region || 'Malaysia'}</span></div>`;
            }).join('');
            list.style.display = 'block';
        } catch (e) { console.error("Search error:", e); }
    }, 400);
}

function selectLoc(type, coord, label) {
    $(type).value = label;
    $(`${type}-results`).style.display = 'none';
    
    if (type === 'pickup') {
        pickupCoord = coord;
        if (pickupMarker) pickupMarker.setLatLng(coord);
        else pickupMarker = L.marker(coord, {icon: iconA}).addTo(map);
    } else {
        dropoffCoord = coord;
        if (dropoffMarker) dropoffMarker.setLatLng(coord);
        else dropoffMarker = L.marker(coord, {icon: iconB}).addTo(map);
    }

    if (pickupCoord && dropoffCoord) calculate();
    else map.panTo(coord);
}

async function calculate() {
    $("results").style.display = 'block';
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ 
                coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]],
                extra_info: ["tollways"],
                format: "geojson" // Using GeoJSON for easier rendering
            })
        });
        const data = await res.json();
        const route = data.features[0];
        const props = route.properties;
        
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.geoJSON(route, { style: { color: '#059669', weight: 5 } }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [60,60] });

        const km = props.summary.distance / 1000;
        const mins = Math.ceil(props.summary.duration / 60);
        
        // 1. Toll Logic
        let tollKm = 0;
        if (props.extras?.tollways) {
            const ts = props.extras.tollways.summary.find(s => s.value === 1);
            if (ts) tollKm = ts.distance / 1000;
        }
        let tollRate = (km > 50) ? CONFIG.RATES.TOLL_LONG : CONFIG.RATES.TOLL_URBAN;
        let tollEst = tollKm * tollRate;

        // 2. Airport Surcharge check
        const isAirport = ($("pickup").value + $("dropoff").value).toLowerCase().includes("klia");
        if (isAirport) tollEst += CONFIG.RATES.AIRPORT_SURCHARGE;

        // 3. Peak Hour Logic (Rush hour multiplier)
        const hour = new Date().getHours();
        const isPeak = (hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19);
        
        // 4. Base Calculation
        const rate = (km >= 90) ? CONFIG.RATES.LONG : CONFIG.RATES.BASE;
        let finalFare = (km * rate) + tollEst;
        if (isPeak) finalFare *= 1.25;

        // 5. Enforce Minimum Fare
        finalFare = Math.max(finalFare, CONFIG.RATES.MIN_FARE);
        const displayFare = Math.round(finalFare);

        // UI Updates
        $("fare").innerText = `RM ${displayFare}`;
        $("distance").innerText = `${km.toFixed(1)} km`;
        $("eta").innerText = `${mins} min`;
        $("toll").innerText = `RM ${tollEst.toFixed(2)}`;
        $("mode-badge").innerText = isPeak ? "Peak Hour" : "Standard";
        $("mode-badge").style.background = isPeak ? "#fee2e2" : "#f3f4f6";

        lastText = `🚖 RIDE BOOKING\n\n📍 Pick: ${$("pickup").value}\n🏁 Drop: ${$("dropoff").value}\n\n📏 Dist: ${km.toFixed(1)}km\n💰 Fare: RM ${displayFare}`;
        $("wa-btn").href = `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(lastText)}`;
        $("nav-btn").onclick = () => window.location.href = `google.navigation:q=${dropoffCoord[0]},${dropoffCoord[1]}`;
    } catch (e) { 
        alert("Could not calculate route. Please check your connection.");
        console.error(e); 
    }
}

// --- GPS & Reverse Geocoding ---
$("gps-trigger").onclick = () => {
    navigator.geolocation.getCurrentPosition(async p => {
        const lat = p.coords.latitude, lon = p.coords.longitude;
        
        try {
            // Reverse Geocode to get actual address
            const revUrl = `https://api.openrouteservice.org/geocode/reverse?api_key=${CONFIG.ORS_KEY}&point.lon=${lon}&point.lat=${lat}&size=1`;
            const res = await fetch(revUrl);
            const data = await res.json();
            const address = data.features[0]?.properties.name || "Current Location";
            
            selectLoc('pickup', [lat, lon], address);
            map.setView([lat, lon], 16);
        } catch (e) {
            selectLoc('pickup', [lat, lon], "My Location");
        }
    }, (err) => alert("Please enable GPS"), { enableHighAccuracy: true });
};

// --- Listeners ---
$("pickup").oninput = e => searchPlaces(e.target.value, "pickup-results", "pickup");
$("dropoff").oninput = e => searchPlaces(e.target.value, "dropoff-results", "dropoff");

$("copy-btn").onclick = () => {
    navigator.clipboard.writeText(lastText).then(() => {
        const btn = $("copy-btn");
        btn.innerText = "Saved!";
        setTimeout(() => btn.innerText = "Copy", 2000);
    });
};
</script>
</body>
</html>
