<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rideshare MY - Professional Fare Estimator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; 
            color: #212529;
        }
        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #map {
            height: 35vh;
            width: 100%;
            z-index: 1;
            cursor: pointer;
        }
        #search-panel {
            flex: 1;
            background: white;
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            z-index: 10;
            box-sizing: border-box;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: #111;
        }
        
        /* Layout Structure for Routing Form Inputs */
        .routing-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 12px 64px 12px 34px; /* Room for active field dot indicator */
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f9f9f9;
            transition: all 0.2s ease;
        }
        #pickup {
            padding-right: 88px; /* Allocated room for GPS and clear icons */
        }
        input:focus {
            outline: none;
            border-color: #8e24aa;
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(142, 36, 170, 0.1);
        }

        /* Active field dot indicator */
        .input-container::before {
            content: '';
            position: absolute;
            left: 14px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
        }
        .input-container:has(#pickup)::before {
            background-color: #4caf50; /* Green dot for pickup */
        }
        .input-container:has(#dropoff)::before {
            background-color: #f44336; /* Red dot for drop-off */
        }
        
        /* Input Utilities Groups */
        .action-group {
            position: absolute;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 5;
        }
        .icon-btn {
            border: none;
            background: none;
            color: #757575;
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .icon-btn:hover {
            background-color: #f0f0f0;
            color: #8e24aa;
        }
        .clear-btn {
            display: none;
            font-size: 18px;
            color: #aaa;
        }
        
        /* Floating Midpoint Inversion Element */
        .swap-container {
            position: absolute;
            right: 48px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 15;
        }
        .swap-btn {
            background: white;
            border: 1px solid #e0e0e0;
            color: #8e24aa;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
            font-size: 14px;
        }
        .swap-btn:hover {
            transform: scale(1.1) translateY(-45%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background-color: #fcf5ff;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            max-height: 200px; 
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            display: none;
        }
        .suggestion-item {
            padding: 12px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.4;
            border-bottom: 1px solid #f5f5f5;
        }
        .suggestion-item:hover {
            background-color: #f5f5f5;
        }

        /* Quick helper context tip banner */
        .map-tip {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
            text-align: center;
            background: #ede7f6;
            padding: 4px;
            border-radius: 4px;
            font-weight: 500;
        }
        
        /* Result Rendering Engine Blocks */
        #result-card {
            background: #1c1c1e;
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-top: 10px;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }
        .fare-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .fare-header {
            font-size: 32px;
            font-weight: 800;
            color: #b388ff;
        }
        .toggle-icon {
            font-size: 11px;
            color: #aeaeb2;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .fare-meta {
            font-size: 13px;
            color: #e5e5ea;
            display: flex;
            justify-content: space-between;
            font-weight: 500;
        }
        #invoice-details {
            margin-top: 12px;
            border-top: 1px dashed #3a3a3c;
            padding-top: 12px;
            display: none;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aeaeb2;
            margin-bottom: 8px;
        }
        .detail-row.total-bold {
            color: #fff;
            font-weight: 600;
            border-top: 1px solid #2c2c2e;
            padding-top: 8px;
            margin-bottom: 0;
            font-size: 14px;
        }
        #error-msg {
            color: #ff3b30;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        @media(min-width: 768px) {
            #container {
                flex-direction: row-reverse;
            }
            #map {
                height: 100%;
                flex: 1;
            }
            #search-panel {
                width: 380px;
                height: 100%;
                border-radius: 0;
                box-shadow: -4px 0 20px rgba(0,0,0,0.05);
            }
        }
    </style>
</head>
<body>

<div id="container">
    <div id="map"></div>
    
    <div id="search-panel">
        <div class="header-row">
            <h2>Fare Estimator</h2>
        </div>

        <div class="map-tip">💡 Tap anywhere on the map to set your active pin target</div>
        
        <div class="routing-wrapper">
            <div class="input-container">
                <input type="text" id="pickup" placeholder="Enter Pickup Location..." autocomplete="off" enterkeyhint="search">
                <div class="action-group">
                    <button class="icon-btn" id="current-loc-btn" title="Use current location">🎯</button>
                    <button class="icon-btn clear-btn" id="clear-pickup">&times;</button>
                </div>
                <div id="pickup-suggestions" class="suggestions"></div>
            </div>
            
            <div class="swap-container">
                <button class="swap-btn" id="swap-locations-btn" title="Swap locations" onclick="executeLocationSwap()">⇅</button>
            </div>
            
            <div class="input-container">
                <input type="text" id="dropoff" placeholder="Enter Drop-off Location..." autocomplete="off" enterkeyhint="search">
                <div class="action-group">
                    <button class="icon-btn clear-btn" id="clear-dropoff">&times;</button>
                </div>
                <div id="dropoff-suggestions" class="suggestions"></div>
            </div>
        </div>

        <div id="error-msg"></div>

        <div id="result-card" onclick="toggleInvoice()">
            <div class="fare-header-row">
                <div id="total-fare" class="fare-header">RM --</div>
                <span class="toggle-icon" id="toggle-lbl">Details</span>
            </div>
            <div class="fare-meta">
                <span id="fare-distance">0 km</span>
                <span id="fare-duration">0 mins</span>
            </div>
            
            <div id="invoice-details">
                <div class="detail-row">
                    <span>Base Fare</span>
                    <span id="calc-base-fare">RM 0.00</span>
                </div>
                <div class="detail-row">
                    <span>Distance Fare</span>
                    <span id="calc-ride-distance-rate">RM 0.00</span>
                </div>
                <div class="detail-row">
                    <span>PLUS Tolls (Est.)</span>
                    <span id="calc-tolls">RM 0.00</span>
                </div>
                <div class="detail-row">
                    <span>Traffic Adjust & Incentive</span>
                    <span id="calc-incentive">RM 0.00</span>
                </div>
                
                <div class="detail-row" id="deadhead-km-row" style="display: none;">
                    <span>Out-of-Zone Surcharge</span>
                    <span id="calc-deadhead-km">RM 0.00</span>
                </div>

                <div class="detail-row total-bold">
                    <span>Rounded Final Total</span>
                    <span id="calc-grand" style="color: #b388ff;">RM 0.00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Initialize map focused strictly on Peninsular Malaysia economic core (Klang Valley)
    const map = L.map('map').setView([3.1390, 101.6869], 11);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let pickupMarker = null, dropoffMarker = null, routeLine = null;
    let pickupCoords = null, dropoffCoords = null;
    let currentRouteTimeout = null;
    
    // Tracks which input field should be targeted when the map is clicked
    let activeInputFieldId = 'pickup';

    // Highlight input box borders subtly to prioritize current active target element
    const pickupInput = document.getElementById('pickup');
    const dropoffInput = document.getElementById('dropoff');

    pickupInput.addEventListener('focus', () => activeInputFieldId = 'pickup');
    dropoffInput.addEventListener('focus', () => activeInputFieldId = 'dropoff');

    // Autocomplete Core Pipelines
    setupAutocomplete('pickup', 'pickup-suggestions', 'clear-pickup', (coords) => {
        pickupCoords = coords;
        updateMarker('pickup', coords);
        checkAndProcessRoute();
    }, () => {
        pickupCoords = null;
        if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
        resetCalculationDisplay();
    });

    setupAutocomplete('dropoff', 'dropoff-suggestions', 'clear-dropoff', (coords) => {
        dropoffCoords = coords;
        updateMarker('dropoff', coords);
        checkAndProcessRoute();
    }, () => {
        dropoffCoords = null;
        if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
        resetCalculationDisplay();
    });

    // --- REVERSE GEOCODING SUBSYSTEM ---
    map.on('click', function(e) {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;
        
        // Render immediate local fallback string while performing remote asset handshakes
        const targetInput = document.getElementById(activeInputFieldId);
        const targetClearBtn = document.getElementById(activeInputFieldId === 'pickup' ? 'clear-pickup' : 'clear-dropoff');
        
        targetInput.value = `📍 Coordinates (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
        targetClearBtn.style.display = 'block';

        const selectedCoords = { lat, lon };
        if (activeInputFieldId === 'pickup') {
            pickupCoords = selectedCoords;
            updateMarker('pickup', selectedCoords);
        } else {
            dropoffCoords = selectedCoords;
            updateMarker('dropoff', selectedCoords);
        }
        
        checkAndProcessRoute();

        // Query Photon Geocoding API Reverse Address Matching Subsystem
        const reverseUrl = `https://photon.komoot.io/api/reverse/?lon=${lon}&lat=${lat}`;
        
        fetch(reverseUrl)
            .then(res => res.json())
            .then(data => {
                if (data.features && data.features.length > 0) {
                    const props = data.features[0].properties;
                    const addressString = expandAddress(props);
                    targetInput.value = props.name || addressString;
                }
            })
            .catch(err => {
                console.error("Reverse Address Parsing Exception Code:", err);
                // Keep the coordinate string safely if lookup fails/times out
            });

        // Toggle active targeting focus logic for faster mobile workflows
        if (activeInputFieldId === 'pickup' && !dropoffCoords) {
            activeInputFieldId = 'dropoff';
            dropoffInput.focus();
        }
    });

    // Hardware GPS Location Capture Engine
    document.getElementById('current-loc-btn').addEventListener('click', () => {
        if (!navigator.geolocation) {
            showError("Geolocation capture infrastructure is unsupported by this client architecture.");
            return;
        }

        const btn = document.getElementById('current-loc-btn');
        btn.textContent = "⏳";
        document.getElementById('error-msg').style.display = 'none';

        navigator.geolocation.getCurrentPosition(
            (position) => {
                btn.textContent = "🎯";
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                pickupCoords = { lat, lon };
                document.getElementById('pickup').value = `Current Location (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                document.getElementById('clear-pickup').style.display = 'block';
                
                updateMarker('pickup', pickupCoords);
                map.setView([lat, lon], 14);
                checkAndProcessRoute();
                
                // Shift focus down to destination target element automatically
                activeInputFieldId = 'dropoff';
            },
            (error) => {
                btn.textContent = "🎯";
                showError("Unable to safely resolve client coordinate trace positioning vectors.");
                console.error("GPS Core Fault Exception:", error);
            },
            { enableHighAccuracy: true, timeout: 8000 }
        );
    });

    function updateMarker(type, coords) {
        if (type === 'pickup') {
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker([coords.lat, coords.lon]).addTo(map);
        } else {
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            dropoffMarker = L.marker([coords.lat, coords.lon]).addTo(map);
        }
    }

    function executeLocationSwap() {
        const tempText = pickupInput.value;
        const tempCoords = pickupCoords;
        
        pickupInput.value = dropoffInput.value;
        pickupCoords = dropoffCoords;
        
        dropoffInput.value = tempText;
        dropoffCoords = tempCoords;
        
        document.getElementById('clear-pickup').style.display = pickupInput.value ? 'block' : 'none';
        document.getElementById('clear-dropoff').style.display = dropoffInput.value ? 'block' : 'none';
        
        if (pickupCoords) updateMarker('pickup', pickupCoords);
        else if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
        
        if (dropoffCoords) updateMarker('dropoff', dropoffCoords);
        else if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
        
        if (pickupCoords && dropoffCoords) {
            checkAndProcessRoute();
        } else {
            resetCalculationDisplay();
        }
    }

    function expandAddress(props) {
        const parts = [];
        if (props.name) parts.push(props.name);
        if (props.street) parts.push(props.street);
        if (props.district) parts.push(props.district);
        if (props.city || props.town) parts.push(props.city || props.town);
        if (props.state) parts.push(props.state);
        return parts.length > 0 ? parts.join(', ') : 'Target Location Coordinates';
    }

    function resetCalculationDisplay() {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-msg');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        document.getElementById('result-card').style.display = 'none';
    }

    function setupAutocomplete(inputId, suggestionsId, clearBtnId, onSelect, onClear) {
        const input = document.getElementById(inputId);
        const suggestionsBox = document.getElementById(suggestionsId);
        const clearBtn = document.getElementById(clearBtnId);
        let debounceTimeout;

        input.addEventListener('input', () => {
            clearTimeout(debounceTimeout);
            const query = input.value.trim();
            
            clearBtn.style.display = query.length > 0 ? 'block' : 'none';

            if (query.length < 3) { 
                suggestionsBox.innerHTML = ''; 
                suggestionsBox.style.display = 'none';
                return; 
            }

            debounceTimeout = setTimeout(() => {
                const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=99.6,0.8,119.5,7.4&limit=5`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        suggestionsBox.innerHTML = '';
                        if(!data.features || data.features.length === 0) {
                            suggestionsBox.style.display = 'none';
                            return;
                        }
                        suggestionsBox.style.display = 'block';
                        data.features.forEach(feature => {
                            const props = feature.properties;
                            const detailedAddress = expandAddress(props);
                            
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.textContent = detailedAddress;
                            div.addEventListener('click', () => {
                                input.value = props.name || detailedAddress;
                                suggestionsBox.innerHTML = '';
                                suggestionsBox.style.display = 'none';
                                const [lon, lat] = feature.geometry.coordinates;
                                onSelect({ lat, lon });
                            });
                            suggestionsBox.appendChild(div);
                        });
                    }).catch(err => console.error("Geocoding Parsing Fault:", err));
            }, 350);
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.style.display = 'none';
            suggestionsBox.innerHTML = '';
            suggestionsBox.style.display = 'none';
            onClear();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                input.blur();
                const query = input.value.trim();
                if (query.length >= 3) {
                    const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=99.6,0.8,119.5,7.4&limit=1`;
                    fetch(url).then(res => res.json()).then(data => {
                        if (data.features && data.features.length > 0) {
                            const feature = data.features[0];
                            input.value = feature.properties.name || expandAddress(feature.properties);
                            suggestionsBox.innerHTML = '';
                            suggestionsBox.style.display = 'none';
                            const [lon, lat] = feature.geometry.coordinates;
                            onSelect({ lat, lon });
                        }
                    }).catch(err => console.error(err));
                }
            }
        });
    }

    function checkAndProcessRoute() {
        if (!pickupCoords || !dropoffCoords) return;
        
        document.getElementById('error-msg').style.display = 'none';
        if(currentRouteTimeout) clearTimeout(currentRouteTimeout);
        
        currentRouteTimeout = setTimeout(() => {
            const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords.lon},${pickupCoords.lat};${dropoffCoords.lon},${dropoffCoords.lat}?overview=full&geometries=geojson`;

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('OSRM routing trace link dropped.');
                    return res.json();
                })
                .then(data => {
                    if (!data.routes || data.routes.length === 0) {
                        showError("No valid drivable geometry found matching those vectors.");
                        return;
                    }

                    const route = data.routes[0];
                    const distanceKm = route.distance / 1000;
                    const baseDurationMins = route.duration / 60;

                    // --- TRAFFIC SIMULATION CORE LOGIC ---
                    const now = new Date();
                    const currentHour = now.getHours();
                    const isWeekend = (now.getDay() === 0 || now.getDay() === 6);

                    let trafficDelayFactor = 1.15; 

                    if (!isWeekend) {
                        if ((currentHour >= 7 && currentHour <= 9) || (currentHour >= 17 && currentHour <= 19.5)) {
                            trafficDelayFactor = 1.55; 
                        } else if (currentHour >= 12 && currentHour <= 14) {
                            trafficDelayFactor = 1.25; 
                        }
                    } else {
                        if (currentHour >= 16 && currentHour <= 21) {
                            trafficDelayFactor = 1.35; 
                        }
                    }

                    let distanceImpactModifier = 1.0;
                    if (distanceKm <= 5) {
                        distanceImpactModifier = 0.65; 
                    } else if (distanceKm <= 15) {
                        distanceImpactModifier = 0.85;
                    }

                    const localizedTrafficWeight = 1 + ((trafficDelayFactor - 1) * distanceImpactModifier);
                    const correctedDurationMins = Math.max(1, Math.round(baseDurationMins * localizedTrafficWeight));

                    if (routeLine) map.removeLayer(routeLine);
                    
                    routeLine = L.geoJSON(route.geometry, { 
                        style: { color: '#8e24aa', weight: 5, opacity: 0.85 } 
                    }).addTo(map);
                    
                    map.fitBounds(L.latLngBounds([pickupCoords.lat, pickupCoords.lon], [dropoffCoords.lat, dropoffCoords.lon]), { 
                        padding: [40, 40] 
                    });

                    processCalculations(distanceKm, correctedDurationMins);
                })
                .catch(err => {
                    console.error(err);
                    showError("Routing link dropped or latency limit triggered.");
                });
        }, 200);
    }

    function formatDuration(totalMins) {
        if (totalMins < 60) return `${totalMins} mins`;
        const hours = Math.floor(totalMins / 60);
        const mins = totalMins % 60;
        return mins > 0 ? `${hours} hr ${mins} mins` : `${hours} hr`;
    }

    function roundToMalaysianCents(value) {
        return Math.round(value * 10) / 10;
    }

    function processCalculations(distance, duration) {
        const baseFare = 5.00;
        const perKmRate = 1.25;
        const rideDistanceFare = distance * perKmRate;
        
        let dynamicTolls = 0;
        if (distance > 6) {
            dynamicTolls = distance <= 45 ? 2.50 : 3.50 + ((distance - 45) * 0.095);
        }

        const driverIncentive = (duration / 60) * 15.00;

        let deadheadCost = 0;
        if (distance > 12) {
            const boundaryKm = Math.min(distance, 350);
            const dynamicScalePct = ((boundaryKm - 12) / (350 - 12)) * 0.45;
            deadheadCost = rideDistanceFare * dynamicScalePct;
            document.getElementById('deadhead-km-row').style.display = 'flex';
        } else {
            document.getElementById('deadhead-km-row').style.display = 'none';
        }

        const rawTotal = baseFare + rideDistanceFare + dynamicTolls + driverIncentive + deadheadCost;
        const roundedTotal = Math.max(baseFare, roundToMalaysianCents(rawTotal));
        const finalDisplayedWholeFare = Math.round(roundedTotal);

        document.getElementById('total-fare').textContent = `RM ${finalDisplayedWholeFare}`;
        document.getElementById('fare-distance').textContent = `${distance.toFixed(1)} km`;
        document.getElementById('fare-duration').textContent = formatDuration(duration);

        document.getElementById('calc-base-fare').textContent = `RM ${baseFare.toFixed(2)}`;
        document.getElementById('calc-ride-distance-rate').textContent = `RM ${rideDistanceFare.toFixed(2)}`;
        document.getElementById('calc-tolls').textContent = `RM ${dynamicTolls.toFixed(2)}`;
        document.getElementById('calc-incentive').textContent = `RM ${driverIncentive.toFixed(2)}`;
        document.getElementById('calc-deadhead-km').textContent = `RM ${deadheadCost.toFixed(2)}`;
        document.getElementById('calc-grand').textContent = `RM ${roundedTotal.toFixed(2)}`;

        document.getElementById('result-card').style.display = 'block';
    }

    // Modal invoice display block toggle
    function toggleInvoice() {
        const details = document.getElementById('invoice-details');
        const lbl = document.getElementById('toggle-lbl');
        if (details.style.display === 'none' || !details.style.display) {
            details.style.display = 'block';
            lbl.textContent = 'Hide';
        } else {
            details.style.display = 'none';
            lbl.textContent = 'Details';
        }
    }
</script>
</body>
</html>
