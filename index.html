<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.4.1 PRO</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --whatsapp: #25D366;
            --copy: #6b7280;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
            --pickup-blue: #3b82f6;
            --dropoff-red: #ef4444;
            --long-haul: #8b5cf6;
            --terrain: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .search-panel {
            background: var(--card-bg);
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 1005;
            border-bottom: 1px solid #e5e7eb;
            position: relative;
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--gray-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Improved Loading Animation */
        .input-group.loading::after {
            content: "";
            position: absolute;
            right: 95px;
            top: 32px;
            width: 14px;
            height: 14px;
            border: 2px solid #e5e7eb;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        input {
            width: 100%;
            padding: 12px 90px 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            background: #f9fafb;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
        }

        .btn-container {
            position: absolute;
            right: 8px;
            top: 24px;
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 18px;
            color: #9ca3af;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            z-index: 9999;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 1px solid #e5e7eb;
            margin-top: 2px;
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }

        .autocomplete-item:hover { background: #f9fafb; }
        .loc-name { font-weight: 700; font-size: 13px; display: block; color: #111; }
        .loc-addr { font-size: 11px; color: var(--gray-text); }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .swap-container { position: absolute; right: 24px; top: 76px; z-index: 1006; }
        .swap-btn {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .results-card {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            z-index: 1002;
            display: none;
        }

        #fare { font-size: 34px; font-weight: 800; color: var(--primary); margin: 0; }

        .mode-badge {
            background:#ecfdf5;
            color:var(--primary);
            padding:6px 12px;
            border-radius:30px;
            font-size:11px;
            font-weight:700;
        }

        .mode-badge.midnight { background: #1e293b; color: #f8fafc; }
        .mode-badge.long-haul { background: #f5f3ff; color: var(--long-haul); }
        .mode-badge.terrain { background: #fffbeb; color: var(--terrain); }

        .fare-breakdown {
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.7;
            color: #4b5563;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 4px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 12px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-wa { background: var(--whatsapp); }
        .btn-nav { background: #3b82f6; }
        .btn-copy { background: var(--copy); }

        #loading-state { text-align: center; padding: 10px; color: var(--primary); font-weight: 600; display: none; }

        .marker-label {
            background: white;
            border: 2px solid black;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="input-group" id="pickup-group">
        <label>Pickup Location</label>
        <input type="text" id="pickup" placeholder="Search for pickup..." autocomplete="off">
        <div class="btn-container">
            <button class="icon-btn" id="clear-pickup" style="display:none">✕</button>
            <button class="icon-btn" id="gps-trigger">📍</button>
        </div>
        <div id="pickup-results" class="autocomplete-list"></div>
    </div>

    <div class="swap-container">
        <button class="swap-btn" id="swap-btn">⇅</button>
    </div>

    <div class="input-group" id="dropoff-group">
        <label>Destination</label>
        <input type="text" id="dropoff" placeholder="Search for destination..." autocomplete="off">
        <div class="btn-container">
            <button class="icon-btn" id="clear-dropoff" style="display:none">✕</button>
        </div>
        <div id="dropoff-results" class="autocomplete-list"></div>
    </div>

    <div class="input-group" style="margin-bottom:0;">
        <label>Travel Schedule</label>
        <input type="datetime-local" id="departure-time">
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div id="loading-state">Updating Fare...</div>
    <div id="fare-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 id="fare">RM 0</h2>
            <span id="mode-badge" class="mode-badge">Standard Rate</span>
        </div>
        <div class="fare-breakdown">
            📏 <b id="distance">0 km</b> | ⏱️ <b id="eta">0 min</b><br>
            🚧 Toll: <b id="toll">RM 0</b> (Est.) | ✨ Sur: <b id="surcharge-txt">RM 0</b>
            <span id="terrain-row" style="display:none"><br>⛰️ Terrain Fee: <b>RM 20.00</b></span>
        </div>
        <div class="btn-group">
            <a id="wa-btn" class="btn btn-wa" target="_blank">WhatsApp</a>
            <button id="copy-btn" class="btn btn-copy">Copy Text</button>
            <div id="nav-btn" class="btn btn-nav">Directions</div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const CONFIG = {
    WHATSAPP: "60108988182",
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    CENTER: [4.2105, 101.9758],
    ZOOM: 7,
    DEMAND: {
        HIGH: ["klia", "airport", "sentral", "trx", "klcc", "genting", "legoland", "southkey", "118", "pavilion", "mid valley", "sunway"],
        MID: ["hotel", "resort", "mall", "parade", "heritage", "waterfront", "jetty", "beach", "stadium", "central", "city centre"]
    },
    TERRAIN: {
        KEYWORDS: ["genting", "cameron", "fraser", "bukit tinggi", "kundasang", "highland"],
        FEE: 20.00
    },
    RATES: {
        BASE_BOOKING: 5.00,
        TIER1_KM: 1.25,
        TIER2_KM: 1.10,
        TIER3_KM: 1.00,
        TOLL_PER_KM: 0.09, // Adjusted for typical PLUS/ELITE averages
        AIRPORT_SURCHARGE: 5.00, // Reduced to prevent double-charging with tolls
        GENTING_SURCHARGE: 12.00,
        MIDNIGHT_SURCHARGE: 1.50
    }
};

const iconA = L.divIcon({ className: 'custom-div-icon', html: `<div class="marker-label" style="border-color:var(--pickup-blue); color:var(--pickup-blue);">A</div>`, iconSize: [24,24], iconAnchor: [12,12] });
const iconB = L.divIcon({ className: 'custom-div-icon', html: `<div class="marker-label" style="border-color:var(--dropoff-red); color:var(--dropoff-red);">B</div>`, iconSize: [24,24], iconAnchor: [12,12] });

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, routeLayer, pickupMarker, dropoffMarker, searchTimer, lastSummaryText = "";

const map = L.map("map", { zoomControl: false, attributionControl: false, preferCanvas: true }).setView(CONFIG.CENTER, CONFIG.ZOOM);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
$("departure-time").value = now.toISOString().slice(0,16);

function formatDuration(totalMinutes) {
    const hrs = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;
    return hrs > 0 ? `${hrs}h ${mins}m` : `${totalMinutes} min`;
}

async function searchPlaces(query, resultId, type) {
    const list = $(resultId);
    const group = $(`${type}-group`);
    $(`clear-${type}`).style.display = query.length > 0 ? 'flex' : 'none';
    clearTimeout(searchTimer);
    if (query.length < 3) { list.style.display = 'none'; group.classList.remove('loading'); return; }
    group.classList.add('loading');
    searchTimer = setTimeout(async () => {
        try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&countrycode=MY&limit=6`);
            const data = await res.json();
            renderResults(data.features, resultId, type);
        } catch (e) { console.error(e); } finally { group.classList.remove('loading'); }
    }, 550);
}

function renderResults(features, resultId, type) {
    const list = $(resultId);
    if (!features || !features.length) { list.style.display = 'none'; return; }
    list.innerHTML = features.map(f => {
        const p = f.properties;
        const name = p.name || 'Unknown';
        const addr = [p.street, p.district, p.city, p.state].filter(Boolean).join(', ');
        const lat = f.geometry.coordinates[1];
        const lng = f.geometry.coordinates[0];
        return `<div class="autocomplete-item" onclick="selectLoc('${type}', [${lat}, ${lng}], '${name.replace(/'/g, "")}')">
            <span class="loc-name">${name}</span><span class="loc-addr">${addr || 'Malaysia'}</span></div>`;
    }).join('');
    list.style.display = 'block';
}

function selectLoc(type, coord, label) {
    $(type).value = label;
    $(`${type}-results`).style.display = 'none';
    $(`clear-${type}`).style.display = 'flex';
    if (type === 'pickup') {
        if (pickupMarker) pickupMarker.setLatLng(coord);
        else pickupMarker = L.marker(coord, { icon: iconA }).addTo(map);
        pickupCoord = coord;
    } else {
        if (dropoffMarker) dropoffMarker.setLatLng(coord);
        else dropoffMarker = L.marker(coord, { icon: iconB }).addTo(map);
        dropoffCoord = coord;
    }
    if (pickupCoord && dropoffCoord) calculate();
    else map.setView(coord, 15);
}

async function calculate() {
    if (!pickupCoord || !dropoffCoord) return;
    $("results").style.display = 'block';
    $("fare-content").style.opacity = "0.4";
    $("loading-state").style.display = 'block';

    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]], extra_info: ["tollways"] })
        });

        const data = await res.json();
        const route = data.routes[0];
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), { color: '#059669', weight: 6 }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [80,80] });

        const km = route.summary.distance / 1000;
        const actualEta = Math.ceil(route.summary.duration / 60);
        const dateObj = new Date($("departure-time").value);
        const hour = dateObj.getHours();
        const locText = ($("pickup").value + $("dropoff").value).toLowerCase();

        // 1. TIERED KM CALCULATION
        let distanceFare = km <= 20 ? km * CONFIG.RATES.TIER1_KM : 
                           km <= 80 ? (20 * CONFIG.RATES.TIER1_KM) + ((km - 20) * CONFIG.RATES.TIER2_KM) :
                           (20 * CONFIG.RATES.TIER1_KM) + (60 * CONFIG.RATES.TIER2_KM) + ((km - 80) * CONFIG.RATES.TIER3_KM);

        // 2. SURCHARGES & DEMAND
        let terrainFee = CONFIG.TERRAIN.KEYWORDS.some(k => locText.includes(k)) ? CONFIG.TERRAIN.FEE : 0;
        let isHigh = CONFIG.DEMAND.HIGH.some(k => locText.includes(k));
        let isMid = CONFIG.DEMAND.MID.some(k => locText.includes(k));
        let isPeak = (hour >= 6 && hour < 9) || (hour >= 17 && hour < 21);
        let isMidnight = (hour >= 0 && hour < 6);

        let demandMultiplier = isHigh ? 1.8 : (isMid || isPeak ? 1.4 : 1.0);
        if (km > 100) demandMultiplier = Math.min(demandMultiplier, 1.25);

        // 3. INTELLIGENT TOLL CALCULATION (Fixes RM 13.41 issue)
        let estTolls = 0;
        if (route.extras?.tollways) {
            const ts = route.extras.tollways.summary.find(s => s.value === 1);
            if (ts) {
                let tollDistance = ts.distance / 1000;
                // FIX: Route-specific toll override for ELITE highway to KLIA
                if (locText.includes("klia")) {
                    estTolls = 5.50; 
                } else {
                    estTolls = tollDistance * CONFIG.RATES.TOLL_PER_KM;
                }
            }
        }
        
        // Add Airport Entry/Genting Gate surcharges
        if (locText.includes("klia")) estTolls += CONFIG.RATES.AIRPORT_SURCHARGE;
        if (locText.includes("genting")) estTolls += CONFIG.RATES.GENTING_SURCHARGE;

        // 4. FINAL ASSEMBLY
        let subtotal = (CONFIG.RATES.BASE_BOOKING + distanceFare) * demandMultiplier;
        const baselineMins = (km / 35) * 60; 
        let trafficSurcharge = (actualEta > baselineMins) ? (actualEta - baselineMins) * 0.20 : 0;

        let total = subtotal + trafficSurcharge + terrainFee + estTolls;
        if (isMidnight) total *= CONFIG.RATES.MIDNIGHT_SURCHARGE;

        const finalFare = Math.round(total);
        const badge = $("mode-badge");
        badge.className = "mode-badge";
        let label = "Standard Rate";

        if (isMidnight) { label = "Midnight (50% Extra)"; badge.classList.add('midnight'); }
        else if (terrainFee > 0) { label = "Highland / Terrain"; badge.classList.add('terrain'); }
        else if (km >= 80) { label = "Inter-State / Long Haul"; badge.classList.add('long-haul'); }
        else if (isHigh) label = "High Demand Zone";

        $("fare").innerText = `RM ${finalFare}`;
        $("distance").innerText = `${km.toFixed(1)} km`;
        $("eta").innerText = formatDuration(actualEta);
        $("toll").innerText = `RM ${estTolls.toFixed(2)}`;
        $("surcharge-txt").innerText = `RM ${(trafficSurcharge + terrainFee).toFixed(2)}`;
        $("terrain-row").style.display = terrainFee > 0 ? 'block' : 'none';
        badge.innerText = label;

        lastSummaryText = `🚖 *RIDE BOOKING (v5.4.1 PRO)*\n--------------------------\n📍 *From:* ${$("pickup").value}\n🏁 *To:* ${$("dropoff").value}\n⏰ *Time:* ${dateObj.toLocaleString()}\n\n📊 *Details:*\n• Distance: ${km.toFixed(1)} km\n• Rate Type: ${label}\n• Tolls (Est): RM ${estTolls.toFixed(2)}\n💰 *TOTAL FARE: RM ${finalFare}*\n--------------------------`;
        $("wa-btn").href = `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(lastSummaryText)}`;
        $("nav-btn").onclick = () => window.location.href = `google.navigation:q=${dropoffCoord[0]},${dropoffCoord[1]}`;
        
        $("fare-content").style.opacity = "1";
        $("loading-state").style.display = 'none';
    } catch (e) { 
        console.error(e);
        $("loading-state").innerText = "Route unavailable."; 
    }
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    const len = str.length;
    while (index < len) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

function resetField(type) {
    $(type).value = '';
    $(`clear-${type}`).style.display = 'none';
    if (type === 'pickup') { if (pickupMarker) map.removeLayer(pickupMarker); pickupCoord = null; }
    else { if (dropoffMarker) map.removeLayer(dropoffMarker); dropoffCoord = null; }
    if (routeLayer) map.removeLayer(routeLayer);
    $("results").style.display = 'none';
}

$("pickup").oninput = e => searchPlaces(e.target.value, "pickup-results", "pickup");
$("dropoff").oninput = e => searchPlaces(e.target.value, "dropoff-results", "dropoff");
$("clear-pickup").onclick = () => resetField('pickup');
$("clear-dropoff").onclick = () => resetField('dropoff');
$("swap-btn").onclick = () => {
    const v1 = $("pickup").value, v2 = $("dropoff").value, c1 = pickupCoord, c2 = dropoffCoord;
    $("pickup").value = v2; $("dropoff").value = v1;
    pickupCoord = c2; dropoffCoord = c1;
    if (pickupCoord && dropoffCoord) calculate();
};
$("copy-btn").onclick = () => {
    navigator.clipboard.writeText(lastSummaryText.replace(/\*/g, '')).then(() => {
        $("copy-btn").innerText = "Copied!";
        setTimeout(() => $("copy-btn").innerText = "Copy Text", 2000);
    });
};

$("gps-trigger").onclick = () => {
    const group = $("pickup-group");
    group.classList.add('loading');
    navigator.geolocation.getCurrentPosition(async p => {
        const lat = p.coords.latitude, lon = p.coords.longitude;
        try {
            const res = await fetch(`https://photon.komoot.io/reverse?lon=${lon}&lat=${lat}`);
            const data = await res.json();
            if (data.features && data.features.length > 0) {
                const f = data.features[0].properties;
                const addr = [f.name, f.street, f.district, f.city, f.state].filter(Boolean).join(', ');
                selectLoc('pickup', [lat, lon], addr);
            } else {
                selectLoc('pickup', [lat, lon], "Dropped Pin Location");
            }
        } catch (e) {
            selectLoc('pickup', [lat, lon], "My Location");
        } finally {
            group.classList.remove('loading');
        }
    }, () => group.classList.remove('loading'));
};
</script>
</body>
</html>
