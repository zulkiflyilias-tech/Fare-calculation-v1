<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Rideshare MY - Pro Fare Estimator & Smart Toll Registry</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; 
            color: #212529;
        }
        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        #map {
            height: 33vh; 
            width: 100%;
            z-index: 1;
        }
        #search-panel {
            flex: 1;
            background: white;
            padding: 16px 16px 32px 16px; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            z-index: 10;
            box-sizing: border-box;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; 
        }
        
        .routing-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
            margin-top: 8px;
        }
        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 12px 64px 12px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f9f9f9;
            transition: all 0.2s ease;
        }
        #pickup {
            padding-right: 88px;
        }
        input:focus {
            outline: none;
            border-color: #8e24aa;
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(142, 36, 170, 0.1);
        }
        
        .action-group {
            position: absolute;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 5;
        }
        .icon-btn {
            border: none;
            background: none;
            color: #757575;
            font-size: 14px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .icon-btn:hover {
            background-color: #f0f0f0;
            color: #8e24aa;
        }
        .clear-btn {
            display: none;
            font-size: 18px;
            color: #aaa;
        }
        
        .swap-container {
            position: absolute;
            right: 48px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 15;
        }
        .swap-btn {
            background: white;
            border: 1px solid #e0e0e0;
            color: #8e24aa;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
            font-size: 14px;
        }
        .swap-btn:hover {
            transform: scale(1.1) translateY(-50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background-color: #fcf5ff;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            max-height: 180px; 
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            display: none;
        }
        .suggestion-item {
            padding: 12px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.4;
            border-bottom: 1px solid #f5f5f5;
        }
        .suggestion-item:hover {
            background-color: #f5f5f5;
        }
        
        #result-card {
            background: #1c1c1e;
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-top: 8px;
            margin-bottom: 16px; 
            display: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #result-card:hover {
            background: #2c2c2e;
        }
        .fare-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .fare-left-col {
            display: flex;
            flex-direction: column;
        }
        .fare-header {
            font-size: 42px;
            font-weight: 900;
            color: #39ff14; 
            line-height: 1.0;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            transition: transform 0.1s ease;
        }
        .fare-right-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .meta-distance {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }
        .meta-duration {
            font-size: 14px;
            font-weight: 500;
            color: #aeaeb2;
        }
        #invoice-details {
            margin-top: 12px;
            border-top: 1px dashed #3a3a3c;
            padding-top: 12px;
            display: none;
            transition: display 0.2s;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 15px; 
            color: #aeaeb2;
            margin-bottom: 8px;
            align-items: center;
        }
        .detail-row.total-bold {
            color: #fff;
            font-weight: 600;
            border-top: 1px solid #2c2c2e;
            padding-top: 10px;
            margin-bottom: 0;
            font-size: 16px;
        }
        .exclude-toggle {
            background: rgba(255,255,255,0.12);
            border: none;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: #ff9f4a;
            transition: all 0.2s;
            margin-left: 10px;
        }
        .exclude-toggle.excluded {
            color: #ff3b30;
            background: rgba(255,59,48,0.2);
        }
        .exclude-toggle.included {
            color: #34c759;
            background: rgba(52,199,89,0.15);
        }
        .toll-manual-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .toll-manual-input {
            background: #2c2c2e;
            border: 1px solid #48484a;
            border-radius: 12px;
            padding: 5px 8px;
            width: 85px;
            color: white;
            font-size: 13px;
            text-align: right;
        }
        .toll-manual-input:focus {
            outline: none;
            border-color: #39ff14;
        }
        .toll-badge {
            font-size: 11px;
            background: #3a3a3c;
            padding: 2px 8px;
            border-radius: 30px;
            color: #ddd;
        }
        .manual-toll-apply {
            background: none;
            border: 1px solid #8e24aa;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            color: #c084fc;
            cursor: pointer;
        }
        .reset-toll-btn {
            background: none;
            border: none;
            color: #ff9f4a;
            font-size: 12px;
            cursor: pointer;
        }
        .invoice-controls {
            margin-bottom: 10px;
            text-align: right;
        }
        #error-msg {
            color: #ff3b30;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        /* hint text */
        .tap-hint {
            font-size: 12px;
            color: #aeaeb2;
            text-align: right;
            margin-top: 6px;
            letter-spacing: 0.3px;
            display: block;
        }

        @media(min-width: 768px) {
            #container {
                flex-direction: row-reverse;
            }
            #map {
                height: 100%;
                flex: 1;
            }
            #search-panel {
                width: 450px;
                height: 100%;
                border-radius: 0;
                box-shadow: -4px 0 20px rgba(0,0,0,0.05);
                padding: 24px 20px;
            }
            #result-card {
                margin-top: 12px;
                padding: 20px;
                margin-bottom: 0;
            }
            .fare-header {
                font-size: 48px;
            }
            .meta-distance {
                font-size: 18px;
            }
            .meta-duration {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div id="container">
    <div id="map"></div>
    
    <div id="search-panel">
        <div class="routing-wrapper">
            <div class="input-container">
                <input type="text" id="pickup" placeholder="Enter Pickup Location..." autocomplete="off" enterkeyhint="search">
                <div class="action-group">
                    <button class="icon-btn" id="current-loc-btn" title="Use current location">🎯</button>
                    <button class="icon-btn clear-btn" id="clear-pickup">&times;</button>
                </div>
                <div id="pickup-suggestions" class="suggestions"></div>
            </div>
            
            <div class="swap-container">
                <button class="swap-btn" id="swap-locations-btn" title="Swap locations">⇅</button>
            </div>
            
            <div class="input-container">
                <input type="text" id="dropoff" placeholder="Enter Drop-off Location..." autocomplete="off" enterkeyhint="search">
                <div class="action-group">
                    <button class="icon-btn clear-btn" id="clear-dropoff">&times;</button>
                </div>
                <div id="dropoff-suggestions" class="suggestions"></div>
            </div>
        </div>

        <div id="error-msg"></div>

        <div id="result-card">
            <div class="fare-header-row">
                <div class="fare-left-col">
                    <div id="total-fare" class="fare-header">RM --</div>
                </div>
                <div class="fare-right-col">
                    <span id="fare-distance" class="meta-distance">0 km</span>
                    <span id="fare-duration" class="meta-duration">0 mins</span>
                </div>
            </div>
            <div class="tap-hint" id="tapHint">👇 Tap fare card to show/hide invoice</div>
            
            <div id="invoice-details">
                <div class="invoice-controls">
                    <span class="toll-badge" style="background:#2c2c2e;">✍️ Manual toll entry active</span>
                </div>
                <div class="detail-row" id="base-fare-row">
                    <span>Base Fare <button class="exclude-toggle included" data-item="base">✓ Exclude</button></span>
                    <span id="calc-base-fare">RM 5.00</span>
                </div>
                <div class="detail-row" id="distance-fare-row">
                    <span>Distance Fare <button class="exclude-toggle included" data-item="distance">✓ Exclude</button></span>
                    <span id="calc-ride-distance-rate">RM 0.00</span>
                </div>
                <div class="detail-row" id="tolls-row">
                    <span>Tolls 
                        <div class="toll-manual-group" style="display: inline-flex; margin-left: 8px;">
                            <input type="number" id="manual-toll-input" step="0.1" placeholder="RM" class="toll-manual-input" value="">
                            <button id="apply-manual-toll" class="manual-toll-apply">Apply</button>
                            <button id="reset-auto-toll" class="reset-toll-btn">↺ Auto</button>
                        </div>
                        <button class="exclude-toggle included" data-item="tolls" id="toll-exclude-btn">✓ Exclude</button>
                    </span>
                    <span id="calc-tolls">RM 0.00</span>
                </div>
                <div class="detail-row" id="incentive-row">
                    <span>Traffic Adjust & Incentive <button class="exclude-toggle included" data-item="incentive">✓ Exclude</button></span>
                    <span id="calc-incentive">RM 0.00</span>
                </div>
                <div class="detail-row" id="deadhead-km-row">
                    <span>Out-of-Zone Surcharge <button class="exclude-toggle included" data-item="deadhead">✓ Exclude</button></span>
                    <span id="calc-deadhead-km">RM 0.00</span>
                </div>

                <div class="detail-row total-bold">
                    <span>Final Total (exclusions applied)</span>
                    <span id="calc-grand" style="color: #39ff14;">RM 0.00</span>
                </div>
                <div class="tap-hint" style="margin-top:6px; font-size:10px;">💡 Click ✓/Exclude to toggle item & recalc</div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map').setView([3.1390, 101.6869], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0="; 

    let pickupMarker = null, dropoffMarker = null, routeLine = null;
    let pickupCoords = null, dropoffCoords = null;
    let currentRouteTimeout = null;
    
    // State for invoice dynamic toggles & manual toll
    let excludedItems = new Set();   // 'base', 'distance', 'tolls', 'incentive', 'deadhead'
    let currentAutoToll = 0;
    let currentManualToll = null;    // null = use auto, otherwise number
    let lastRawComponents = {        // store latest calculated values
        baseFare: 5,
        rideDistanceFare: 0,
        autoToll: 0,
        driverIncentive: 0,
        deadheadCost: 0,
        distanceKm: 0,
        durationMins: 0
    };

    const REGIONAL_BOUNDS = {
        klangKapar: [3.00, 101.35, 3.18, 101.52],
        johorBahru: [1.40, 103.60, 1.60, 103.85],
        genting:     [3.35, 101.75, 3.45, 101.85],
        kelantan:   [5.90, 102.10, 6.30, 102.40],
        bangiKajang:[2.90, 101.70, 3.02, 101.85],
        puncakPerdana:[3.10, 101.45, 3.16, 101.55],
        klCenter:   [3.10, 101.65, 3.17, 101.75],
        damansara:  [3.11, 101.58, 3.17, 101.65],
        seremban:   [2.65, 101.85, 2.78, 102.00]
    };

    function inBoundingBox(coords, bbox) {
        if (!coords) return false;
        return coords.lat >= bbox[0] && coords.lon >= bbox[1] && coords.lat <= bbox[2] && coords.lon <= bbox[3];
    }

    // refresh final fare based on toggles & manual toll
    function refreshFinalFare() {
        let { baseFare, rideDistanceFare, autoToll, driverIncentive, deadheadCost } = lastRawComponents;
        let effectiveToll = (currentManualToll !== null) ? currentManualToll : autoToll;
        
        let sum = 0;
        if (!excludedItems.has('base')) sum += baseFare;
        if (!excludedItems.has('distance')) sum += rideDistanceFare;
        if (!excludedItems.has('tolls')) sum += effectiveToll;
        if (!excludedItems.has('incentive')) sum += driverIncentive;
        if (!excludedItems.has('deadhead')) sum += deadheadCost;
        
        const roundedTotal = Math.max(0, Math.round(sum * 10) / 10);
        const finalWhole = Math.round(roundedTotal);
        document.getElementById('total-fare').textContent = `RM ${finalWhole}`;
        document.getElementById('calc-grand').textContent = `RM ${roundedTotal.toFixed(2)}`;
        
        // update toll display line depending on manual vs auto
        const tollDisplaySpan = document.getElementById('calc-tolls');
        if (currentManualToll !== null) {
            tollDisplaySpan.textContent = `RM ${currentManualToll.toFixed(2)} (Manual)`;
        } else {
            tollDisplaySpan.textContent = `RM ${autoToll.toFixed(2)}`;
        }
        
        // Update toggle button text styles
        document.querySelectorAll('.exclude-toggle').forEach(btn => {
            const item = btn.getAttribute('data-item');
            if (excludedItems.has(item)) {
                btn.textContent = `✗ Excluded`;
                btn.classList.add('excluded');
                btn.classList.remove('included');
            } else {
                btn.textContent = `✓ Include`;
                btn.classList.add('included');
                btn.classList.remove('excluded');
            }
        });
        const tollExcludeBtn = document.getElementById('toll-exclude-btn');
        if (tollExcludeBtn) {
            if (excludedItems.has('tolls')) {
                tollExcludeBtn.textContent = `✗ Excluded`;
                tollExcludeBtn.classList.add('excluded');
                tollExcludeBtn.classList.remove('included');
            } else {
                tollExcludeBtn.textContent = `✓ Include`;
                tollExcludeBtn.classList.add('included');
                tollExcludeBtn.classList.remove('excluded');
            }
        }
    }
    
    function updateAllComponentDisplays() {
        const { baseFare, rideDistanceFare, autoToll, driverIncentive, deadheadCost, distanceKm, durationMins } = lastRawComponents;
        document.getElementById('calc-base-fare').textContent = `RM ${baseFare.toFixed(2)}`;
        document.getElementById('calc-ride-distance-rate').textContent = `RM ${rideDistanceFare.toFixed(2)}`;
        document.getElementById('calc-incentive').textContent = `RM ${driverIncentive.toFixed(2)}`;
        document.getElementById('calc-deadhead-km').textContent = `RM ${deadheadCost.toFixed(2)}`;
        document.getElementById('fare-distance').textContent = `${distanceKm.toFixed(1)} km`;
        document.getElementById('fare-duration').textContent = formatDuration(durationMins);
        // toll handled in refresh
        refreshFinalFare();
    }
    
    function computeTollFromRoute(distanceKm, routeHasTolls, pickupCoords, dropoffCoords) {
        const originInZone = (zoneKey) => inBoundingBox(pickupCoords, REGIONAL_BOUNDS[zoneKey]);
        const destInZone = (zoneKey) => inBoundingBox(dropoffCoords, REGIONAL_BOUNDS[zoneKey]);
        const matchRoute = (zoneA, zoneB) => (originInZone(zoneA) && destInZone(zoneB)) || (originInZone(zoneB) && destInZone(zoneA));
        if (matchRoute('klangKapar', 'johorBahru')) return 37.31;
        if (matchRoute('klangKapar', 'seremban')) return 9.30;
        if (matchRoute('puncakPerdana', 'klCenter')) return 5.00;
        if (matchRoute('klangKapar', 'damansara') || matchRoute('damansara', 'puncakPerdana')) return 2.30;
        if (matchRoute('klangKapar', 'genting')) return 12.10;
        if (matchRoute('klangKapar', 'kelantan')) return 24.30;
        if (matchRoute('klangKapar', 'bangiKajang')) return 6.91;
        if (routeHasTolls) return distanceKm <= 45 ? 2.50 : 3.50 + ((distanceKm - 45) * 0.095);
        return 0;
    }

    function formatDuration(totalMins) {
        if (totalMins < 60) return `${totalMins} mins`;
        const hours = Math.floor(totalMins / 60);
        const mins = totalMins % 60;
        return mins > 0 ? `${hours} hr ${mins} mins` : `${hours} hr`;
    }

    function processCalculations(distance, duration, routeHasTolls, fromRouteRefresh = true) {
        const baseFare = 5.00;
        const perKmRate = 1.25;
        const chargeableDistance = Math.max(0, distance - 1);
        const rideDistanceFare = chargeableDistance * perKmRate;
        
        let autoToll = computeTollFromRoute(distance, routeHasTolls, pickupCoords, dropoffCoords);
        if (autoToll < 0) autoToll = 0;
        currentAutoToll = autoToll;
        if (currentManualToll === null) {
            // no manual set, use auto
        } 
        const effectiveTollDisplay = (currentManualToll !== null) ? currentManualToll : autoToll;
        
        const driverIncentive = (duration / 60) * 12.00;
        let deadheadCost = 0;
        if (distance > 12) {
            const boundaryKm = Math.min(distance, 350);
            const dynamicScalePct = ((boundaryKm - 12) / (350 - 12)) * 0.45;
            deadheadCost = rideDistanceFare * dynamicScalePct;
        }
        
        lastRawComponents = {
            baseFare, rideDistanceFare, autoToll, driverIncentive, deadheadCost,
            distanceKm: distance, durationMins: duration
        };
        
        updateAllComponentDisplays();
        
        // show result card
        document.getElementById('result-card').style.display = 'block';
        const invoiceDiv = document.getElementById('invoice-details');
        invoiceDiv.style.display = 'none';
        document.getElementById('tapHint').style.display = 'block';
        
        // reset manual toll if flag not? Keep manual overrides, but if new route, optionally keep manual? user expectation: new route resets manual toll? Keep consistent but allow reset auto button.
        // However, to improve UX, we retain manual toll only if user explicitly applied before route? Fine.
        // But ensure manual toll input does not break.
        const manualInput = document.getElementById('manual-toll-input');
        if (manualInput) manualInput.value = '';
    }
    
    // apply manual toll
    function applyManualToll() {
        const inputVal = document.getElementById('manual-toll-input').value;
        if (inputVal === null || inputVal === '') {
            currentManualToll = null;
            refreshFinalFare();
            return;
        }
        let num = parseFloat(inputVal);
        if (isNaN(num)) num = 0;
        if (num < 0) num = 0;
        currentManualToll = num;
        refreshFinalFare();
    }
    
    function resetToAutoToll() {
        currentManualToll = null;
        document.getElementById('manual-toll-input').value = '';
        refreshFinalFare();
    }
    
    function setupExcludeButtons() {
        document.querySelectorAll('.exclude-toggle').forEach(btn => {
            btn.removeEventListener('click', handleExcludeClick);
            btn.addEventListener('click', handleExcludeClick);
        });
    }
    
    function handleExcludeClick(e) {
        e.stopPropagation();
        const item = this.getAttribute('data-item');
        if (excludedItems.has(item)) {
            excludedItems.delete(item);
        } else {
            excludedItems.add(item);
        }
        refreshFinalFare();
    }
    
    // autocomplete and routing (unchanged core, integrate toll manual hooks)
    setupAutocomplete('pickup', 'pickup-suggestions', 'clear-pickup', (coords) => {
        pickupCoords = coords;
        updateMarker('pickup', coords);
        checkAndProcessRoute();
    }, () => {
        pickupCoords = null;
        if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
        resetCalculationDisplay();
    });

    setupAutocomplete('dropoff', 'dropoff-suggestions', 'clear-dropoff', (coords) => {
        dropoffCoords = coords;
        updateMarker('dropoff', coords);
        checkAndProcessRoute();
    }, () => {
        dropoffCoords = null;
        if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
        resetCalculationDisplay();
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-container')) {
            document.getElementById('pickup-suggestions').style.display = 'none';
            document.getElementById('dropoff-suggestions').style.display = 'none';
        }
    });

    document.getElementById('swap-locations-btn').addEventListener('click', executeLocationSwap);
    document.getElementById('current-loc-btn').addEventListener('click', () => {
        if (!navigator.geolocation) {
            showError("Location not supported.");
            return;
        }
        const btn = document.getElementById('current-loc-btn');
        btn.textContent = "⏳";
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                pickupCoords = { lat, lon };
                updateMarker('pickup', pickupCoords);
                map.setView([lat, lon], 14);
                fetch(`https://photon.komoot.io/reverse?lon=${lon}&lat=${lat}`)
                    .then(res => res.json())
                    .then(data => {
                        btn.textContent = "🎯";
                        if (data.features && data.features.length) {
                            document.getElementById('pickup').value = expandAddress(data.features[0].properties);
                        } else {
                            document.getElementById('pickup').value = `Current Location (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                        }
                        document.getElementById('clear-pickup').style.display = 'block';
                        checkAndProcessRoute();
                    }).catch(() => {
                        btn.textContent = "🎯";
                        document.getElementById('pickup').value = `Current Location (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                        document.getElementById('clear-pickup').style.display = 'block';
                        checkAndProcessRoute();
                    });
            },
            () => {
                btn.textContent = "🎯";
                showError("Geolocation failed.");
            }
        );
    });

    function updateMarker(type, coords) {
        if (type === 'pickup') {
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker([coords.lat, coords.lon]).addTo(map);
        } else {
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            dropoffMarker = L.marker([coords.lat, coords.lon]).addTo(map);
        }
    }

    function executeLocationSwap() {
        const pickupInput = document.getElementById('pickup');
        const dropoffInput = document.getElementById('dropoff');
        const tempText = pickupInput.value;
        const tempCoords = pickupCoords;
        pickupInput.value = dropoffInput.value;
        pickupCoords = dropoffCoords;
        dropoffInput.value = tempText;
        dropoffCoords = tempCoords;
        document.getElementById('clear-pickup').style.display = pickupInput.value ? 'block' : 'none';
        document.getElementById('clear-dropoff').style.display = dropoffInput.value ? 'block' : 'none';
        if (pickupCoords) updateMarker('pickup', pickupCoords);
        else if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
        if (dropoffCoords) updateMarker('dropoff', dropoffCoords);
        else if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
        else resetCalculationDisplay();
    }

    function expandAddress(props) {
        const parts = [];
        if (props.name) parts.push(props.name);
        if (props.street) parts.push(props.street);
        if (props.district) parts.push(props.district);
        if (props.city || props.town) parts.push(props.city || props.town);
        if (props.state) parts.push(props.state);
        return parts.length > 0 ? parts.join(', ') : 'Location';
    }

    function resetCalculationDisplay() {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-msg');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        document.getElementById('result-card').style.display = 'none';
    }

    function setupAutocomplete(inputId, suggestionsId, clearBtnId, onSelect, onClear) {
        const input = document.getElementById(inputId);
        const suggestionsBox = document.getElementById(suggestionsId);
        const clearBtn = document.getElementById(clearBtnId);
        let debounceTimeout;
        input.addEventListener('input', () => {
            clearTimeout(debounceTimeout);
            const query = input.value.trim();
            clearBtn.style.display = query.length > 0 ? 'block' : 'none';
            if (query.length < 3) { suggestionsBox.innerHTML = ''; suggestionsBox.style.display = 'none'; return; }
            debounceTimeout = setTimeout(() => {
                const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=99.6,0.8,119.5,7.4&limit=5`;
                fetch(url).then(res => res.json()).then(data => {
                    suggestionsBox.innerHTML = '';
                    if(!data.features || data.features.length === 0) { suggestionsBox.style.display = 'none'; return; }
                    suggestionsBox.style.display = 'block';
                    data.features.forEach(feature => {
                        const addr = expandAddress(feature.properties);
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.textContent = addr;
                        div.addEventListener('click', () => {
                            input.value = feature.properties.name || addr;
                            suggestionsBox.innerHTML = '';
                            suggestionsBox.style.display = 'none';
                            const [lon, lat] = feature.geometry.coordinates;
                            onSelect({ lat, lon });
                        });
                        suggestionsBox.appendChild(div);
                    });
                }).catch(err => console.error(err));
            }, 350);
        });
        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.style.display = 'none';
            suggestionsBox.innerHTML = '';
            suggestionsBox.style.display = 'none';
            onClear();
        });
    }

    function checkAndProcessRoute() {
        if (!pickupCoords || !dropoffCoords) return;
        document.getElementById('error-msg').style.display = 'none';
        if(currentRouteTimeout) clearTimeout(currentRouteTimeout);
        currentRouteTimeout = setTimeout(() => {
            const url = `https://api.openrouteservice.org/v2/directions/driving-car?api_key=${ORS_API_KEY}&start=${pickupCoords.lon},${pickupCoords.lat}&end=${dropoffCoords.lon},${dropoffCoords.lat}&extra_info=tollways`;
            fetch(url).then(res => { if (!res.ok) throw new Error('Routing failed'); return res.json(); })
            .then(data => {
                if (!data.features || data.features.length === 0) throw new Error('No route');
                const feature = data.features[0];
                const summary = feature.properties.summary;
                const distanceKm = summary.distance / 1000;
                const baseDurationMins = summary.duration / 60;
                let routeHasTolls = false;
                const extras = feature.properties.extras;
                if (extras && extras.tollways && extras.tollways.values) {
                    routeHasTolls = extras.tollways.values.some(v => v[2] === 1);
                } else if (distanceKm > 50) routeHasTolls = true;
                const now = new Date();
                const hour = now.getHours();
                const isWeekend = (now.getDay() === 0 || now.getDay() === 6);
                let tf = 1.15;
                if (!isWeekend) { if ((hour>=7&&hour<=9)||(hour>=17&&hour<=19.5)) tf=1.55; else if (hour>=12&&hour<=14) tf=1.25; }
                else if (hour>=16 && hour<=21) tf=1.35;
                let dim = 1.0;
                if (distanceKm<=5) dim=0.65; else if (distanceKm<=15) dim=0.85; else if (distanceKm>100) dim=0.35; else if (distanceKm>50) dim=0.60;
                const corrDur = Math.max(1, Math.round(baseDurationMins * (1 + ((tf-1)*dim))));
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.geoJSON(feature.geometry, { style: { color: '#8e24aa', weight: 5, opacity: 0.85 } }).addTo(map);
                document.getElementById('result-card').style.display = 'block';
                document.getElementById('invoice-details').style.display = 'none';
                document.getElementById('tapHint').style.display = 'block';
                setTimeout(() => { map.invalidateSize(); if(routeLine) map.fitBounds(routeLine.getBounds(),{padding:[40,40]}); }, 100);
                processCalculations(distanceKm, corrDur, routeHasTolls);
            }).catch(err => { console.error(err); showError("Routing service error."); });
        }, 250);
    }
    
    // attach manual handlers, exclude toggles, and result card toggling
    document.getElementById('apply-manual-toll').addEventListener('click', (e) => { e.stopPropagation(); applyManualToll(); });
    document.getElementById('reset-auto-toll').addEventListener('click', (e) => { e.stopPropagation(); resetToAutoToll(); });
    const resultCardDiv = document.getElementById('result-card');
    resultCardDiv.addEventListener('click', (e) => {
        if(e.target.closest('.exclude-toggle') || e.target.closest('.toll-manual-group') || e.target.closest('#apply-manual-toll') || e.target.closest('#reset-auto-toll')) return;
        const inv = document.getElementById('invoice-details');
        const hint = document.getElementById('tapHint');
        if (inv.style.display === 'none' || inv.style.display === '') {
            inv.style.display = 'block';
            if (hint) hint.style.display = 'none';
        } else {
            inv.style.display = 'none';
            if (hint) hint.style.display = 'block';
        }
    });
    setupExcludeButtons();
    // manual toll input reset auto display
    window.processCalculations = processCalculations;
    window.refreshFinalFare = refreshFinalFare;
</script>
</body>
</html>
