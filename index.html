<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.6.2 PRO</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --primary: #059669;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .search-panel {
            background: var(--card-bg);
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 1005;
            position: relative;
        }

        .inputs-container {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .inputs-flex { flex: 1; }

        .swap-btn-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 10px;
        }

        .swap-btn {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            color: var(--primary);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .swap-btn:active { transform: scale(0.9); background: #e5e7eb; }

        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--gray-text);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px 85px 12px 35px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            background: #f9fafb;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 28px;
            font-size: 14px;
        }

        .btn-container {
            position: absolute;
            right: 8px;
            top: 24px;
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: #9ca3af;
            font-size: 18px;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            z-index: 9999;
            max-height: 350px;
            overflow-y: auto;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
            display: none;
        }

        .autocomplete-item {
            padding: 14px 16px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .item-icon { color: #9ca3af; font-size: 18px; margin-top: 2px; }
        .item-info { flex: 1; }
        .item-name { font-weight: 600; color: #1f2937; font-size: 14px; margin-bottom: 2px; }
        .item-address { color: #6b7280; font-size: 11px; line-height: 1.4; display: block; }
        .item-dist { 
            color: var(--primary); 
            font-weight: 700;
            font-size: 11px; 
            margin-right: 8px; 
        }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .results-card {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            z-index: 1002;
            display: none;
        }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="inputs-container">
        <div class="inputs-flex">
            <div class="input-group">
                <label>Pickup Location</label>
                <span class="input-icon" style="color:#3b82f6;">🔵</span>
                <input type="text" id="pickup" placeholder="Search pickup..." autocomplete="off">
                <div class="btn-container">
                    <button id="clear-p" class="icon-btn" style="display:none">✕</button>
                    <button id="gps-btn" class="icon-btn">📍</button>
                </div>
                <div id="p-results" class="autocomplete-list"></div>
            </div>
            
            <div class="input-group" style="margin-bottom:0;">
                <label>Destination</label>
                <span class="input-icon" style="color:#ef4444;">📍</span>
                <input type="text" id="dropoff" placeholder="Search destination..." autocomplete="off">
                <div class="btn-container">
                    <button id="clear-d" class="icon-btn" style="display:none">✕</button>
                </div>
                <div id="d-results" class="autocomplete-list"></div>
            </div>
        </div>
        
        <div class="swap-btn-container">
            <button id="swap-btn" class="swap-btn" title="Swap Locations">⇅</button>
        </div>
    </div>
    
    <div class="input-group" style="margin-top: 12px; margin-bottom:0;">
        <label>Departure Time</label>
        <input type="datetime-local" id="departure-time">
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="fare" style="margin:0; color:var(--primary); font-size:34px;">RM 0</h2>
        <span id="badge" style="font-size:11px; font-weight:700; padding:6px 12px; background:#f1f5f9; border-radius:20px;">Standard</span>
    </div>
    <p id="summary" style="font-size:12px; color:#4b5563; margin-top:10px; line-height:1.6;"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { 
        BASE: 5.00,
        KM_STANDARD: 1.25, 
        KM_CAP: 2.25,      // Updated: Interstate Cap
        MIDNIGHT_MULT: 1.5, // 50% increase to total
        PEAK_MULT: 1.25,    // 25% increase to total
        PEAK_MIN_RATE: 0.45,
        INTERSTATE_MULT: 1.8,
        INTERSTATE_THRESHOLD: 100
    }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer;

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([3.1478, 101.6953], 12);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
$("departure-time").value = now.toISOString().slice(0,16);

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; 
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function debounceSearch(input, resultsId, type) {
    const query = input.value;
    $(type === 'pickup' ? 'clear-p' : 'clear-d').style.display = query ? 'block' : 'none';
    clearTimeout(searchTimer);
    if (query.length < 2) { $(resultsId).style.display = 'none'; return; }

    searchTimer = setTimeout(async () => {
        try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=3.14&lon=101.69&countrycode=MY&limit=10`);
            const data = await res.json();
            const seen = new Set();
            const uniqueFeatures = data.features.filter(f => {
                const identifier = `${f.properties.name}-${f.properties.city}`;
                if (seen.has(identifier)) return false;
                seen.add(identifier);
                return true;
            });
            renderResults(uniqueFeatures, resultsId, type);
        } catch (e) { console.error(e); }
    }, 300);
}

function renderResults(features, resultsId, type) {
    const list = $(resultsId);
    if (!features.length) { list.style.display = 'none'; return; }
    list.innerHTML = features.map(f => {
        const p = f.properties;
        const [lon, lat] = f.geometry.coordinates;
        const name = p.name || "Unknown Place";
        const subAddress = `${p.street ? p.street + ', ' : ''}${p.city || p.state || 'Malaysia'}`;
        let distLabel = "";
        if (pickupCoord) {
            const d = getDistance(pickupCoord[0], pickupCoord[1], lat, lon);
            distLabel = d < 1 ? `${(d * 1000).toFixed(0)}m` : `${d.toFixed(1)}km`;
        }
        return `<div class="autocomplete-item" onclick="selectLoc('${type}', [${lat}, ${lon}], '${name.replace(/'/g, "\\'")}')">
                <div class="item-icon">📍</div>
                <div class="item-info">
                    <div class="item-name">${name}</div>
                    <div class="item-address"><span class="item-dist">${distLabel}</span> ${subAddress}</div>
                </div></div>`;
    }).join('');
    list.style.display = 'block';
}

function selectLoc(type, coord, label) {
    if (type === 'pickup') { pickupCoord = coord; $("pickup").value = label; $("p-results").style.display = 'none'; } 
    else { dropoffCoord = coord; $("dropoff").value = label; $("d-results").style.display = 'none'; }
    calculate();
}

$("swap-btn").onclick = () => {
    const pVal = $("pickup").value, dVal = $("dropoff").value;
    $("pickup").value = dVal; $("dropoff").value = pVal;
    const tempCoord = pickupCoord; pickupCoord = dropoffCoord; dropoffCoord = tempCoord;
    if (pickupCoord && dropoffCoord) calculate();
};

async function calculate() {
    if (!pickupCoord || !dropoffCoord) return;
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        const km = route.summary.distance / 1000;
        const durationMin = Math.ceil(route.summary.duration / 60);
        
        const dateObj = new Date($("departure-time").value);
        const hour = dateObj.getHours() + (dateObj.getMinutes() / 60);

        const isPeak = (hour >= 6 && hour < 9) || (hour >= 12.5 && hour < 14.5) || (hour >= 17 && hour < 20);
        const isMidnight = (hour >= 0 && hour < 6);
        const isInterstate = km > CONFIG.RATES.INTERSTATE_THRESHOLD;

        // 1. Calculate Base Components
        let kmRate = isInterstate ? Math.min(CONFIG.RATES.KM_STANDARD * CONFIG.RATES.INTERSTATE_MULT, CONFIG.RATES.KM_CAP) : CONFIG.RATES.KM_STANDARD;
        let timeFare = isPeak ? (durationMin * CONFIG.RATES.PEAK_MIN_RATE) : 0;
        
        // 2. Sum Subtotal
        let subtotal = CONFIG.RATES.BASE + (km * kmRate) + timeFare;

        // 3. Apply Surcharges to Total Fare
        let total = subtotal;
        if (isPeak) total *= CONFIG.RATES.PEAK_MULT;
        if (isMidnight) total *= CONFIG.RATES.MIDNIGHT_MULT;
        
        $("fare").innerText = `RM ${Math.round(total)}`;
        $("badge").innerText = isInterstate ? "Interstate" : (isMidnight ? "Midnight" : (isPeak ? "Peak Hour" : "Standard"));
        
        $("summary").innerHTML = `📏 <b>${km.toFixed(1)} km</b> | ⏱️ <b>${durationMin} min</b><br>
            <span style="font-size:11px; color:var(--gray-text);">Incl. ${isMidnight ? '50% Midnight' : (isPeak ? '25% Peak' : 'Standard')} Surcharge on total</span>`;
        
        $("results").style.display = 'block';
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 5}).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding: [50,150]});
    } catch (err) { console.error(err); }
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

$("pickup").oninput = e => debounceSearch(e.target, "p-results", "pickup");
$("dropoff").oninput = e => debounceSearch(e.target, "d-results", "dropoff");
$("departure-time").onchange = () => calculate();
$("gps-btn").onclick = () => {
    navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        try {
            const res = await fetch(`https://photon.komoot.io/reverse?lon=${lon}&lat=${lat}`);
            const data = await res.json();
            selectLoc('pickup', [lat, lon], data.features[0].properties.name || "Current Location");
        } catch(e) { selectLoc('pickup', [lat, lon], "My Location"); }
    });
};

$("clear-p").onclick = () => { $("pickup").value = ''; $("p-results").style.display = 'none'; $("clear-p").style.display = 'none'; pickupCoord = null; };
$("clear-d").onclick = () => { $("dropoff").value = ''; $("d-results").style.display = 'none'; $("clear-d").style.display = 'none'; dropoffCoord = null; };
document.addEventListener('click', (e) => {
    if (!e.target.closest('.input-group')) { $("p-results").style.display = 'none'; $("d-results").style.display = 'none'; }
});
</script>
</body>
</html>
