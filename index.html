<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rideshare MY | Professional Fare Engine</title>
    
    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />

    <style>
        :root { --primary: #059669; --dark: #111827; --wa: #25D366; --danger: #ef4444; --gold: #b45309; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; background: #f3f4f6; color: var(--dark); }
        #map { height: 380px; width: 100%; z-index: 1; border-bottom: 4px solid var(--primary); }

        .app-container { max-width: 500px; margin: -50px auto 40px; position: relative; z-index: 100; padding: 0 15px; }
        .card { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        
        .badge { padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .urban { background: #dcfce7; color: #15803d; }
        .interstate { background: #dbeafe; color: #1e40af; }
        .long-dist { background: #fef3c7; color: var(--gold); }
        .rural { background: #f3f4f6; color: #374151; }

        .price-display { margin: 15px 0; }
        .price-main { font-size: 3rem; font-weight: 900; line-height: 1; color: var(--dark); }
        .price-sub { font-size: 14px; color: #6b7280; font-weight: 500; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; padding: 15px 0; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        .stat-item span { display: block; font-size: 11px; color: #9ca3af; text-transform: uppercase; font-weight: 700; }
        .stat-item b { font-size: 16px; color: var(--dark); }

        .override-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .override-box label { font-size: 11px; font-weight: 700; color: #6b7280; margin-bottom: 5px; display: block; }
        select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #e5e7eb; background: #f9fafb; font-size: 13px; outline: none; }
        
        .breakdown-item { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; color: var(--danger); font-weight: 600; }
        .btn-wa { background: var(--wa); color: white; border: none; width: 100%; padding: 18px; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; transition: transform 0.2s; margin-top: 20px; box-shadow: 0 4px 14px 0 rgba(37, 211, 102, 0.39); }
        .btn-wa:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div id="map"></div>

<div class="app-container">
    <div class="card" id="ui-main" style="display: none;">
        <div style="display:flex; justify-content: space-between; align-items:center;">
            <span id="badge-type" class="badge">Detecting...</span>
            <span id="txt-status" style="font-size: 11px; font-weight: 600; color: var(--primary);"></span>
        </div>

        <div class="price-display">
            <div class="price-main" id="total-fare">RM 0.00</div>
            <div class="price-sub">Estimated Total (Incl. Surcharges)</div>
        </div>

        <div class="stats-grid">
            <div class="stat-item"><span>Distance</span><b id="txt-dist">0.00 km</b></div>
            <div class="stat-item"><span>Est. Time</span><b id="txt-time">0 mins</b></div>
        </div>

        <div id="surcharge-breakdown"></div>

        <div class="override-section">
            <div class="override-box">
                <label>Pickup State</label>
                <select id="p-select" onchange="runCalculation()"><option value="AUTO">Auto-GPS</option></select>
            </div>
            <div class="override-box">
                <label>Drop-off State</label>
                <select id="d-select" onchange="runCalculation()"><option value="AUTO">Auto-GPS</option></select>
            </div>
        </div>

        <button class="btn-wa" onclick="sendToWhatsApp()">Book via WhatsApp</button>
    </div>

    <div class="card" id="ui-empty" style="text-align: center; padding: 40px 20px;">
        <div style="font-size: 40px; margin-bottom: 15px;">📍</div>
        <h3 style="margin:0;">Start Your Journey</h3>
        <p style="color: #6b7280; font-size: 14px;">Tap the map to set your pickup and drop-off points.</p>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
/**
 * RIDESHARE MY - CONSOLIDATED CORE LOGIC
 */

const STATE_DATA = {
    "johor": "MY-01", "kedah": "MY-02", "kelantan": "MY-03", "melaka": "MY-04",
    "negeri sembilan": "MY-05", "pahang": "MY-06", "perak": "MY-08", "perlis": "MY-09",
    "pulau pinang": "MY-07", "selangor": "MY-10", "terengganu": "MY-11", 
    "kuala lumpur": "MY-14", "putrajaya": "MY-16"
};

const ZONES = [
    { name: "KLCC Premium", fee: 5.0, color: "#3b82f6", coords: [[3.155, 101.700], [3.160, 101.715], [3.145, 101.720], [3.135, 101.705]] },
    { name: "Airport Access", fee: 12.0, color: "#f59e0b", coords: [[2.760, 101.690], [2.760, 101.720], [2.730, 101.720], [2.730, 101.690]] }
];

const CONFIG = {
    URBAN: ["MY-10", "MY-14", "MY-16"],
    TRANS_START: 40, TRANS_END: 60,
    LONG_DIST_KM: 100,
    BASE: 5.0, MIN: 8.0,
    RATES: { URBAN_KM: 1.25, URBAN_MIN: 0.20, RURAL_KM: 1.15, LONG_KM: 1.40, INTER_KM: 1.55, INCENTIVE: 0.50 }
};

let map = L.map('map', { zoomControl: false }).setView([3.1319, 101.6841], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let routingControl = L.Routing.control({ waypoints: [], show: false }).addTo(map);
let fetchController = null;
let currentTrip = null;

// Populate dropdowns
const pSel = document.getElementById('p-select');
const dSel = document.getElementById('d-select');
Object.entries(STATE_DATA).forEach(([name, code]) => {
    let opt = `<option value="${code}">${name.toUpperCase()}</option>`;
    pSel.innerHTML += opt; dSel.innerHTML += opt;
});

// Map Click Handler
map.on('click', (e) => {
    let wps = routingControl.getWaypoints();
    if (!wps[0].latLng) routingControl.spliceWaypoints(0, 1, e.latlng);
    else if (!wps[1].latLng) routingControl.spliceWaypoints(1, 1, e.latlng);
});

routingControl.on('routesfound', async (e) => {
    if (fetchController) fetchController.abort();
    fetchController = new AbortController();
    
    document.getElementById('ui-empty').style.display = 'none';
    document.getElementById('ui-main').style.display = 'block';
    
    const route = e.routes[0];
    const wps = routingControl.getWaypoints();

    try {
        const [pData, dData] = await Promise.all([
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${wps[0].latLng.lat}&lon=${wps[0].latLng.lng}`, { signal: fetchController.signal }).then(r => r.json()),
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${wps[1].latLng.lat}&lon=${wps[1].latLng.lng}`, { signal: fetchController.signal }).then(r => r.json())
        ]);

        currentTrip = {
            km: route.summary.totalDistance / 1000,
            mins: route.summary.totalTime / 60,
            pAuto: findISO(pData.address.state),
            dAuto: findISO(dData.address.state),
            pLatLng: wps[0].latLng,
            dLatLng: wps[1].latLng
        };
        runCalculation();
    } catch (err) { if(err.name !== 'AbortError') console.error("Geocoding failed."); }
});

function findISO(name) {
    const s = (name || "").toLowerCase();
    for (let [k, v] of Object.entries(STATE_DATA)) if (s.includes(k)) return v;
    return "UNKNOWN";
}

function isInside(pt, poly) {
    let x = pt.lat, y = pt.lng, inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        let xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
        if (((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
}

function runCalculation() {
    if (!currentTrip) return;

    const pState = pSel.value === "AUTO" ? currentTrip.pAuto : pSel.value;
    const dState = dSel.value === "AUTO" ? currentTrip.dAuto : dSel.value;
    const isUrban = CONFIG.URBAN.includes(pState);
    const { km, mins } = currentTrip;

    let fare = 0, type = "rural", status = "";
    let activeZones = [];

    // 1. Geofence Surcharges (Flat Access)
    let zoneTotal = 0;
    ZONES.forEach(z => {
        if (isInside(currentTrip.pLatLng, z.coords) || isInside(currentTrip.dLatLng, z.coords)) {
            zoneTotal += z.fee;
            activeZones.push(z);
        }
    });

    // 2. Main Logic Tiers
    if (pState !== dState && pState !== "UNKNOWN" && dState !== "UNKNOWN") {
        type = "interstate";
        let factor = Math.min(Math.max((km - CONFIG.TRANS_START) / (CONFIG.TRANS_END - CONFIG.TRANS_START), 0), 1);
        const rateI = CONFIG.BASE + (km * (CONFIG.RATES.INTER_KM + CONFIG.RATES.INCENTIVE));
        const rateL = isUrban ? CONFIG.BASE + (km * CONFIG.RATES.URBAN_KM) + (mins * CONFIG.RATES.URBAN_MIN) : CONFIG.BASE + (km * CONFIG.RATES.RURAL_KM);
        fare = (rateL * (1 - factor)) + (rateI * factor);
        status = factor < 1 ? "Blended Interstate" : "Full Interstate";
    } 
    else if (km > CONFIG.LONG_DIST_KM) {
        type = "long-dist";
        fare = CONFIG.BASE + (km * CONFIG.RATES.LONG_KM) + (isUrban ? (mins * CONFIG.RATES.URBAN_MIN) : 0);
        status = isUrban ? "Long Dist + Urban Time" : "Long Distance (Rural)";
    } 
    else if (isUrban) {
        type = "urban";
        fare = CONFIG.BASE + (km * CONFIG.RATES.URBAN_KM) + (mins * CONFIG.RATES.URBAN_MIN);
    } 
    else {
        type = "rural";
        fare = CONFIG.BASE + (km * CONFIG.RATES.RURAL_KM);
    }

    const finalFare = Math.max(fare + zoneTotal, CONFIG.MIN);

    // 3. UI Sync
    document.getElementById('total-fare').innerText = `RM ${finalFare.toFixed(2)}`;
    document.getElementById('txt-dist').innerText = `${km.toFixed(2)} km`;
    document.getElementById('txt-time').innerText = `${Math.round(mins)} mins`;
    document.getElementById('badge-type').innerText = type.replace("-", " ");
    document.getElementById('badge-type').className = `badge ${type}`;
    document.getElementById('txt-status').innerText = status;

    const bArea = document.getElementById('surcharge-breakdown');
    bArea.innerHTML = "";
    activeZones.forEach(z => {
        bArea.innerHTML += `<div class="breakdown-item"><span>🚀 ${z.name}</span><span>+RM ${z.fee.toFixed(2)}</span></div>`;
    });
}

function sendToWhatsApp() {
    const fare = document.getElementById('total-fare').innerText;
    const dist = document.getElementById('txt-dist').innerText;
    window.open(`https://wa.me/?text=${encodeURIComponent("*RIDESHARE MY BOOKING*\nTotal: " + fare + "\nDistance: " + dist)}`);
}
</script>
</body>
</html>
