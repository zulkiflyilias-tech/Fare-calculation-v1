<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.4 PRO (Toll-Free Opt)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --whatsapp: #25D366;
            --copy: #6b7280;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
            --pickup-blue: #3b82f6;
            --dropoff-red: #ef4444;
            --long-haul: #8b5cf6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .search-panel {
            background: var(--card-bg);
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 1005;
            border-bottom: 1px solid #e5e7eb;
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--gray-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 12px 90px 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            background: #f9fafb;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f3f4f6;
            padding: 8px 12px;
            border-radius: 10px;
            margin-top: 8px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn-container {
            position: absolute;
            right: 8px;
            top: 24px;
            display: flex;
            gap: 4px;
        }

        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: #9ca3af; font-size: 18px; }

        .autocomplete-list {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: white;
            z-index: 9999;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            border: 1px solid #e5e7eb;
            border-radius: 0 0 12px 12px;
        }

        .autocomplete-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .results-card {
            position: fixed;
            bottom: 24px; left: 16px; right: 16px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            z-index: 1002;
            display: none;
        }

        #fare { font-size: 34px; font-weight: 800; color: var(--primary); margin: 0; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 20px; }
        .btn { padding: 12px 4px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: 700; font-size: 12px; color: white; border: none; cursor: pointer; }
        .btn-wa { background: var(--whatsapp); }
        .btn-nav { background: #3b82f6; }
        .btn-copy { background: var(--copy); }

        .mode-badge { background:#ecfdf5; color:var(--primary); padding:6px 12px; border-radius:30px; font-size:11px; font-weight:700; }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="input-group">
        <label>Pickup Location</label>
        <input type="text" id="pickup" placeholder="Search pickup..." autocomplete="off">
        <div class="btn-container"><button class="icon-btn" id="gps-trigger">📍</button></div>
        <div id="pickup-results" class="autocomplete-list"></div>
    </div>

    <div class="input-group">
        <label>Destination</label>
        <input type="text" id="dropoff" placeholder="Search destination..." autocomplete="off">
        <div id="dropoff-results" class="autocomplete-list"></div>
    </div>

    <div class="toggle-container">
        <span style="font-size: 13px; font-weight: 600; color: var(--text);">🚫 Avoid Tolls</span>
        <label class="switch">
            <input type="checkbox" id="toll-free-toggle">
            <span class="slider"></span>
        </label>
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="fare">RM 0</h2>
        <span id="mode-badge" class="mode-badge">Standard Rate</span>
    </div>
    <div style="margin-top: 12px; font-size: 13px; color: #4b5563;">
        📏 <b id="distance">0 km</b> | ⏱️ <b id="eta">0 min</b><br>
        🚧 Toll: <b id="toll-display">RM 0</b>
    </div>
    <div class="btn-group">
        <a id="wa-btn" class="btn btn-wa" target="_blank">WhatsApp</a>
        <button id="copy-btn" class="btn btn-copy">Copy</button>
        <button id="nav-btn" class="btn btn-nav">Directions</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    WHATSAPP: "60108988182",
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    MIN_RATE: 1.00,
    MAX_RATE: 2.20,
    DEMAND: { HIGH: ["klia", "airport", "genting"], MID: ["mall", "hotel"] }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, routeLayer, lastSummaryText = "";

const map = L.map("map", { zoomControl: false }).setView([4.2105, 101.9758], 7);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

function estimateToll(km, pTxt, dTxt) {
    if ($("toll-free-toggle").checked) return 0;
    const routeText = `${pTxt} ${dTxt}`.toLowerCase();
    let toll = (km < 15) ? 0 : (km * 0.11) + 3.50;
    if (routeText.includes("klia")) toll += 7.50;
    return Math.round(toll * 100) / 100;
}

async function searchPlaces(query, resultId, type) {
    if (query.length < 3) return;
    const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&countrycode=MY&limit=5`);
    const data = await res.json();
    $(resultId).innerHTML = data.features.map(f => `
        <div class="autocomplete-item" onclick="selectLoc('${type}', [${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], '${f.properties.name}')">
            ${f.properties.name}
        </div>`).join('');
    $(resultId).style.display = 'block';
}

function selectLoc(type, coord, label) {
    $(type).value = label;
    $(`${type}-results`).style.display = 'none';
    if (type === 'pickup') pickupCoord = coord; else dropoffCoord = coord;
    if (pickupCoord && dropoffCoord) calculate();
}

async function calculate() {
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        const km = route.summary.distance / 1000;
        
        let baseRate = (km >= 90) ? 1.75 : 1.10;
        const locText = ($("pickup").value + $("dropoff").value).toLowerCase();
        let multiplier = CONFIG.DEMAND.HIGH.some(k => locText.includes(k)) ? 2.2 : 1.0;
        
        let effectiveRate = Math.min(Math.max(baseRate * multiplier, CONFIG.MIN_RATE), CONFIG.MAX_RATE);
        let toll = estimateToll(km, $("pickup").value, $("dropoff").value);
        let finalFare = Math.round((km * effectiveRate) + toll);

        $("fare").innerText = `RM ${finalFare}`;
        $("distance").innerText = `${km.toFixed(1)} km`;
        $("toll-display").innerText = `RM ${toll.toFixed(2)}`;
        $("results").style.display = 'block';

        const tollNote = $("toll-free-toggle").checked ? " (Toll-Free Route)" : "";
        lastSummaryText = `🚖 *RIDE BOOKING*\n📍 *From:* ${$("pickup").value}\n🏁 *To:* ${$("dropoff").value}\n📏 *Dist:* ${km.toFixed(1)}km\n🚧 *Toll:* RM ${toll.toFixed(2)}${tollNote}\n💰 *FARE: RM ${finalFare}*`;
        $("wa-btn").href = `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(lastSummaryText)}`;
    } catch (e) { console.error(e); }
}

$("pickup").oninput = e => searchPlaces(e.target.value, "pickup-results", "pickup");
$("dropoff").oninput = e => searchPlaces(e.target.value, "dropoff-results", "dropoff");
$("toll-free-toggle").onchange = () => { if (pickupCoord && dropoffCoord) calculate(); };
$("copy-btn").onclick = () => { navigator.clipboard.writeText(lastSummaryText); alert("Copied!"); };
</script>
</body>
</html>
