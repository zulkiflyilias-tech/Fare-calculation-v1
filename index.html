<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fare Estimator - Private Use</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --google-blue: #4285F4;
            --google-green: #34A853;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #map { height: 100vh; width: 100%; z-index: 1; }

        .search-box {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 420px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #f1f3f4;
            margin-bottom: 12px;
            border-radius: 8px;
            padding: 4px 12px;
        }

        .input-group input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 8px;
            outline: none;
            font-size: 14px;
        }

        .gps-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--google-blue);
        }

        .schedule-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #travel-schedule {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
        }

        .btn-calculate {
            width: 100%;
            background: var(--google-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-calculate:active { opacity: 0.8; }

        #result {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
            text-align: center;
        }

        .fare-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--google-green);
            display: block;
        }

        .fare-details {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="search-box">
    <div class="input-group">
        <input type="text" id="pickup" placeholder="Enter Pickup Location">
        <button class="gps-btn" onclick="useGPS('pickup')">📍</button>
    </div>
    
    <div class="input-group">
        <input type="text" id="dropoff" placeholder="Enter Destination">
        <button class="gps-btn" onclick="useGPS('dropoff')">📍</button>
    </div>

    <div class="schedule-row">
        <input type="datetime-local" id="travel-schedule">
    </div>

    <button class="btn-calculate" onclick="estimateFare()">Calculate Fare</button>

    <div id="result" style="display:none;">
        <span class="fare-details" id="surge-label">Standard Rate</span>
        <span class="fare-price" id="fare-output">RM 0.00</span>
        <span class="fare-details" id="dist-time-output">0 km | 0 min</span>
    </div>
</div>

<div id="map"></div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Initialize Map
    const map = L.map('map').setView([3.1390, 101.6869], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Set default time to now
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('travel-schedule').value = now.toISOString().slice(0, 16);

    async function useGPS(targetId) {
        if (!navigator.geolocation) return alert("GPS not supported");
        
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude, longitude } = pos.coords;
            map.setView([latitude, longitude], 15);
            
            // Reverse Geocoding
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
            const data = await res.json();
            document.getElementById(targetId).value = data.display_name;
        });
    }

    async function estimateFare() {
        // Since we are using free tools, in a real app you would use OSRM API 
        // to get actual road distance. For this demo, we use a simulated 10km/15min
        // to show the calculation logic works.
        
        const distKm = 12.5; // Placeholder
        const timeMin = 25;  // Placeholder
        
        const scheduleVal = document.getElementById('travel-schedule').value;
        const date = new Date(scheduleVal);
        const hour = date.getHours();

        // 1. Core Rates
        const baseFare = 5.00;
        const distRate = 1.25;
        const timeRate = 0.30;
        const minFare = 8.00;

        // 2. Logic Flags
        let isPeak = (hour >= 7 && hour < 9) || (hour >= 17 && hour < 20);
        let isMidnight = (hour >= 0 && hour < 6);
        let surge = 1.0;
        let label = "Standard Rate";

        if (isPeak) { surge = 1.3; label = "Peak Hour Surge (1.3x)"; }
        if (isMidnight) { surge = 1.1; label = "Midnight Surge (1.1x)"; }

        // 3. Calculation
        let distTotal = distKm * distRate;
        
        // Minimum Fare Check
        if ((baseFare + distTotal) < minFare) {
            distTotal = minFare - baseFare;
        }

        // Time Fare (Simulating congested area)
        let timeTotal = timeMin * timeRate;

        // Apply Surge to Variable parts
        let total = baseFare + ((distTotal + timeTotal) * surge);

        // 4. Display
        document.getElementById('result').style.display = 'block';
        document.getElementById('fare-output').innerText = `RM ${total.toFixed(2)}`;
        document.getElementById('surge-label').innerText = label;
        document.getElementById('dist-time-output').innerText = `${distKm} km | ${timeMin} min`;
    }
</script>

</body>
</html>
