<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare Pro - Grab-Style Logic</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --gray-text: #6b7280; --accent: #f59e0b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .search-panel { background: var(--card-bg); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1005; }
        .inputs-container { display: flex; align-items: center; gap: 12px; }
        .inputs-flex { flex: 1; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gray-text); text-transform: uppercase; }
        
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #f9fafb; transition: 0.2s; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }
        
        #pickup, #dropoff { padding-right: 85px; }
        .swap-btn { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; }
        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 4px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: #9ca3af; font-size: 18px; }
        
        /* Autocomplete Styling - Mimicking Grab's clean list */
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 9999; max-height: 300px; overflow-y: auto; border-radius: 0 0 16px 16px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); display: none; margin-top: 4px; border: 1px solid #eee; }
        .autocomplete-item { display: flex; align-items: center; padding: 14px 16px; gap: 14px; cursor: pointer; border-bottom: 1px solid #f9fafb; }
        .loc-icon { background: #ecfdf5; color: var(--primary); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
        .loc-name { font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 2px; }
        .loc-address { font-size: 11px; color: var(--gray-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .results-card { position: fixed; bottom: 20px; left: 16px; right: 16px; background: white; padding: 20px; border-radius: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 1002; display: none; }
        .fare-header { display: flex; justify-content: space-between; align-items: center; }
        #fare { margin:0; color:var(--primary); font-size:32px; font-weight: 800; }
        
        .action-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { border: none; border-radius: 12px; padding: 12px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-transform: uppercase; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-copy { background: #f1f5f9; color: #475569; }
        .btn-maps { background: #4285F4; color: white; }

        /* Modal / Breakdown styling */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 9998; }
        .fare-breakdown { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 340px; background: white; padding: 24px; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); z-index: 9999; flex-direction: column; }
        .invoice-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .invoice-table td { padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .amount { text-align: right; font-weight: 700; }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="inputs-container">
        <div class="inputs-flex">
            <div class="input-group">
                <label>Pickup Point</label>
                <input type="text" id="pickup" placeholder="Search building, lobby, or street..." autocomplete="off">
                <div class="btn-container">
                    <button id="clear-p" class="icon-btn" style="display:none">✕</button>
                    <button id="gps-btn" class="icon-btn">📍</button>
                </div>
                <div id="p-results" class="autocomplete-list"></div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>Destination</label>
                <input type="text" id="dropoff" placeholder="Where are you heading?" autocomplete="off">
                <div class="btn-container">
                    <button id="clear-d" class="icon-btn" style="display:none">✕</button>
                </div>
                <div id="d-results" class="autocomplete-list"></div>
            </div>
        </div>
        <button id="swap-btn" class="swap-btn">⇅</button>
    </div>
</div>

<div id="map"></div>

<div id="modal-overlay" class="modal-overlay" onclick="toggleBreakdown()"></div>
<div id="breakdown" class="fare-breakdown">
    <h3 style="margin: 0 0 15px 0;">Trip Invoice</h3>
    <div id="invoice-content"></div>
    <button style="margin-top:20px; width:100%; padding:14px; border:none; border-radius:14px; background:#f3f4f6; font-weight:700;" onclick="toggleBreakdown()">Close</button>
</div>

<div id="results" class="results-card">
    <div class="fare-header" onclick="toggleBreakdown()">
        <div>
            <h2 id="fare">RM 0</h2>
            <div id="summary" style="font-size:12px; color:#6b7280;"></div>
        </div>
        <span id="badge" style="font-size:10px; font-weight:800; padding:6px 12px; background:#f1f5f9; border-radius:20px; text-transform: uppercase;">Standard</span>
    </div>
    <div class="action-bar">
        <button class="action-btn btn-whatsapp" id="btn-whatsapp"><span>💬</span> WhatsApp</button>
        <button class="action-btn btn-copy" id="btn-copy"><span>📋</span> Copy</button>
        <button class="action-btn btn-maps" id="btn-maps"><span>🗺️</span> Maps App</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { 
        BASE: 5.00, KM_TIER_1: 1.25, KM_TIER_2: 1.10, KM_TIER_3: 0.90,
        TIME_RATE: 0.20, EMPTY_RETURN_KM: 0.45 
    }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, pickupState, dropoffState, searchTimer, routeLayer, currentFare = 0;

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([3.1478, 101.6953], 12);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

function toggleBreakdown() {
    const isVisible = $("breakdown").style.display === "flex";
    $("breakdown").style.display = isVisible ? "none" : "flex";
    $("modal-overlay").style.display = isVisible ? "none" : "block";
}

function debounceSearch(input, resultsId, type) {
    const query = input.value;
    $(type === 'pickup' ? 'clear-p' : 'clear-d').style.display = query ? 'block' : 'none';
    clearTimeout(searchTimer);
    if (query.length < 3) { $(resultsId).style.display = 'none'; return; }

    searchTimer = setTimeout(async () => {
        try {
            // Enhanced parameters to surface specific gates and amenities
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=my&limit=10&addressdetails=1&extratags=1`;
            const res = await fetch(url, { headers: { 'Accept-Language': 'en-US' } });
            const data = await res.json();
            renderResults(data, resultsId, type);
        } catch (e) { console.error(e); }
    }, 450);
}

function renderResults(data, resultsId, type) {
    const list = $(resultsId);
    if (!data || !data.length) { list.style.display = 'none'; return; }
    
    list.innerHTML = data.map(item => {
        const a = item.address;
        // Grab-style Detail Promotion: Look for specific sub-names first
        let name = a.amenity || a.mall || a.shop || a.office || a.industrial || a.house_name || item.display_name.split(',')[0];
        
        // If it's a building, check if the house number (Gate) is listed
        if (a.house_number) name += ` (Gate/No ${a.house_number})`;
        
        const sub = `${a.road || ''}${a.road && (a.city || a.town) ? ', ' : ''}${a.city || a.town || a.state || ''}`;
        const icon = a.amenity ? '🏢' : (a.shop ? '🛍️' : '📍');

        return `<div class="autocomplete-item" onclick="selectLoc('${type}', [${item.lat}, ${item.lon}], '${item.display_name.replace(/'/g, "\\'")}', '${a.state || ""}')">
            <div class="loc-icon">${icon}</div>
            <div class="loc-details">
                <div class="loc-name">${name}</div>
                <div class="loc-address">${sub}</div>
            </div>
        </div>`;
    }).join('');
    list.style.display = 'block';
}

async function selectLoc(type, coord, label, state) {
    if (type === 'pickup') { pickupCoord = coord; pickupState = state; $("pickup").value = label; $("p-results").style.display = 'none'; } 
    else { dropoffCoord = coord; dropoffState = state; $("dropoff").value = label; $("d-results").style.display = 'none'; }
    if (pickupCoord && dropoffCoord) calculate();
}

async function calculate() {
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        const km = route.summary.distance / 1000;
        const mins = Math.ceil(route.summary.duration / 60);
        
        // Multi-Tier Fare Logic
        let distFare = 0;
        if (km <= 50) distFare = km * CONFIG.RATES.KM_TIER_1;
        else if (km <= 150) distFare = (50 * CONFIG.RATES.KM_TIER_1) + ((km - 50) * CONFIG.RATES.KM_TIER_2);
        else distFare = (50 * CONFIG.RATES.KM_TIER_1) + (100 * CONFIG.RATES.KM_TIER_2) + ((km - 150) * CONFIG.RATES.KM_TIER_3);

        const timeFare = mins * CONFIG.RATES.TIME_RATE;
        const isInterstate = (pickupState && dropoffState && pickupState !== dropoffState);
        const emptyReturn = isInterstate ? (km * CONFIG.RATES.EMPTY_RETURN_KM) : 0;
        
        currentFare = Math.round(CONFIG.RATES.BASE + distFare + timeFare + emptyReturn);

        $("fare").innerText = `RM ${currentFare}`;
        $("summary").innerHTML = `<b>${km.toFixed(1)} km</b> • <b>${mins} mins</b>`;
        $("badge").innerText = isInterstate ? "Interstate" : "Standard";
        $("badge").style.background = isInterstate ? "#fff7ed" : "#f1f5f9";
        $("badge").style.color = isInterstate ? "#c2410c" : "#475569";

        $("invoice-content").innerHTML = `
            <table class="invoice-table">
                <tr><td>Base Fare</td><td class="amount">RM ${CONFIG.RATES.BASE.toFixed(2)}</td></tr>
                <tr><td>Distance Fee</td><td class="amount">RM ${distFare.toFixed(2)}</td></tr>
                <tr><td>Time Fee (${mins}m)</td><td class="amount">RM ${timeFare.toFixed(2)}</td></tr>
                ${isInterstate ? `<tr><td>Empty Return Incentive</td><td class="amount">RM ${emptyReturn.toFixed(2)}</td></tr>` : ''}
                <tr style="font-size:16px; font-weight:800; color:var(--primary)"><td>Total</td><td class="amount">RM ${currentFare.toFixed(2)}</td></tr>
            </table>`;
        
        $("results").style.display = 'block';
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 6}).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding: [40, 160]});
    } catch (e) { console.error(e); }
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coords = [];
    while (index < str.length) {
        let b, shift = 0, res = 0;
        do { b = str.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (res & 1) ? ~(res >> 1) : (res >> 1);
        shift = 0; res = 0;
        do { b = str.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (res & 1) ? ~(res >> 1) : (res >> 1);
        coords.push([lat / 1e5, lng / 1e5]);
    }
    return coords;
}

$("btn-maps").onclick = () => {
    if (!pickupCoord || !dropoffCoord) return;
    const url = `https://www.google.com/maps/dir/?api=1&origin=${pickupCoord[0]},${pickupCoord[1]}&destination=${dropoffCoord[0]},${dropoffCoord[1]}&travelmode=driving`;
    window.open(url, '_blank');
};

$("btn-whatsapp").onclick = () => {
    const msg = encodeURIComponent(`🚕 *Rideshare Booking*\nPickup: ${$("pickup").value}\nDropoff: ${$("dropoff").value}\nEst. Fare: RM ${currentFare}`);
    window.open(`https://wa.me/?text=${msg}`, '_blank');
};

$("btn-copy").onclick = () => {
    navigator.clipboard.writeText(`Trip: ${$("pickup").value} to ${$("dropoff").value}\nFare: RM ${currentFare}`);
    alert("Details Copied!");
};

$("pickup").oninput = e => debounceSearch(e.target, "p-results", "pickup");
$("dropoff").oninput = e => debounceSearch(e.target, "d-results", "dropoff");

$("gps-btn").onclick = () => {
    navigator.geolocation.getCurrentPosition(async pos => {
        const {latitude, longitude} = pos.coords;
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&addressdetails=1`);
        const data = await res.json();
        selectLoc('pickup', [latitude, longitude], data.display_name, data.address.state || "");
    });
};

$("swap-btn").onclick = () => {
    let pV = $("pickup").value, dV = $("dropoff").value, pS = pickupState, dS = dropoffState, tC = pickupCoord;
    $("pickup").value = dV; $("dropoff").value = pV;
    pickupCoord = dropoffCoord; dropoffCoord = tC;
    pickupState = dS; dropoffState = pS;
    if(pickupCoord && dropoffCoord) calculate();
};

$("clear-p").onclick = () => { $("pickup").value = ''; pickupCoord = null; $("clear-p").style.display='none'; $("p-results").style.display='none'; };
$("clear-d").onclick = () => { $("dropoff").value = ''; dropoffCoord = null; $("clear-d").style.display='none'; $("d-results").style.display='none'; };
</script>
</body>
</html>
