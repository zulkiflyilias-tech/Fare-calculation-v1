<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - Professional v3.4</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --whatsapp: #25D366;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --gray-text: #6b7280;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Input Panel */
        .search-panel {
            background: var(--card-bg);
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 1001;
            border-bottom: 1px solid #e5e7eb;
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--gray-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 12px 90px 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            background: #f9fafb;
            transition: all 0.2s ease;
        }

        input:focus { 
            border-color: var(--primary); 
            background: white; 
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
        }

        .btn-container {
            position: absolute;
            right: 8px;
            top: 24px;
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .icon-btn:hover { background: #f3f4f6; }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            z-index: 2000;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            margin-top: 2px;
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            align-items: center;
        }

        .loc-name { font-weight: 600; font-size: 14px; display: block; color: #111; }
        .loc-addr { font-size: 11px; color: var(--gray-text); }

        /* Map & Elements */
        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .swap-container {
            position: absolute;
            right: 24px;
            top: 76px;
            z-index: 1005;
        }

        .swap-btn {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            transition: transform 0.2s;
        }

        /* Results Card */
        .results-card {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            z-index: 1002;
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        #fare { font-size: 34px; font-weight: 800; color: var(--primary); margin: 0; letter-spacing: -0.02em; }
        .mode-badge {
            background:#ecfdf5; 
            color:var(--primary); 
            padding:6px 12px; 
            border-radius:30px; 
            font-size:11px; 
            font-weight:700;
        }

        /* Fee Checkbox Styling */
        .fee-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 8px 12px;
            background: #fef2f2;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #b91c1c;
            border: 1px solid #fee2e2;
        }

        .fee-toggle input { width: auto; padding: 0; margin: 0; cursor: pointer; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .btn { 
            padding: 14px; 
            border-radius: 12px; 
            text-align: center; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 14px;
            color: white; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-wa { background: var(--whatsapp); }
        .btn-nav { background: #3b82f6; }
        
        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid #ecfdf5;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="search-panel">
        <div class="input-group">
            <label>Pickup Location</label>
            <input type="text" id="pickup" placeholder="Search for pickup..." autocomplete="off">
            <div class="btn-container">
                <button class="icon-btn" id="gps-trigger">📍</button>
            </div>
            <div id="pickup-results" class="autocomplete-list"></div>
        </div>

        <div class="swap-container">
            <button class="swap-btn" id="swap-btn">⇅</button>
        </div>

        <div class="input-group">
            <label>Destination</label>
            <input type="text" id="dropoff" placeholder="Search for destination..." autocomplete="off">
            <div id="dropoff-results" class="autocomplete-list"></div>
        </div>

        <div class="input-group" style="margin-bottom: 0;">
            <label>Travel Schedule</label>
            <input type="datetime-local" id="departure-time">
        </div>
    </div>

    <div id="map"></div>

    <div id="results" class="results-card">
        <div id="loading-state" style="text-align: center;">
            <span class="loader"></span><br>Calculating...
        </div>
        <div id="fare-content" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <h2 id="fare">RM 0</h2>
                <span id="mode-badge" class="mode-badge">Standard</span>
            </div>
            <div style="display:flex; gap:15px; font-size:13px; color: #4b5563;">
                <span>📏 <b id="distance">0 km</b></span>
                <span>⏱️ <b id="eta">0 min</b></span>
            </div>

            <label class="fee-toggle">
                <input type="checkbox" id="fee-checkbox"> Add 20% Platform Fee to Message
            </label>

            <div class="btn-group">
                <a id="wa-btn" class="btn btn-wa" target="_blank">WhatsApp</a>
                <a id="nav-btn" class="btn btn-nav" target="_blank">Navigate</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const CONFIG = {
            WHATSAPP: "60108988182",
            ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
            CENTER: [3.139, 101.686],
            BBOX: "99.5,1.2,103.6,6.8"
        };

        const $ = id => document.getElementById(id);
        let pickupCoord, dropoffCoord, routeLayer, pickupMarker, dropoffMarker, searchTimer, lastRouteData;

        const map = L.map("map", { zoomControl: false, attributionControl: false }).setView(CONFIG.CENTER, 13);
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        $("departure-time").value = now.toISOString().slice(0,16);

        async function searchPlaces(query, resultId, type) {
            clearTimeout(searchTimer);
            if (query.length < 3) { $(resultId).style.display = 'none'; return; }
            searchTimer = setTimeout(async () => {
                const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=${CONFIG.BBOX}&limit=5`);
                const data = await res.json();
                renderResults(data.features, resultId, type);
            }, 400);
        }

        function renderResults(features, resultId, type) {
            const list = $(resultId);
            list.innerHTML = features.map(f => {
                const p = f.properties;
                const label = `${p.name || 'Location'}, ${p.city || ''}`.replace(/'/g, "");
                return `<div class="autocomplete-item" onclick="selectLoc('${type}', [${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], '${label}')">
                    <div><span class="loc-name">${p.name || 'Location'}</span><span class="loc-addr">${p.city || 'Malaysia'}</span></div>
                </div>`;
            }).join('');
            list.style.display = features.length ? 'block' : 'none';
        }

        function selectLoc(type, coord, label) {
            $(type).value = label;
            $(`${type}-results`).style.display = 'none';
            if (type === 'pickup') {
                if (pickupMarker) map.removeLayer(pickupMarker);
                pickupCoord = coord;
                pickupMarker = L.circleMarker(coord, {color: '#3b82f6', fillOpacity: 1, radius: 6}).addTo(map);
            } else {
                if (dropoffMarker) map.removeLayer(dropoffMarker);
                dropoffCoord = coord;
                dropoffMarker = L.circleMarker(coord, {color: '#ef4444', fillOpacity: 1, radius: 6}).addTo(map);
            }
            if (pickupCoord && dropoffCoord) calculate();
        }

        // GPS Logic with Reverse Geocoding
        $("gps-trigger").onclick = () => {
            navigator.geolocation.getCurrentPosition(async p => {
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await res.json();
                    const addr = data.display_name.split(',').slice(0, 2).join(',');
                    selectLoc('pickup', [lat, lon], addr);
                } catch (e) {
                    selectLoc('pickup', [lat, lon], "Current Location");
                }
            });
        };

        async function calculate() {
            $("results").style.display = 'block';
            $("fare-content").style.display = 'none';
            $("loading-state").style.display = 'block';

            try {
                const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
                    body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
                });
                lastRouteData = await res.json();
                updateUI();
            } catch (e) { $("loading-state").innerText = "Error calculating route."; }
        }

        function updateUI() {
            if (!lastRouteData) return;
            const route = lastRouteData.routes[0];
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.polyline(decodePoly(route.geometry), { color: '#059669', weight: 5 }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

            const km = route.summary.distance / 1000;
            const mins = route.summary.duration / 60;
            const sched = new Date($("departure-time").value);
            const minsTotal = (sched.getHours() * 60) + sched.getMinutes();

            let base = 5.00, mode = "Standard";
            const isPeak = (minsTotal >= 360 && minsTotal < 540) || (minsTotal >= 1020 && minsTotal < 1200);
            const isMidnight = (minsTotal > 0 && minsTotal < 360);

            let total = base + (km >= 80 ? (km * 1.90 + mins * 0.20) : (isMidnight ? km * 1.87 : (isPeak ? km * 1.50 : km * 1.25)));
            if (km >= 80) mode = "Long Distance";
            else if (isMidnight) mode = "Midnight";
            else if (isPeak) mode = "Peak Hour";

            let finalFare = Math.max(8, Math.round(total));
            let waFare = $("fee-checkbox").checked ? Math.round(finalFare * 1.2) : finalFare;

            $("fare").innerText = `RM ${finalFare}`;
            $("distance").innerText = `${km.toFixed(1)} km`;
            $("eta").innerText = `${Math.round(mins)} min`;
            $("mode-badge").innerText = mode;

            const msg = encodeURIComponent(`*New Booking*\n---\n*From:* ${$("pickup").value}\n*To:* ${$("dropoff").value}\n---\n*Fare:* RM ${waFare}\n*Dist:* ${km.toFixed(1)}km\n*Mode:* ${mode}`);
            $("wa-btn").href = `https://wa.me/${CONFIG.WHATSAPP}?text=${msg}`;
            $("nav-btn").href = `google.navigation:q=${dropoffCoord[0]},${dropoffCoord[1]}`;

            $("loading-state").style.display = 'none';
            $("fare-content").style.display = 'block';
        }

        $("fee-checkbox").onchange = () => updateUI();
        $("pickup").oninput = e => searchPlaces(e.target.value, "pickup-results", "pickup");
        $("dropoff").oninput = e => searchPlaces(e.target.value, "dropoff-results", "dropoff");
        $("departure-time").onchange = () => { if(pickupCoord && dropoffCoord) calculate(); };
        
        $("swap-btn").onclick = () => {
            const v1 = $("pickup").value, v2 = $("dropoff").value;
            const c1 = pickupCoord, c2 = dropoffCoord;
            $("pickup").value = v2; $("dropoff").value = v1;
            pickupCoord = c2; dropoffCoord = c1;
            if (pickupCoord && dropoffCoord) calculate();
        };

        function decodePoly(str) {
            let index = 0, lat = 0, lng = 0, coordinates = [];
            while (index < str.length) {
                let b, shift = 0, result = 0;
                do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lat += (result & 1) ? ~(result >> 1) : (result >> 1);
                shift = 0; result = 0;
                do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lng += (result & 1) ? ~(result >> 1) : (result >> 1);
                coordinates.push([lat / 1e5, lng / 1e5]);
            }
            return coordinates;
        }
    </script>
</body>
</html>
