<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.9.2 PRO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --gray-text: #6b7280; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Search Panel */
        .search-panel { background: var(--card-bg); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1005; }
        .inputs-container { display: flex; align-items: center; gap: 12px; }
        .inputs-flex { flex: 1; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gray-text); text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #f9fafb; transition: 0.2s; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }
        #pickup, #dropoff { padding-right: 40px; }

        /* Autocomplete */
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 10000; max-height: 300px; overflow-y: auto; border-radius: 0 0 16px 16px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); display: none; margin-top: 4px; border: 1px solid #eee; }
        .autocomplete-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9fafb; }
        .loc-icon { background: #f3f4f6; color: #6b7280; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .loc-name { font-weight: 600; font-size: 14px; color: var(--text); }
        .loc-address { font-size: 11px; color: var(--gray-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        /* Results Card */
        .results-card { position: fixed; bottom: 20px; left: 16px; right: 16px; background: white; padding: 20px; border-radius: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 1002; transform: translateY(150%); transition: 0.4s; opacity: 0; }
        .results-card.visible { transform: translateY(0); opacity: 1; }
        .action-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { border: none; border-radius: 12px; padding: 10px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .btn-whatsapp { background: #25D366; color: white; }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="inputs-container">
        <div class="inputs-flex">
            <div class="input-group">
                <label>Pickup</label>
                <input type="text" id="pickup" placeholder="Search pickup..." autocomplete="off">
                <div id="p-results" class="autocomplete-list"></div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>Destination</label>
                <input type="text" id="dropoff" placeholder="Search destination..." autocomplete="off">
                <div id="d-results" class="autocomplete-list"></div>
            </div>
        </div>
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="fare" style="margin:0; color:var(--primary); font-size:32px;">RM 0</h2>
        <span id="dist" style="font-size:12px; font-weight:700; color:var(--gray-text);">0 km</span>
    </div>
    <div class="action-bar">
        <button class="action-btn btn-whatsapp" id="btn-whatsapp">💬 WhatsApp</button>
        <button class="action-btn" style="background:#f1f5f9;" id="btn-copy">📋 Copy</button>
        <button class="action-btn" style="background:#4285F4; color:white;" id="btn-maps">🗺️ Maps</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    HOTSPOTS: {
        "Setia City Mall": [
            { name: "SCM - West Entrance (Village)", lat: 3.10852, lon: 101.44315 },
            { name: "SCM - Main Lobby (South)", lat: 3.10931, lon: 101.44473 },
            { name: "SCM - East Entrance (Convention)", lat: 3.11025, lon: 101.44618 },
            { name: "SCM - North Entrance (Lulu)", lat: 3.11112, lon: 101.44521 }
        ],
        "KLCC": [
            { name: "Suria KLCC - Ramlee Entrance", lat: 3.1576, lon: 101.7116 },
            { name: "KLCC - Convention Centre Side", lat: 3.1539, lon: 101.7135 },
            { name: "Petronas Twin Towers - Main Lobby", lat: 3.1579, lon: 101.7122 },
            { name: "Suria KLCC - Ampang Entrance", lat: 3.1586, lon: 101.7128 }
        ]
    }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer;

const map = L.map("map", { zoomControl: false }).setView([3.1478, 101.6953], 12);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

function renderResults(features, resultsId, type) {
    const list = $(resultsId);
    const query = (type === 'pickup' ? $("pickup").value : $("dropoff").value).toLowerCase();
    let html = "";

    // 1. HOTSPOT INJECTION (Checks for Setia City or KLCC)
    for (const key in CONFIG.HOTSPOTS) {
        if (query.includes(key.toLowerCase()) || (key === "Setia City Mall" && query.includes("scm")) || (key === "KLCC" && query.includes("klcc"))) {
            CONFIG.HOTSPOTS[key].forEach(spot => {
                html += `
                <div class="autocomplete-item" onclick="selectLoc('${type}', [${spot.lat}, ${spot.lon}], '${spot.name}')">
                    <div class="loc-icon" style="background:#def7ec; color:#059669;">🚪</div>
                    <div class="loc-details">
                        <div class="loc-name" style="color:#059669;">${spot.name}</div>
                        <div class="loc-address">${key}, Malaysia</div>
                    </div>
                </div>`;
            });
        }
    }

    // 2. API RESULTS with Landmark Name Fix
    features.forEach(f => {
        const a = f.address;
        const mainName = a.mall || a.amenity || a.building || a.attraction || a.tourism || a.leisure || a.shop || a.name || "Location";
        
        // Avoid duplicates if we already showed hotspots
        if (mainName.toLowerCase().includes("setia city") && html.includes("SCM")) return;
        if (mainName.toLowerCase().includes("klcc") && html.includes("KLCC")) return;

        const sub = f.display_name.split(',').slice(1, 4).join(',').trim();
        html += `
        <div class="autocomplete-item" onclick="selectLoc('${type}', [${f.lat}, ${f.lon}], '${mainName}')">
            <div class="loc-icon">📍</div>
            <div class="loc-details">
                <div class="loc-name">${mainName}</div>
                <div class="loc-address">${sub}</div>
            </div>
        </div>`;
    });

    list.innerHTML = html;
    list.style.display = html ? 'block' : 'none';
}

function selectLoc(type, coord, label) {
    if (type === 'pickup') { pickupCoord = coord; $("pickup").value = label; $("p-results").style.display = 'none'; } 
    else { dropoffCoord = coord; $("dropoff").value = label; $("d-results").style.display = 'none'; }
    if (pickupCoord && dropoffCoord) calculate();
}

async function calculate() {
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        const km = route.summary.distance / 1000;
        
        // Simple Fare: RM 5 Base + RM 1.25 per KM
        const total = Math.round(5 + (km * 1.25));

        $("fare").innerText = `RM ${total}`;
        $("dist").innerText = `${km.toFixed(1)} km`;
        $("results").classList.add('visible');
        
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 5}).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});
    } catch (e) { console.error(e); }
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

$("pickup").oninput = e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${e.target.value}&countrycodes=my&addressdetails=1&limit=6`);
        renderResults(await res.json(), "p-results", "pickup");
    }, 500);
};

$("dropoff").oninput = e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${e.target.value}&countrycodes=my&addressdetails=1&limit=6`);
        renderResults(await res.json(), "d-results", "dropoff");
    }, 500);
};

$("btn-whatsapp").onclick = () => {
    const msg = encodeURIComponent(`Booking: ${$("pickup").value} to ${$("dropoff").value}. Fare: ${$("fare").innerText}`);
    window.open(`https://wa.me/60108988182?text=${msg}`);
};
</script>
</body>
</html>
