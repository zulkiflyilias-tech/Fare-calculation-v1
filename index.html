<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v5.8.8 PRO (Overpass Enabled)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --gray-text: #6b7280; --accent: #f59e0b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .search-panel { background: var(--card-bg); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1005; }
        .inputs-container { display: flex; align-items: center; gap: 12px; }
        .inputs-flex { flex: 1; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gray-text); text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #f9fafb; transition: 0.2s; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }
        
        #pickup, #dropoff { padding-right: 85px; }

        .swap-btn { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; }
        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 4px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: #9ca3af; font-size: 18px; }
        
        .autocomplete-list { 
            position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 10000; 
            max-height: 420px; overflow-y: auto; border-radius: 0 0 12px 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12); border: 1px solid #e0e0e0; border-top: none; display: none;
        }

        .autocomplete-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f8f9fa; transition: background 0.2s; }
        .autocomplete-item:hover { background: #f1f3f4; }
        .loc-details { flex: 1; min-width: 0; }
        .loc-name { font-weight: 500; font-size: 15px; color: #202124; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .loc-address { font-size: 13px; color: #70757a; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .loc-arrow { color: #bdc1c6; font-size: 18px; margin-left: 12px; flex-shrink: 0; }
        .entrance-badge { font-size: 9px; background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }

        #map { flex-grow: 1; width: 100%; z-index: 1; }

        .results-card { position: fixed; bottom: 20px; left: 16px; right: 16px; background: white; padding: 20px; border-radius: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 1002; border: 1px solid #f1f5f9; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateY(150%); opacity: 0; pointer-events: auto; }
        .results-card.visible { transform: translateY(0); opacity: 1; }
        .fare-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        #fare { margin:0; color:var(--primary); font-size:32px; }
        .action-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { border: none; border-radius: 12px; padding: 10px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-transform: uppercase; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-copy { background: #f1f5f9; color: #475569; }
        .btn-maps { background: #4285F4; color: white; }
    </style>
</head>
<body>

<div class="search-panel">
    <div class="inputs-container">
        <div class="inputs-flex">
            <div class="input-group">
                <label>Pickup</label>
                <input type="text" id="pickup" placeholder="Set pickup..." autocomplete="off">
                <div class="btn-container">
                    <button id="clear-p" class="icon-btn" style="display:none">✕</button>
                    <button id="gps-btn" class="icon-btn">📍</button>
                </div>
                <div id="p-results" class="autocomplete-list"></div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>Destination</label>
                <input type="text" id="dropoff" placeholder="Where to?" autocomplete="off">
                <div class="btn-container">
                    <button id="clear-d" class="icon-btn" style="display:none">✕</button>
                </div>
                <div id="d-results" class="autocomplete-list"></div>
            </div>
        </div>
        <button id="swap-btn" class="swap-btn">⇅</button>
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div class="fare-header">
        <div>
            <h2 id="fare">RM 0</h2>
            <div id="summary" style="font-size:12px; color:#4b5563;"></div>
        </div>
        <span id="badge" style="font-size:10px; font-weight:800; padding:4px 10px; background:#f1f5f9; border-radius:20px;">STANDARD</span>
    </div>
    <div class="action-bar">
        <button class="action-btn btn-whatsapp" id="btn-whatsapp">WhatsApp</button>
        <button class="action-btn btn-copy" id="btn-copy">Copy</button>
        <button class="action-btn btn-maps" id="btn-maps">Maps</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { BASE: 5.00, KM: 1.20, TIME: 0.20 }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, searchTimer, routeLayer;

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([3.1478, 101.6953], 13);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

// DEBOUNCE SEARCH
function debounceSearch(input, resultsId, type) {
    const query = input.value;
    $(type === 'pickup' ? 'clear-p' : 'clear-d').style.display = query ? 'block' : 'none';
    clearTimeout(searchTimer);
    if (query.length < 3) { $(resultsId).style.display = 'none'; return; }
    searchTimer = setTimeout(() => fetchLocations(query, resultsId, type), 400);
}

async function fetchLocations(query, resultsId, type) {
    try {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=3.14&lon=101.69&limit=10`);
        const data = await res.json();
        renderResults(data.features, resultsId, type, query);
    } catch (e) { console.error(e); }
}

async function fetchEntrances(lat, lon, name) {
    // Overpass API Query: Finds entrances/gates within 300m of the main POI
    const query = `[out:json];(node["entrance"](around:300,${lat},${lon});node["gate"](around:300,${lat},${lon}););out body;`;
    try {
        const res = await fetch("https://overpass-api.de/api/interpreter", {
            method: "POST",
            body: query
        });
        const data = await res.json();
        return data.elements.map(el => ({
            name: `${name} - ${el.tags.description || el.tags.name || el.tags.ref || 'Entrance'}`,
            lat: el.lat,
            lon: el.lon,
            isEntrance: true
        }));
    } catch (e) { return []; }
}

async function renderResults(features, resultsId, type, originalQuery) {
    const list = $(resultsId);
    let html = "";

    for (const f of features) {
        const p = f.properties;
        const [lon, lat] = f.geometry.coordinates;
        const mainName = p.name || p.street || "Location";
        const subAddress = [p.street, p.district, p.city].filter(x => x && x !== mainName).join(', ');

        // Main Result
        html += `
            <div class="autocomplete-item" onclick="selectLoc('${type}', [${lat}, ${lon}], '${mainName}')">
                <div class="loc-details">
                    <div class="loc-name">${mainName}</div>
                    <div class="loc-address">${subAddress || 'Malaysia'}</div>
                </div>
                <div class="loc-arrow">↖</div>
            </div>`;

        // If it's a major landmark (like KLCC), fetch entrances dynamically
        if (["mall", "station", "hospital", "stadium", "complex"].some(word => mainName.toLowerCase().includes(word)) || mainName.toLowerCase().includes(originalQuery.toLowerCase())) {
            const entrances = await fetchEntrances(lat, lon, mainName);
            entrances.forEach(ent => {
                html += `
                    <div class="autocomplete-item" onclick="selectLoc('${type}', [${ent.lat}, ${ent.lon}], '${ent.name}')" style="background: #fafafa; padding-left: 30px;">
                        <div class="loc-details">
                            <div class="loc-name">📍 ${ent.name} <span class="entrance-badge">PICK-UP</span></div>
                            <div class="loc-address">Specific Entrance/Gate</div>
                        </div>
                    </div>`;
            });
        }
    }

    list.innerHTML = html || `<div class="autocomplete-item">No results found</div>`;
    list.style.display = 'block';
}

function selectLoc(type, coord, label) {
    if (type === 'pickup') { pickupCoord = coord; $("pickup").value = label; $("p-results").style.display = 'none'; } 
    else { dropoffCoord = coord; $("dropoff").value = label; $("d-results").style.display = 'none'; }
    calculate();
}

async function calculate() {
    if (!pickupCoord || !dropoffCoord) return;
    const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
        body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
    });
    const data = await res.json();
    const route = data.routes[0];
    const km = route.summary.distance / 1000;
    const fare = Math.round(CONFIG.RATES.BASE + (km * CONFIG.RATES.KM));

    $("fare").innerText = `RM ${fare}`;
    $("summary").innerText = `${km.toFixed(1)} km • ${Math.ceil(route.summary.duration/60)} min`;
    $("results").classList.add('visible');

    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline(decodePoly(route.geometry), {color: '#059669', weight: 5}).addTo(map);
    map.fitBounds(routeLayer.getBounds(), {padding: [50,50]});
}

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

$("pickup").oninput = e => debounceSearch(e.target, "p-results", "pickup");
$("dropoff").oninput = e => debounceSearch(e.target, "d-results", "dropoff");
$("swap-btn").onclick = () => {
    let pV = $("pickup").value, dV = $("dropoff").value;
    $("pickup").value = dV; $("dropoff").value = pV;
    let tC = pickupCoord; pickupCoord = dropoffCoord; dropoffCoord = tC;
    calculate();
};
</script>
</body>
</html>
