<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - v6.0 Elite</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --gray-text: #6b7280; --accent: #f59e0b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Layout */
        .search-panel { background: var(--card-bg); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 1005; border-bottom: 1px solid #e5e7eb; }
        .inputs-container { display: flex; align-items: center; gap: 12px; }
        .inputs-flex { flex: 1; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gray-text); text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 14px; background: #f9fafb; transition: 0.2s; box-sizing: border-box; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1); }
        
        /* UI Components */
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 10000; max-height: 320px; overflow-y: auto; border-radius: 0 0 16px 16px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); display: none; border: 1px solid #eee; margin-top: 4px; }
        .autocomplete-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9fafb; }
        .autocomplete-item:hover { background: #f9fafb; }
        .poi-sub-item { margin-left: 40px; border-left: 2px dashed #059669; background: #f0fdf4; font-size: 13px; }
        
        .loc-icon { background: #f3f4f6; color: #6b7280; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .loc-name { font-weight: 600; font-size: 14px; color: var(--text); }
        .loc-address { font-size: 11px; color: var(--gray-text); }

        #map { flex-grow: 1; width: 100%; z-index: 1; cursor: crosshair; }
        
        .btn-container { position: absolute; right: 8px; top: 24px; display: flex; gap: 4px; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: #9ca3af; font-size: 18px; }
        .loading-spin { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Bottom Results Card */
        .results-card { position: fixed; bottom: 20px; left: 16px; right: 16px; background: white; padding: 20px; border-radius: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 1002; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateY(150%); }
        .results-card.visible { transform: translateY(0); }

        /* Action Buttons */
        .action-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { border: none; border-radius: 12px; padding: 10px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-maps { background: #4285F4; color: white; }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 10px 20px; border-radius: 30px; font-size: 12px; z-index: 10001; opacity: 0; transition: 0.3s; pointer-events: none; }
    </style>
</head>
<body>

<div id="toast" class="toast">Tap map for exact pickup spot</div>

<div class="search-panel">
    <div class="inputs-container">
        <div class="inputs-flex">
            <div class="input-group">
                <label>Pickup (Tap map to refine)</label>
                <input type="text" id="pickup" placeholder="Set pickup..." autocomplete="off">
                <div class="btn-container">
                    <button id="gps-btn" class="icon-btn">📍</button>
                </div>
                <div id="p-results" class="autocomplete-list"></div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>Destination</label>
                <input type="text" id="dropoff" placeholder="Where to?" autocomplete="off">
                <div id="d-results" class="autocomplete-list"></div>
            </div>
        </div>
        <button id="swap-btn" style="background:none; border:1px solid #eee; border-radius:50%; width:40px; height:40px; cursor:pointer;">⇅</button>
    </div>
</div>

<div id="map"></div>

<div id="results" class="results-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="fare" style="margin:0; color:var(--primary); font-size:32px;">RM 0</h2>
        <span id="badge" style="font-size:10px; font-weight:800; padding:4px 10px; background:#f1f5f9; border-radius:20px;">STANDARD</span>
    </div>
    <p id="summary" style="font-size:12px; color:#4b5563; margin-top:8px;"></p>
    <div class="action-bar">
        <button class="action-btn btn-whatsapp" id="btn-whatsapp">💬 WhatsApp</button>
        <button class="action-btn btn-maps" id="btn-maps">🗺️ Maps</button>
        <button class="action-btn" id="btn-copy" style="background:#eee;">📋 Copy</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",
    RATES: { BASE: 5.0, KM_TIER_1: 1.25, TIME_RATE: 0.30 }
};

const $ = id => document.getElementById(id);
let pickupCoord, dropoffCoord, routeLayer, searchTimer;
let pickupMarker, dropoffMarker;

// Initialize Map with Stadia Maps Alidade Smooth (Google-like)
const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([3.1478, 101.6953], 12);
L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png').addTo(map);

// --- 1. Map Interaction Logic ---

map.on('click', async (e) => {
    const { lat, lng } = e.latlng;
    updateMarker('pickup', [lat, lng]);
    showToast("Finding nearest curb...");
    
    // Reverse Geocode via Nominatim
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
        const data = await res.json();
        const name = data.display_name.split(',')[0] || "Pinned Location";
        $("pickup").value = `📍 ${name}`;
        pickupCoord = [lat, lng];
        calculate();
    } catch (err) { console.error(err); }
});

function updateMarker(type, coord) {
    if (type === 'pickup') {
        if (pickupMarker) map.removeLayer(pickupMarker);
        pickupMarker = L.circleMarker(coord, { radius: 8, color: '#059669', fillOpacity: 1 }).addTo(map);
    } else {
        if (dropoffMarker) map.removeLayer(dropoffMarker);
        dropoffMarker = L.circleMarker(coord, { radius: 8, color: '#ef4444', fillOpacity: 1 }).addTo(map);
    }
}

// --- 2. Nominatim Forward Search + Overpass POI Logic ---

async function searchLocations(input, resultsId, type) {
    const query = input.value;
    if (query.length < 3) return;

    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
        try {
            // Forward Search via Nominatim
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=MY&limit=5&addressdetails=1`);
            const data = await res.json();
            renderResults(data, resultsId, type);
        } catch (e) { console.error(e); }
    }, 400);
}

async function renderResults(data, resultsId, type) {
    const list = $(resultsId);
    list.innerHTML = "";
    
    for (const item of data) {
        const name = item.display_name.split(',')[0];
        const address = item.display_name.split(',').slice(1, 3).join(',');
        
        // Main Item
        const div = document.createElement('div');
        div.className = "autocomplete-item";
        div.innerHTML = `<div class="loc-icon">🏢</div><div><div class="loc-name">${name}</div><div class="loc-address">${address}</div></div>`;
        div.onclick = () => selectLoc(type, [item.lat, item.lon], name);
        list.appendChild(div);

        // Venue Logic: If it's a Mall/Station, query Overpass for Entrances
        if (item.type === "mall" || item.type === "station" || item.class === "railway") {
            const entrances = await fetchEntrances(item.lat, item.lon);
            entrances.forEach(ent => {
                const sub = document.createElement('div');
                sub.className = "autocomplete-item poi-sub-item";
                sub.innerHTML = `<div class="loc-icon" style="font-size:10px">🚪</div><div><div class="loc-name" style="font-size:12px;">${ent.tags.name || 'Entrance'}</div></div>`;
                sub.onclick = (e) => { 
                    e.stopPropagation(); 
                    selectLoc(type, [ent.lat, ent.lon], `${name} (${ent.tags.name || 'Side Entrance'})`); 
                };
                list.appendChild(sub);
            });
        }
    }
    list.style.display = 'block';
}

async function fetchEntrances(lat, lon) {
    const query = `[out:json][timeout:5];
        (node["entrance"](around:200,${lat},${lon});
         node["railway"="platform"](around:200,${lat},${lon}););
        out body;`;
    try {
        const res = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: query });
        const data = await res.json();
        return data.elements.slice(0, 3); // Return top 3 entrances
    } catch { return []; }
}

function selectLoc(type, coord, label) {
    const latlng = [parseFloat(coord[0]), parseFloat(coord[1])];
    if (type === 'pickup') { 
        pickupCoord = latlng; 
        $("pickup").value = label; 
        $("p-results").style.display = 'none';
        map.flyTo(latlng, 18, { duration: 1.5 });
    } else { 
        dropoffCoord = latlng; 
        $("dropoff").value = label; 
        $("d-results").style.display = 'none';
    }
    updateMarker(type, latlng);
    calculate();
}

// --- 3. Routing & Costing ---

async function calculate() {
    if (!pickupCoord || !dropoffCoord) return;
    try {
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": CONFIG.ORS_KEY },
            body: JSON.stringify({ coordinates: [[pickupCoord[1], pickupCoord[0]], [dropoffCoord[1], dropoffCoord[0]]] })
        });
        const data = await res.json();
        const route = data.routes[0];
        const km = route.summary.distance / 1000;
        const fare = Math.max(8, (CONFIG.RATES.BASE + (km * CONFIG.RATES.KM_TIER_1))).toFixed(0);

        $("fare").innerText = `RM ${fare}`;
        $("summary").innerText = `${km.toFixed(1)} km • ${Math.ceil(route.summary.duration/60)} min`;
        $("results").classList.add('visible');

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(decodePoly(route.geometry), { color: '#059669', weight: 6, opacity: 0.8 }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
    } catch (err) { console.error(err); }
}

// --- 4. Utilities ---

function decodePoly(str) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coordinates.push([lat / 1e5, lng / 1e5]);
    }
    return coordinates;
}

function showToast(msg) {
    const t = $("toast");
    t.innerText = msg;
    t.style.opacity = 1;
    setTimeout(() => t.style.opacity = 0, 3000);
}

// --- 5. Event Listeners ---

$("gps-btn").onclick = () => {
    $("gps-btn").innerHTML = '<span class="loading-spin">⌛</span>';
    navigator.geolocation.getCurrentPosition(pos => {
        const coord = [pos.coords.latitude, pos.coords.longitude];
        $("gps-btn").innerText = '📍';
        selectLoc('pickup', coord, "Current Location");
        showToast("Tap map to refine curb spot");
    });
};

$("btn-maps").onclick = () => {
    if (!pickupCoord || !dropoffCoord) return;
    const url = `https://www.google.com/maps/dir/?api=1&origin=${pickupCoord[0]},${pickupCoord[1]}&destination=${dropoffCoord[0]},${dropoffCoord[1]}&travelmode=driving`;
    window.open(url, '_blank');
};

$("pickup").oninput = (e) => searchLocations(e.target, "p-results", "pickup");
$("dropoff").oninput = (e) => searchLocations(e.target, "d-results", "dropoff");

// Initial State
setTimeout(() => showToast("Tap map for exact pickup spot"), 1000);
</script>
</body>
</html>
